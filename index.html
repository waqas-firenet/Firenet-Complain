.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 13px;border-radius:12px;color:#fff;background:var(--d);font-weight:900;text-decoration:none}.btn-p{background:var(--p)}.btn-s{background:var(--s)}.btn-e{background:var(--e)}.btn-i{background:var(--i)}.btn-w{background:var(--w)}.btn-l{background:#e5e7eb;color:#111827}.btn-sm{font-size:12px;padding:7px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap}

@media(max-width:560px){.target-mini{grid-template-columns:1fr}.news-ticker .ticker-inner{animation-duration:14s}}

<script>

let S,U,TAB='dashboard',draft=[],db=null,fbReady=false,fbLoading=false,unsubs=[];
let financeDate=today(), financeAll=true, financeEmp='all', complaintDate=today(), complaintAll=false;

function def(){return{admin:{u:'admin',p:'admin123'},employees:[{id:'e1',name:'Ali',phone:'ali',mobile:'03001234561',pin:'1234',role:'Collection',active:true,per:{complaints:1,attendance:1,invoice:1,finance:1,targets:1,advance:1}},{id:'e2',name:'Usman',phone:'usman',mobile:'03001234562',pin:'1234',role:'Technician',active:true,per:{complaints:1,attendance:1,invoice:1,finance:0,targets:1,advance:1}}],complaints:[],finance:[],invoices:[],targets:[],attendance:[],advances:[],news:{text:'Welcome to Fire.net.pk employee portal. Complete your tasks on time.',active:true},
items:[
 {id:'it1',name:'ONU Router',category:'Device',purchase:4000,sale:5000,stock:10,notes:'Default device'},

function sanitizeState(){
 const D=def();
 S=S||D;
 S.admin=S.admin||D.admin;
 S.employees=Array.isArray(S.employees)?S.employees:D.employees;
 S.complaints=Array.isArray(S.complaints)?S.complaints:[];
 S.finance=Array.isArray(S.finance)?S.finance:[];
 S.invoices=Array.isArray(S.invoices)?S.invoices:[];
 S.targets=Array.isArray(S.targets)?S.targets:[];
 S.attendance=Array.isArray(S.attendance)?S.attendance:[];
 S.advances=Array.isArray(S.advances)?S.advances:[];
 S.items=Array.isArray(S.items)?S.items:D.items;
 S.packages=Array.isArray(S.packages)?S.packages:D.packages;
 S.news=S.news||D.news;
 S.employees.forEach(e=>{e.per=e.per||{complaints:1,attendance:1,invoice:1,finance:1,advance:1,targets:1};e.active=e.active!==false;});
 S.targets.forEach(t=>{t.targetType=t.targetType||'collection';t.date=t.date||today();t.closed=!!t.closed;t.inactive=!!t.inactive;});
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY)||'null')||def()}catch(e){S=def()}sanitizeState();saveLocal()}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(S))}
function setSync(t,ok){const el=document.getElementById('syncStatus');if(el){el.textContent=t;el.style.color=ok?'#166534':t.includes('failed')||t.includes('error')?'#dc2626':'#475569'}}
function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function now(){return new Date().toLocaleString()}
function money(n){return'Rs. '+(Number(n)||0).toLocaleString()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function key(){return U.role==='admin'?'admin':U.id}
function can(x){return U.role==='admin'||U.per?.[x]}
function toast(m,t='info'){let d=document.createElement('div');d.className='toast '+t;d.textContent=m;document.getElementById('tw').appendChild(d);setTimeout(()=>d.remove(),3200)}
function beep(){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.04;o.start();setTimeout(()=>{o.stop();c.close()},150)}catch(e){}}
function clock(){document.getElementById('dt').textContent=new Date().toLocaleString()}setInterval(clock,1000);
function pkMobile(v){v=String(v||'').replace(/\D/g,'');if(v.startsWith('92')&&v.length===12)return '0'+v.slice(2);if(v.startsWith('0')&&v.length===11)return v;return v}
function waNumber(v){v=String(v||'').replace(/\D/g,'');if(v.startsWith('0')&&v.length===11)return '92'+v.slice(1);if(v.startsWith('92')&&v.length===12)return v;return v}
function validPk(v){return /^03\d{9}$/.test(pkMobile(v))}

async function initFirebase(){
 try{
   if(!window.firebase){setSync('Firebase SDK not loaded',false);return}
   if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
   db=firebase.firestore(); fbReady=true; setSync('Firebase: connected',true);
   await loadFirebase(); startRealtime();
 }catch(e){console.error(e);setSync('Firebase error: '+(e.message||e),false)}
}
async function loadCol(c){const s=await db.collection(c).get();return s.docs.map(d=>({id:d.id,...d.data()}))}
async function loadFirebase(){
 if(!db)return; fbLoading=true; setSync('Firebase: loading');
 try{
   const settings=await db.collection('settings').doc('main').get();
   if(settings.exists){if(settings.data().admin)S.admin=settings.data().admin;if(settings.data().news)S.news=settings.data().news;}
   const [employees,complaints,finance,invoices,targets,attendance,items,packages,advances]=await Promise.all(['employees','complaints','finance','invoices','targets','attendance','items','packages','advances'].map(loadCol));
   if(employees.length)S.employees=employees;
   S.complaints=complaints;S.finance=finance;S.invoices=invoices;S.targets=targets;S.attendance=attendance;if(items.length)S.items=items;if(packages.length)S.packages=packages;if(advances.length)S.advances=advances;
   saveLocal(); setSync('Firebase: loaded',true);
   if(!employees.length) for(const e of S.employees) await fbSet('employees',e);if(!items.length) for(const e of S.items||[]) await fbSet('items',e);if(!packages.length) for(const e of S.packages||[]) await fbSet('packages',e);if(!advances.length) for(const e of S.advances||[]) await fbSet('advances',e);
 }catch(e){console.error(e);setSync('Firebase load failed',false);toast('Firebase load failed: '+(e.message||e),'error')}
 fbLoading=false;
}
function startRealtime(){
 if(!db)return; unsubs.forEach(u=>u&&u()); unsubs=[];
 ['employees','complaints','finance','invoices','targets','attendance','items','packages','advances'].forEach(col=>{
   unsubs.push(db.collection(col).onSnapshot(snap=>{
     if(fbLoading)return;
     S[col]=snap.docs.map(d=>({id:d.id,...d.data()})); saveLocal();
     if(U&&TAB) renderCurrent();
   },e=>setSync('Firebase realtime failed',false)));
 });
}
async function fbSet(col,obj){if(!fbReady||fbLoading||!obj?.id)return;try{await db.collection(col).doc(obj.id).set(JSON.parse(JSON.stringify(obj)),{merge:true});setSync('Firebase: synced',true)}catch(e){console.error(e);toast('Firebase write failed','error');setSync('Firebase write failed',false)}}
async function fbDel(col,i){if(!fbReady||!i)return;try{await db.collection(col).doc(i).delete();setSync('Firebase: deleted',true)}catch(e){toast('Firebase delete failed','error')}}
async function fbSettings(){if(!fbReady)return;try{await db.collection('settings').doc('main').set({admin:S.admin,news:S.news},{merge:true})}catch(e){}}
function saveAndSync(col,obj){saveLocal();if(col&&obj)fbSet(col,obj)}
function delAndSync(col,idv){saveLocal();if(col&&idv)fbDel(col,idv)}

function loginUser(){let u=lu.value.trim(),p=lp.value.trim();if(!u||!p)return toast('Enter username and password','error');if(u.toLowerCase()===S.admin.u&&p===S.admin.p){U={role:'admin',id:'admin',name:'Administrator'};S.session=U;saveLocal();return openApp()}let e=S.employees.find(x=>x.active&&(String(x.phone).toLowerCase()===u.toLowerCase()||String(x.name).toLowerCase()===u.toLowerCase()||String(x.mobile||'')===u)&&x.pin===p);if(e){U={role:'employee',...e};S.session=U;saveLocal();return openApp()}toast('Invalid login','error')}
function openApp(){sanitizeState();if(!U||!U.role){S.session=null;saveLocal();return location.reload()}document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').style.display='block';pn.textContent=U.name||'User';pr.textContent=U.role==='admin'?'Admin':(U.role||'Employee');av.textContent=(U.name||'U')[0].toUpperCase();clock();navRender();tab('dashboard');notify()}
function logout(){S.session=null;saveLocal();location.reload()}function toggleMenu(){pm.classList.toggle('active')}function openPwd(){pwdModal.classList.add('active');pm.classList.remove('active')}function closePwd(){pwdModal.classList.remove('active')}

function items(){let a=[['dashboard','Dashboard','📊'],['complaints','Complaints','🛠️'],['employees','Employees','👥'],['attendance','Attendance','🗓️'],['invoice','Invoice','🧾'],['finance','Finance','💰'],['items','Items','📦'],['packages','Packages','📶'],['advance','Advance','💸'],['targets','Targets','🎯'],['news','News','📢'],['backup','Backup','💾']];return U.role==='admin'?a:a.filter(x=>x[0]==='dashboard'||can(x[0]))}

function toggleSideMenu(){document.getElementById('sidePanel')?.classList.toggle('open')}

function renderCurrent(){
 try{
  sanitizeState();
  ({dashboard:dash,complaints,employees,attendance,invoice,finance,items:itemsPage,packages:packagesPage,advance:advancePage,targets,news:(typeof newsPage==='function'?newsPage:dash),backup}[TAB]||dash)();

function employeeAccountSummary(empId){
 const fRows=S.finance.filter(e=>e.by===empId);
 const income=fRows.filter(e=>typeOf(e)==='income').reduce((s,e)=>s+(+e.amount||0),0);
 const expense=fRows.filter(e=>typeOf(e)==='expense').reduce((s,e)=>s+(+e.amount||0),0);
 const cash=fRows.filter(e=>modeOf(e)==='cash').reduce((s,e)=>s+(+e.amount||0),0);
 const online=fRows.filter(e=>modeOf(e)==='online').reduce((s,e)=>s+(+e.amount||0),0);
 const adv=advanceCalc(empId);
 const tRows=S.targets.filter(t=>t.emp===empId);
 const targetGiven=tRows.reduce((s,t)=>s+(+t.target||0),0);
 const targetAch=tRows.reduce((s,t)=>s+(+t.achieved||0),0);
 const reward=tRows.reduce((s,t)=>s+rewardEarned(t),0);
 const achievedTargets=tRows.filter(t=>targetStatus(t)==='Achieved').length;
 const missedTargets=tRows.filter(t=>targetStatus(t)==='Missed').length;
 const inactiveTargets=tRows.filter(t=>targetStatus(t)==='Inactive').length;
 const invRows=S.invoices.filter(v=>v.by===empId||v.refEmp===empId);
 const invSales=invRows.reduce((s,v)=>s+(+v.total||0),0);
 const invDue=invRows.reduce((s,v)=>s+(+v.due||0),0);
 const comps=S.complaints.filter(c=>c.assigned===empId||c.by===empId);
 const pending=comps.filter(c=>c.status!=='Resolved').length;
 return {income,expense,cash,online,balance:income-expense,adv,targetGiven,targetAch,reward,achievedTargets,missedTargets,inactiveTargets,invSales,invDue,comps,pending,fRows,invRows,tRows};
}

}

function advanceCalc(empId){
 let r=(S.advances||[]).filter(x=>x.emp===empId),given=0,adjustment=0,returned=0;
 r.forEach(x=>{let a=+x.amount||0;if(x.type==='given')given+=a;else if(x.type==='adjustment')adjustment+=a;else if(x.type==='return')returned+=a});
 return {given,adjustment,returned,balance:given-adjustment-returned};
}

function targetStatus(t){
 const pct=(+t.achieved||0)/(+t.target||1)*100;
 if(t.inactive)return 'Inactive';
 if(t.closed && pct>=100)return 'Achieved';
 if(t.closed && pct<100)return 'Missed';
 if(t.date<today() && pct>=100)return 'Achieved';
 if(t.date<today() && pct<100)return 'Missed';
 if(pct>=100)return 'Achieved';
 return 'Active';
}
function targetStatusBadge(t){
 const s=targetStatus(t);
 if(s==='Achieved')return '<span class="badge done">Achieved</span>';
 if(s==='Missed')return '<span class="badge expense">Missed</span>';
 if(s==='Inactive')return '<span class="badge pending">Inactive</span>';
 return '<span class="badge online">Active</span>';
}
function inactiveTarget(i){
 const t=S.targets.find(x=>x.id===i);if(!t)return;
 t.inactive=true;t.closed=true;t.closedAt=now();
 saveAndSync('targets',t);toast('Target marked inactive','success');targets();
}
function deleteTarget(i){
 if(!confirm('Delete this target?'))return;
 S.targets=S.targets.filter(x=>x.id!==i);delAndSync('targets',i);targets();
}
function targets(){content.innerHTML=`${U.role==='admin'?`<div class="card"><div class="head"><h2>Assign Target</h2></div><div class="row"><div class="fg"><label>Employee</label><select id="te"><option value="all">All Active Employees</option>${empOpts()}</select></div><div class="fg"><label>Target Type</label><select id="tt" onchange="updateTargetValueLabel()"><option value="collection">Daily Recovery / Bill Collection Target (Amount)</option><option value="sales">Daily New Connection Sales Target (Count)</option></select></div><div class="fg"><label id="targetValueLabel">Target Value</label><input id="ta" type="number" value="20000" placeholder="Recovery amount or connection count"></div></div><div class="row"><div class="fg"><label>Target Date</label><input id="td" type="date" value="${today()}"></div><div class="fg"><label>Reward Type</label><select id="rt"><option value="fixed">Fixed Amount</option><option value="percentage">Percentage</option></select></div><div class="fg"><label>Reward Value</label><input id="rv" type="number" value="1000"></div></div><div class="fg"><label>Reward Label</label><input id="tr" value="Daily Target Reward"></div><p style="color:#64748b;font-weight:800;margin-bottom:10px">Daily targets close at day-end. Collection target is recovery/bill amount. Sales target is number of new connections.</p><button class="btn btn-p" onclick="assignTarget()">Assign Target</button></div>`:''}<div class="card"><div class="head"><h2>Target Progress</h2></div>${targetTable()}</div>`}

function updateTargetValueLabel(){
 const lbl=document.getElementById('targetValueLabel');
 const inp=document.getElementById('ta');
 if(!lbl||!inp||!document.getElementById('tt'))return;
 if(tt.value==='sales'){
   lbl.textContent='Sales Target (Number of New Connections)';
   inp.value=inp.value&&+inp.value<100?inp.value:5;
   inp.placeholder='Example: 5 connections';
 }else{
   lbl.textContent='Recovery / Collection Target Amount';
   inp.value=inp.value&&+inp.value>100?inp.value:20000;
   inp.placeholder='Example: 20000';
 }
}
function assignTarget(){
 let target=+ta.value||0;if(target<=0)return toast('Target required','error');
 let empList=te.value==='all'?S.employees.filter(e=>e.active).map(e=>e.id):[te.value];
 let count=0;
 empList.forEach(empId=>{
   let rec={id:id('t'),emp:empId,targetType:tt.value,target,achieved:0,rewardType:rt.value,rewardValue:+rv.value||0,reward:tr.value.trim()||'Reward',date:td.value||today(),closed:false,closedAt:''};
   S.targets.push(rec);fbSet('targets',rec);count++;
 });
 saveLocal();toast(`${count} ${tt.value==='sales'?'sales':'collection'} target(s) assigned`,'success');targets();
}
function applyTarget(emp,amount,targetType='collection'){
 closeOldDailyTargets();
 let t=S.targets.find(x=>x.emp===emp&&(x.targetType||'collection')===targetType&&x.date===today()&&!x.closed&&!x.inactive&&(+x.achieved)<(+x.target));
 if(t){
   // Collection/recovery target is rupees amount. Sales target is connection count.
   let addValue = targetType==='sales' ? 1 : (+amount||0);
   t.achieved=(+t.achieved)+addValue;
   if(t.achieved>=t.target){
     t.closed=true;t.closedAt=now();
     toast((targetType==='sales'?'New connection sales':'Recovery collection')+' target completed! Reward unlocked','success');beep();
   }
   saveAndSync('targets',t);
 }
}

function targetValueDisplay(t,v){
 return (t.targetType||'collection')==='sales' ? `${Number(v)||0} Conn.` : money(v);
}
function targetTable(){closeOldDailyTargets();let r=U.role==='admin'?S.targets:S.targets.filter(t=>t.emp===U.id);if(!r.length)return'<div class="empty">No targets</div>';return`<div class="tbl"><table><thead><tr><th>Employee</th><th>Date</th><th>Type</th><th>Target</th><th>Achieved</th><th>Progress</th><th>Status</th><th>Reward Rule</th><th>Reward Earned</th><th>Action</th></tr></thead><tbody>${r.slice().reverse().map(t=>{let p=Math.min(100,Math.round((+t.achieved||0)/(+t.target||1)*100));return`<tr><td>${empName(t.emp)}</td><td>${t.date}</td><td>${(t.targetType||'collection').toUpperCase()}</td><td>${targetValueDisplay(t,t.target)}</td><td>${targetValueDisplay(t,t.achieved)}</td><td><div class="prog"><div class="bar" style="width:${p}%"></div></div><b>${p}%</b></td><td>${targetStatusBadge(t)}</td><td>${t.rewardType==='percentage'?(+t.rewardValue||0)+'%':money(t.rewardValue)} - ${esc(t.reward)}</td><td>${money(rewardEarned(t))}</td><td>${U.role==='admin'?`<div class="actions"><button class="btn btn-w btn-sm" onclick="inactiveTarget('${t.id}')">Inactive</button><button class="btn btn-e btn-sm" onclick="deleteTarget('${t.id}')">Delete</button></div>`:'-'}</td></tr>`}).join('')}</tbody></table></div>`}

function newsPage(){
 if(U.role!=='admin')return dash();
 content.innerHTML=`<div class="card">
  <div class="head"><h2>Employee Dashboard News / Scrolling Announcement</h2></div>
  <div class="fg">
    <label>News Text</label>
    <textarea id="newsText" placeholder="Type announcement for employees">${esc(S.news?.text||'')}</textarea>
  </div>
  <label style="font-weight:900">
    <input type="checkbox" id="newsActive" ${S.news?.active?'checked':''}> Active / Show on employee dashboard
  </label>
  <br><br>
  <div class="actions">
    <button class="btn btn-p" onclick="saveNews()">Save News</button>
    <button class="btn btn-l" onclick="previewNews()">Preview</button>
  </div>
 </div>
 <div class="card">
   <div class="head"><h2>Preview</h2></div>
   <div class="news-admin-preview">${S.news?.active?'Active':'Inactive'}: ${esc(S.news?.text||'No news')}</div>
 </div>`;
}
function saveNews(){
 S.news={text:document.getElementById('newsText').value.trim(),active:document.getElementById('newsActive').checked};
 saveLocal();
 fbSettings();
 toast('News updated for employee dashboard','success');
 newsPage();
}
function previewNews(){
 S.news={text:document.getElementById('newsText').value.trim(),active:document.getElementById('newsActive').checked};
 newsPage();
}

function backup(){content.innerHTML=`<div class="card"><div class="head"><h2>Backup & Restore</h2></div><div class="actions"><button class="btn btn-s" onclick="syncAll()">Sync All to Firebase</button><button class="btn btn-i" onclick="loadFirebase()">Fetch Firebase</button><button class="btn btn-s" onclick="downloadBackup()">Download Backup</button><button class="btn btn-i" onclick="restoreFile.click()">Restore Backup</button><button class="btn btn-e" onclick="clearAll()">Clear All</button></div><input class="hidden" type="file" id="restoreFile" accept=".json" onchange="restoreBackup(event)"></div>`}
async function syncAll(){for(const e of S.employees)await fbSet('employees',e);for(const e of S.complaints)await fbSet('complaints',e);for(const e of S.finance)await fbSet('finance',e);for(const e of S.invoices)await fbSet('invoices',e);for(const e of S.targets)await fbSet('targets',e);for(const e of S.attendance)await fbSet('attendance',e);for(const e of (S.items||[]))await fbSet('items',e);for(const e of (S.packages||[]))await fbSet('packages',e);for(const e of (S.advances||[]))await fbSet('advances',e);await fbSettings();toast('Sync complete','success')}
function downloadBackup(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='firenet-backup-'+today()+'.json';a.click()}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);saveLocal();toast('Restored','success');setTimeout(()=>location.reload(),700)}catch(x){toast('Invalid backup','error')}};r.readAsText(f)}
function clearAll(){if(confirm('Clear all data?')){localStorage.removeItem(KEY);location.reload()}}
function notify(){let p=myComp().filter(c=>c.status!=='Resolved').length;if(U.role==='employee'&&p){toast(`You have ${p} pending task(s)`,'warning');beep()}}
window.onerror=function(msg,src,line,col,err){console.error('App error',msg,err);let c=document.getElementById('content');if(c&&document.getElementById('app').style.display==='block'){c.innerHTML=`<div class="card"><div class="head"><h2>App Error</h2></div><p style="color:#dc2626;font-weight:800">${esc(msg)}</p><button class="btn btn-e" onclick="localStorage.removeItem(KEY);location.reload()">Reset Local Data</button></div>`;}return false;};
load();window.addEventListener('load',()=>{clock();initFirebase();if(S.session){U=S.session;openApp()}});
</script>
</body>
