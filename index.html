<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ISP Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:inherit}
body{font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh}

/* THEMES */
body.dark{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--bd:#30363d;--tx:#e6edf3;--tx2:#8b949e;--tx3:#484f58;--ac:#58a6ff;--gn:#3fb950;--rd:#f85149;--am:#d29922;--cd:#161b22}
body.light{--bg:#f0f2f5;--bg2:#ffffff;--bg3:#e8eaed;--bd:#d0d7de;--tx:#1f2328;--tx2:#57606a;--tx3:#a8b0ba;--ac:#0969da;--gn:#1a7f37;--rd:#cf222e;--am:#9a6700;--cd:#ffffff}
body{background:var(--bg);color:var(--tx)}

/* LAYOUT */
#shell{display:flex;height:100vh;overflow:hidden}
#sb{width:210px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;transition:transform .28s,width .28s;overflow:hidden;z-index:300}
#sb.slim{width:52px}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200}
#overlay.show{display:block}

/* SIDEBAR */
.sb-logo{padding:14px 12px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:9px;white-space:nowrap;overflow:hidden;flex-shrink:0}
.sb-logo-icon{font-size:22px;flex-shrink:0}
.sb-logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:15px;overflow:hidden;white-space:nowrap}
.sb-logo-text span{color:var(--ac)}
#sbNav{flex:1;overflow-y:auto;padding:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#sbNav::-webkit-scrollbar{display:none}
.nb{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:none;background:none;color:var(--tx2);width:100%;text-align:left;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;transition:.15s;-webkit-tap-highlight-color:transparent;letter-spacing:0}
.nb:active{background:var(--bg3)}
.nb.on{background:rgba(88,166,255,.14);color:var(--ac);font-weight:600}
.nb .ni{font-size:17px;flex-shrink:0;width:22px;text-align:center}
.sb-foot{padding:10px 8px;border-top:1px solid var(--bd);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;overflow:hidden}
.sb-av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--gn));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}

/* TOPBAR */
#tb{height:52px;background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.tb-tog{background:none;border:none;color:var(--tx2);cursor:pointer;font-size:22px;padding:6px;line-height:1;border-radius:8px;-webkit-tap-highlight-color:transparent;flex-shrink:0}
.tb-tog:active{background:var(--bg3)}
#tbTitle{flex:1;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tb-r{display:flex;align-items:center;gap:6px;flex-shrink:0}
#clk{font-family:'DM Mono',monospace;font-size:11px;color:var(--tx2)}
#dbPill{font-size:10px;padding:3px 8px;border-radius:20px;font-family:'DM Mono',monospace}
.pill-local{background:rgba(210,153,34,.1);color:var(--am);border:1px solid rgba(210,153,34,.2)}
.pill-fb{background:rgba(63,185,80,.1);color:var(--gn);border:1px solid rgba(63,185,80,.2)}
#newsBar{background:var(--bg3);border-bottom:1px solid var(--bd);padding:5px 0;overflow:hidden;display:none}
.ntk{display:inline-block;white-space:nowrap;font-size:12px;color:var(--tx2);animation:tk 35s linear infinite}
@keyframes tk{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
#content{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;transition:.15s;white-space:nowrap;-webkit-tap-highlight-color:transparent;letter-spacing:0;line-height:1.3}
.btn:active{opacity:.75}
.btn-p{background:var(--ac);color:#fff}
.btn-g{background:var(--gn);color:#fff}
.btn-r{background:var(--rd);color:#fff}
.btn-a{background:var(--am);color:#fff}
.btn-w{background:#25d366;color:#fff}
.btn-gh{background:var(--bg3);color:var(--tx2);border:1px solid var(--bd)}
.sm{padding:5px 10px;font-size:12px;border-radius:6px}

/* CARDS */
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.ch h2{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* KPI */
.kg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:13px;position:relative;overflow:hidden}
.kl{font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:5px}
.kv{font-family:'Syne',sans-serif;font-size:19px;font-weight:800;line-height:1.1}
.ks{font-size:11px;color:var(--tx2);margin-top:3px}
.ki{position:absolute;right:10px;top:10px;font-size:20px;opacity:.2}
.kb{border-left:3px solid var(--ac)}.kg2{border-left:3px solid var(--gn)}.kr{border-left:3px solid var(--rd)}.ka{border-left:3px solid var(--am)}

/* TABLE — mobile cards on small screens */
.tw{overflow-x:auto;border-radius:8px;border:1px solid var(--bd);-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--bg3);padding:8px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
tbody tr{border-top:1px solid var(--bd)}
td{padding:8px 10px;vertical-align:middle}
.ta{display:flex;gap:4px;flex-wrap:wrap}
.empty{text-align:center;padding:32px;color:var(--tx3)}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace}
.bg{background:rgba(63,185,80,.12);color:var(--gn)}
.br{background:rgba(248,81,73,.12);color:var(--rd)}
.ba{background:rgba(210,153,34,.12);color:var(--am)}
.bb{background:rgba(88,166,255,.12);color:var(--ac)}
.bgr{background:rgba(128,128,128,.12);color:var(--tx2)}

/* TABS */
.tabs{display:flex;gap:3px;background:var(--bg3);border-radius:8px;padding:3px;margin-bottom:12px;flex-wrap:wrap}
.tb2{padding:6px 10px;border:none;background:none;color:var(--tx2);border-radius:6px;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif;transition:.15s;-webkit-tap-highlight-color:transparent}
.tb2.on{background:var(--cd);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.3)}

/* FORMS */
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.fw{grid-column:1/-1}
label{font-size:11px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{background:var(--bg3);border:1px solid var(--bd);border-radius:8px;color:var(--tx);padding:9px 12px;font-family:'DM Sans',sans-serif;font-size:16px;width:100%;outline:none;transition:border-color .15s;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
select option{background:var(--bg2)}
textarea{resize:vertical;min-height:70px;font-size:14px}
.ia{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* MODAL — full screen on mobile */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:900;display:none;align-items:flex-end;justify-content:center;padding:0}
.ov.open{display:flex}
.mb{background:var(--cd);border:1px solid var(--bd);border-radius:14px 14px 0 0;width:100%;max-width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 -4px 32px rgba(0,0,0,.4)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--cd);z-index:1}
.mh h3{font-family:'Syne',sans-serif;font-size:15px;font-weight:700}
.mbody{padding:16px}
.mf{padding:12px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* LOGIN */
#loginWrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.lc{background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:28px 20px;width:100%;max-width:360px}
.ll{text-align:center;margin-bottom:20px}
.ll-icon{font-size:40px;display:block;margin-bottom:8px}
.ll h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800}
.ll p{font-size:12px;color:var(--tx2);margin-top:3px}
.dbrow{display:flex;gap:6px;margin-bottom:12px}
.dbb{flex:1;padding:8px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.dbb.on{border-color:var(--ac);color:var(--ac);background:rgba(88,166,255,.08)}

/* TOAST */
#tw{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px;max-width:calc(100vw - 32px)}
.toast{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:9px 13px;font-size:13px;animation:ti .2s ease}
.toast.success{border-left:3px solid var(--gn);color:var(--gn)}
.toast.error{border-left:3px solid var(--rd);color:var(--rd)}
.toast.info{border-left:3px solid var(--ac);color:var(--ac)}
.toast.warn{border-left:3px solid var(--am);color:var(--am)}
@keyframes ti{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.pbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.pfill{height:100%;background:linear-gradient(90deg,var(--ac),var(--gn));border-radius:3px}
.mono{font-family:'DM Mono',monospace;font-size:12px}

/* ── MOBILE ── */
@media(max-width:700px){
  #sb{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%);width:240px !important;border-radius:0 14px 14px 0;box-shadow:4px 0 24px rgba(0,0,0,.3)}
  #sb.mobile-open{transform:translateX(0)}
  #sb.slim{transform:translateX(-100%)}
  .two{grid-template-columns:1fr}
  .kg{grid-template-columns:1fr 1fr}
  #clk{display:none}
  #dbPill{display:none}
  .tb-r .btn-gh:last-child{font-size:0;padding:6px 8px}
  .tb-r .btn-gh:last-child::after{content:'↩';font-size:14px}
  td{padding:6px 8px;font-size:12px}
  thead th{padding:6px 8px;font-size:9px}
  .btn.sm{padding:5px 8px;font-size:11px}
  #content{padding:10px}
  .card{padding:12px}
  .kv{font-size:16px}
  .acts{gap:4px}
  .acts input{max-width:120px !important}
  .mf{flex-direction:column}
  .mf .btn{width:100%;justify-content:center}
  .fgrid{grid-template-columns:1fr}
}
@media(min-width:701px){
  .ov{align-items:center;padding:16px}
  .mb{border-radius:12px;max-width:580px}
}

/* MODAL */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:900;display:none;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.mb{background:var(--cd);border:1px solid var(--bd);border-radius:10px;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--cd);z-index:1}
.mh h3{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}
.mbody{padding:16px}
.mf{padding:10px 16px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

/* LOGIN */
#loginWrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.lc{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:32px;width:100%;max-width:340px}
.ll{text-align:center;margin-bottom:22px}
.ll-icon{font-size:38px;display:block;margin-bottom:8px}
.ll h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800}
.ll p{font-size:12px;color:var(--tx2);margin-top:3px}
.dbrow{display:flex;gap:6px;margin-bottom:12px}
.dbb{flex:1;padding:7px;border:1px solid var(--bd);background:var(--bg3);color:var(--tx2);border-radius:7px;cursor:pointer;font-size:12px;font-weight:600;transition:.15s}
.dbb.on{border-color:var(--ac);color:var(--ac);background:rgba(88,166,255,.08)}

/* TOAST */
#tw{position:fixed;bottom:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--bg2);border:1px solid var(--bd);border-radius:8px;padding:9px 13px;font-size:13px;max-width:280px;animation:ti .2s ease}
.toast.success{border-left:3px solid var(--gn);color:var(--gn)}
.toast.error{border-left:3px solid var(--rd);color:var(--rd)}
.toast.info{border-left:3px solid var(--ac);color:var(--ac)}
.toast.warn{border-left:3px solid var(--am);color:var(--am)}
@keyframes ti{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}

/* PROGRESS */
.pbar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin-top:4px}
.pfill{height:100%;background:linear-gradient(90deg,var(--ac),var(--gn));border-radius:3px}
.mono{font-family:'DM Mono',monospace;font-size:12px}
</style>
</head>
<body class="dark">

<!-- LOGIN -->
<div id="loginWrap">
<div class="lc">
  <div class="ll">
    <span class="ll-icon" id="loginIcon">📡</span>
    <h1 id="loginBrand">NetPulse</h1>
    <p id="loginSub">ISP Management System</p>
  </div>
  <div style="background:var(--bg3);border:1px solid var(--bd);border-radius:8px;padding:12px;margin-bottom:14px">
    <div style="font-size:11px;font-weight:600;color:var(--tx2);margin-bottom:8px">💾 DATABASE</div>
    <div class="dbrow">
      <button class="dbb on" id="dbl" onclick="setDB('local')">📦 Local</button>
      <button class="dbb" id="dbf" onclick="setDB('firebase')">🔥 Firebase</button>
    </div>
    <div id="fbArea" style="display:none">
      <button class="btn btn-p sm" style="width:100%" onclick="connectFB()">🔥 Connect to Firebase</button>
      <div id="fbMsg" style="font-size:11px;margin-top:6px;color:var(--tx2)"></div>
    </div>
    <textarea id="fbCfg" style="display:none"></textarea>
    <div id="localNote" style="font-size:11px;color:var(--am)">Data saved in browser localStorage.</div>
  </div>
  <div class="fg"><label>Username / Mobile</label><input id="lu" placeholder="admin" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <div class="fg"><label>Password / PIN</label><input id="lp" type="password" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()"></div>
  <button class="btn btn-p" style="width:100%;padding:11px;margin-top:4px;font-size:14px" onclick="doLogin()">Sign In →</button>
  <div style="margin-top:12px;background:var(--bg3);border-radius:8px;padding:10px;font-size:12px;color:var(--tx2)"><b>Admin:</b> Username + Password<br><b>Employee:</b> Mobile + PIN<br><b>Client:</b> PPPoE or Mobile + C.Code</div>
</div>
</div>

<!-- APP -->
<div id="overlay" onclick="closeSB()"></div>
<div id="shell" style="display:none">
  <div id="sb">
    <div class="sb-logo">
      <span class="sb-logo-icon">📡</span>
      <div class="sb-logo-text" id="sbBrand">Net<span>Pulse</span></div>
    </div>
    <div id="sbNav"></div>
    <div class="sb-foot">
      <div class="sb-user" onclick="go('settings')">
        <div class="sb-av" id="sbAv">A</div>
        <div style="overflow:hidden">
          <div style="font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="sbName">Admin</div>
          <div style="font-size:10px;color:var(--tx3)" id="sbRole">Administrator</div>
        </div>
      </div>
    </div>
  </div>

  <div id="main">
    <div id="tb">
      <button class="tb-tog" onclick="toggleSB()">☰</button>
      <div id="tbTitle">Dashboard</div>
      <div class="tb-r">
        <span id="clk"></span>
        <span id="dbPill" class="pill-local">LOCAL</span>
        <button class="btn btn-gh sm" onclick="toggleTheme()">🌙</button>
        <button class="btn btn-gh sm" onclick="doLogout()">Sign Out</button>
      </div>
    </div>
    <div id="newsBar"><div class="ntk" id="ntk"></div></div>
    <div id="content"></div>
  </div>
</div>

<!-- MODAL -->
<div class="ov" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="mb">
    <div class="mh"><h3 id="mT">—</h3><button class="btn btn-gh sm" onclick="closeModal()">✕</button></div>
    <div class="mbody" id="mB"></div>
    <div class="mf" id="mF"></div>
  </div>
</div>

<div id="tw"></div>

<script>
var KEY='np3';
var U=null, TAB='dashboard', fbOk=false, db=null;

/* STATE */
function defS(){
  return {
    admin:{user:'admin',pass:'admin123',name:'Administrator'},
    settings:{company:'NetPulse ISP',brandName:'NetPulse',brandIcon:'📡',brandSub:'ISP Management System',brandColor:'#58a6ff',phone:'',address:'',news:'',newsOn:false},
    employees:[],clients:[],complaints:[],invoices:[],
    finance:[],packages:[],items:[],targets:[],attendance:[],advances:[],accounts:[],cashExpenses:[],cashHandovers:[],
    session:null
  };
}
var S = (function(){
  try{ var d=localStorage.getItem(KEY); return d?JSON.parse(d):defS(); }catch(e){ return defS(); }
})();
(function fixS(){
  var d=defS();
  Object.keys(d).forEach(function(k){
    if(S[k]==null) S[k]=d[k];
    if(Array.isArray(d[k])&&!Array.isArray(S[k])) S[k]=[];
  });
  if(!S.admin||typeof S.admin!=='object') S.admin=d.admin;
  if(!S.settings||typeof S.settings!=='object') S.settings=d.settings;
})();

function saveL(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

/* HELPERS */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function today(){ return new Date().toISOString().slice(0,10); }
function nowS(){ return new Date().toLocaleString(); }
function Rs(n){ return 'Rs.'+(Number(n)||0).toLocaleString(); }
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];
  });
}
function pkN(v){ v=String(v||'').replace(/\D/g,''); if(v.startsWith('92')&&v.length===12)return '0'+v.slice(2); return v; }
function waN(v){ v=String(v||'').replace(/\D/g,''); if(v.startsWith('0')&&v.length===11)return '92'+v.slice(1); return v; }
function eN(id){ if(id==='admin')return 'Admin'; var e=(S.employees||[]).find(function(x){return x.id===id;}); return e?e.name:'-'; }
function can(p){ return U&&(U.role==='admin'||!!(U.per&&U.per[p])); }

function toast(m,t){
  t=t||'info';
  var d=document.createElement('div');
  d.className='toast '+t; d.textContent=m;
  document.getElementById('tw').appendChild(d);
  setTimeout(function(){d.remove();},3200);
}

/* THEME */
function applyTheme(t){
  document.body.className=t;
  var b=document.getElementById('tbTitle');
  var btn=document.querySelector('.tb-r button');
  // find theme button
  var btns=document.querySelectorAll('.tb-r .btn-gh');
  if(btns.length>0) btns[0].textContent=t==='dark'?'🌙':'☀️';
  localStorage.setItem('np3_theme',t);
}
function toggleTheme(){
  applyTheme(document.body.className==='dark'?'light':'dark');
}

/* DB */

function loadSc(list,i,cb){
  if(i>=list.length){cb();return;}
  if(document.querySelector('script[src="'+list[i]+'"]')){loadSc(list,i+1,cb);return;}
  var s=document.createElement('script'); s.src=list[i]; s.onload=function(){loadSc(list,i+1,cb);}; document.head.appendChild(s);

function connectFB(){

  msg.textContent='Connecting...'; msg.style.color='var(--tx2)';
  loadSc(['https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js','https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js'],0,function(){

    }catch(e){ msg.style.color='var(--rd)'; msg.textContent=e.message; }

function syncFB(){
  if(!fbOk||!db)return;
  var cols=['employees','clients','complaints','invoices','finance','packages','items','targets','attendance','advances'];
  var n=0;
  cols.forEach(function(col){
    db.collection(col).get().then(function(snap){
      if(snap.docs.length) S[col]=snap.docs.map(function(d){return Object.assign({id:d.id},d.data());});
      n++; if(n===cols.length){saveL();toast('Firebase synced','success');if(U)render();}
    }).catch(function(){n++;});
  });
  db.collection('settings').doc('main').get().then(function(d){
    if(d.exists){if(d.data().admin)S.admin=d.data().admin;if(d.data().settings)S.settings=d.data().settings;saveL();}
  }).catch(function(){});
}

function fbDel(col,id){ if(!fbOk||!db||!id)return; db.collection(col).doc(id).delete().catch(function(){}); }
function fbSaveSettings(){ if(!fbOk||!db)return; db.collection('settings').doc('main').set({admin:S.admin,settings:S.settings},{merge:true}).catch(function(){}); }

  var a=document.createElement('a');

  a.download=name;a.click();
}

function getMyLocation(){
  var status=document.getElementById('locStatus');
  if(!navigator.geolocation){status.textContent='Geolocation not supported';return;}
  status.textContent='Getting location...';
  status.style.color='var(--am)';
  navigator.geolocation.getCurrentPosition(function(pos){
    var lat=pos.coords.latitude.toFixed(6);
    var lng=pos.coords.longitude.toFixed(6);
    var loc=lat+','+lng;
    document.getElementById('cpLoc').value=loc;
    status.textContent='Location captured: '+loc;
    status.style.color='var(--gn)';
  },function(err){
    status.textContent='Error: '+err.message;
    status.style.color='var(--rd)';
  });
}

  h+='</div>';

    return '<tr><td><b>'+esc(r.c.name)+'</b><br><small>'+esc(r.c.area||'')+'</small></td><td class="mono">'+esc(r.c.mobile||'-')+'</td><td class="mono">'+esc(r.c.ccode||'-')+'</td><td>'+esc(r.c.package||'-')+'</td><td>'+Rs(r.bill)+'</td><td>'+Rs(r.rec)+'</td><td style="color:'+(r.due>0?'var(--rd)':'var(--gn)')+'"><b>'+Rs(r.due)+'</b></td><td>'+bbadge(r.st)+'</td>'+
    '<td><div class="ta">'+
    (r.st!=='paid'?'<button class="btn btn-p sm" onclick="openRcv(\''+r.c.id+'\')">Receive</button>':'')+
    (r.st!=='paid'?'<button class="btn btn-g sm" onclick="markPaid(\''+r.c.id+'\')">Mark Paid</button>':'')+

function openRcv(cid){
  var c=(S.clients||[]).find(function(x){return x.id===cid;});
  var inv=(S.invoices||[]).find(function(v){return v.clientId===cid&&v.billMonth===_bM;});
  var due=inv?Math.max(0,(+inv.total||(c.bill||0))-(+inv.received||0)):c.bill||0;
  openModal('Receive Bill',
    '<div class="fgrid">'+
    '<div class="fg"><label>Client</label><input readonly value="'+esc(c.name||'')+'"></div>'+

    '<div class="fg"><label>Due</label><input readonly value="'+due+'"></div>'+
    '<div class="fg"><label>Amount</label><input id="rA" type="number" value="'+due+'"></div>'+
    '<div class="fg"><label>Mode</label><select id="rM"><option>cash</option><option>online</option></select></div>'+
    '<div class="fg"><label>Received By</label><input id="rB" value="'+esc(U.name||'')+'"></div>'+
    '</div>',
    '<button class="btn btn-gh sm" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-p" onclick="saveRcv(\''+cid+'\')">Save</button>'+
    '<button class="btn btn-w" onclick="saveRcv(\''+cid+'\',true)">Save+WA</button>');
}
function saveRcv(cid,wa){
  var c=(S.clients||[]).find(function(x){return x.id===cid;});if(!c)return;
  var amt=+(document.getElementById('rA').value)||0;if(amt<=0){toast('Invalid amount','error');return;}
  var mode=document.getElementById('rM').value,by=document.getElementById('rB').value,bill=c.bill||0;
  var inv=(S.invoices||[]).find(function(v){return v.clientId===cid&&v.billMonth===_bM;});
  if(!inv){inv={id:uid(),clientId:cid,clientName:c.name,mobile:c.mobile,ccode:c.ccode,pppoe:c.pppoe,package:c.package,billMonth:_bM,total:bill,received:0,due:bill,status:'unpaid',date:today(),by:U.id};S.invoices.push(inv);}
  inv.received=(+inv.received||0)+amt;inv.due=Math.max(0,(+inv.total||bill)-inv.received);inv.status=inv.due<=0?'paid':'partial';inv.updatedAt=nowS();
  sv('invoices',inv);
  var fin={id:uid(),type:'income',mode:mode,amount:amt,paidBy:c.name,customer:c.name,clientId:cid,phone:c.mobile,billMonth:_bM,cat:'Monthly Bill',receiver:by,date:today(),time:nowS(),by:U.id};
  S.finance.push(fin);sv('finance',fin);
  closeModal();pgBilling();toast('Received '+Rs(amt),'success');
  if(wa)sendSlip(cid);
}
function markPaid(cid){
  var c=(S.clients||[]).find(function(x){return x.id===cid;});if(!c)return;
  var bill=c.bill||0;
  var inv=(S.invoices||[]).find(function(v){return v.clientId===cid&&v.billMonth===_bM;});
  if(!inv){inv={id:uid(),clientId:cid,clientName:c.name,mobile:c.mobile,ccode:c.ccode,pppoe:c.pppoe,package:c.package,billMonth:_bM,total:bill,received:0,due:bill,status:'unpaid',date:today(),by:U.id};S.invoices.push(inv);}
  var rem=Math.max(0,(+inv.total||bill)-(+inv.received||0));if(rem<=0){toast('Already paid','info');return;}
  var mode=prompt('Mode (cash/online):','cash')||'cash';
  inv.received=(+inv.received||0)+rem;inv.due=0;inv.status='paid';inv.paidAt=nowS();inv.updatedAt=nowS();sv('invoices',inv);
  var fin={id:uid(),type:'income',mode:mode,amount:rem,paidBy:c.name,customer:c.name,clientId:cid,phone:c.mobile,billMonth:_bM,cat:'Monthly Bill',date:today(),time:nowS(),by:U.id};
  S.finance.push(fin);sv('finance',fin);pgBilling();toast('Paid: '+Rs(rem),'success');
}
function sendSlip(cid){
  var c=(S.clients||[]).find(function(x){return x.id===cid;});
  var inv=(S.invoices||[]).find(function(v){return v.clientId===cid&&v.billMonth===_bM;});
  var bill=c.bill||0,rec=inv?+inv.received||0:0,due=inv?Math.max(0,(+inv.total||bill)-rec):bill;

}
function printSlip(cid){
  var c=(S.clients||[]).find(function(x){return x.id===cid;});

  w.document.close();setTimeout(function(){w.print();},400);

function sendReminders(){
  var mon=_bM;

  toast('Reminders sent','success');
}

var _invLines=[];
function addLine(desc,qty,price){
  _invLines.push({desc:desc||'',qty:qty||1,price:price||0});
  rebuildLines();
}
function addLineFromSel(selId){
  var val=document.getElementById(selId).value;
  if(!val)return;
  var parts=val.split('|');
  addLine(parts[0],1,+(parts[1])||0);
  document.getElementById(selId).value='';
}
function removeLine(i){_invLines.splice(i,1);rebuildLines();}
function updLine(i,key,val){if(_invLines[i])_invLines[i][key]=key==='desc'?val:+(val)||0;calcInvTotal();}
function rebuildLines(){
  var rows=_invLines.map(function(l,i){
    return '<tr><td><input style="min-width:140px" value="'+esc(l.desc||'')+'" oninput="updLine('+i+',\'desc\',this.value)"></td>'+
      '<td><input type="number" style="width:70px" value="'+(l.qty||1)+'" oninput="updLine('+i+',\'qty\',this.value)"></td>'+
      '<td><input type="number" style="width:90px" value="'+(l.price||0)+'" oninput="updLine('+i+',\'price\',this.value)"></td>'+
      '<td style="padding:4px 8px" id="lamt'+i+'"><b>'+Rs((l.qty||1)*(l.price||0))+'</b></td>'+
      '<td><button class="btn btn-r sm" onclick="removeLine('+i+')">✕</button></td></tr>';
  }).join('');
  var tb=document.getElementById('lineBody');
  if(tb)tb.innerHTML=rows;
  calcInvTotal();
}
function calcInvTotal(){
  var sub=_invLines.reduce(function(s,l){return s+((+l.qty||1)*(+l.price||0));},0);
  var disc=+(document.getElementById('iDisc')&&document.getElementById('iDisc').value)||0;
  var total=Math.max(0,sub-disc);
  var rec=+(document.getElementById('iR')&&document.getElementById('iR').value)||0;
  var due=Math.max(0,total-rec);
  if(document.getElementById('iT'))document.getElementById('iT').value=total;
  if(document.getElementById('iD'))document.getElementById('iD').value=due;
}
function fillInvC(cid){
  var c=(S.clients||[]).find(function(x){return x.id===cid;});if(!c)return;
  document.getElementById('iN').value=c.name||'';
  document.getElementById('iM').value=c.mobile||'';
  if(c.package&&c.bill&&_invLines.length===0){
    addLine(c.package+' — Monthly',1,c.bill||0);
  }
  calcInvTotal();
}
function cDue(){calcInvTotal();}

function recvInv(id){
  var v=(S.invoices||[]).find(function(x){return x.id===id;});if(!v)return;
  var amt=+(prompt('Amount (Due: '+Rs(v.due)+'):', v.due))||0;if(amt<=0)return;
  var mode=prompt('Mode:','cash')||'cash';
  v.received=(+v.received||0)+amt;v.due=Math.max(0,(+v.total||0)-v.received);v.status=v.due<=0?'paid':'partial';v.updatedAt=nowS();sv('invoices',v);
  var fin={id:uid(),type:'income',mode:mode,amount:amt,paidBy:v.clientName,customer:v.clientName,cat:v.work||'Invoice',date:today(),time:nowS(),by:U.id};S.finance.push(fin);sv('finance',fin);
  pgInvoice();toast('Received '+Rs(amt),'success');
}

  var v=(S.invoices||[]).find(function(x){return x.id===id;});if(!v||(+v.due||0)<=0){toast('Already paid','info');return;}

}

/* CASHFLOW */
function ensureCashFlowState(){
  if(!Array.isArray(S.accounts)) S.accounts=[];
  if(!Array.isArray(S.cashExpenses)) S.cashExpenses=[];
  if(!Array.isArray(S.cashHandovers)) S.cashHandovers=[];
  if(!S.accounts.length){
    S.accounts.push({id:'acc_main_cash',name:'Main Cash / Office',type:'cash',opening:0,active:true,createdAt:nowS()});
  }
}
function cfIsCashIncome(f){
  return (f.type||'income')!=='expense' && String(f.mode||'cash').toLowerCase()==='cash';
}
function cfEmployeeId(f){
  return f.employee_id||f.emp||f.employee||f.by||'admin';
}
function cfEmployeeName2(eid){
  if(!eid||eid==='admin') return 'Admin';
  var e=(S.employees||[]).find(function(x){return x.id===eid||x.mobile===eid;});
  return e?(e.name||'Employee'):eid;
}
function cfAccountName2(accId){
  var a=(S.accounts||[]).find(function(x){return x.id===accId;});
  return a?(a.name||'Account'):'-';
}
function cfEmpOpts(sel){
  var o='<option value="admin" '+((!sel||sel==='admin')?'selected':'')+'>Admin</option>';
  (S.employees||[]).forEach(function(e){o+='<option value="'+e.id+'" '+(sel===e.id?'selected':'')+'>'+esc(e.name)+'</option>';});
  return o;
}
function cfAccOpts(sel){
  ensureCashFlowState();
  return (S.accounts||[]).filter(function(a){return a.active!==false;}).map(function(a){
    return '<option value="'+a.id+'" '+(sel===a.id?'selected':'')+'>'+esc(a.name)+' ('+esc(a.type||'cash')+')</option>';
  }).join('');
}
function cfCashSummary(){
  ensureCashFlowState();
  var collected={},expenses={},handovers={};
  (S.finance||[]).filter(cfIsCashIncome).forEach(function(f){
    var eid=cfEmployeeId(f);
    collected[eid]=(collected[eid]||0)+(+f.amount||0);
  });
  (S.cashExpenses||[]).forEach(function(x){
    var eid=x.employee_id||'admin';
    expenses[eid]=(expenses[eid]||0)+(+x.amount||0);
  });
  (S.cashHandovers||[]).forEach(function(h){
    var eid=h.employee_id||'admin';
    handovers[eid]=(handovers[eid]||0)+(+h.amount||0);
  });
  var ids={};
  Object.keys(collected).forEach(function(k){ids[k]=1;});
  Object.keys(expenses).forEach(function(k){ids[k]=1;});
  Object.keys(handovers).forEach(function(k){ids[k]=1;});
  return Object.keys(ids).map(function(eid){
    var col=collected[eid]||0;
    var exp=expenses[eid]||0;
    var hand=handovers[eid]||0;
    var expected=col-exp;
    var pending=expected-hand;
    var extra=pending<0?Math.abs(pending):0;
    var short=pending>0?pending:0;
    return {employee_id:eid,employee_name:cfEmployeeName2(eid),collected:col,expenses:exp,expected:expected,handover:hand,pending:pending,short:short,extra:extra,status:pending<=0?'Settled':extra>0?'Extra Credit':'Short / Pending'};
  });
}
function cfAccountBalances(){
  ensureCashFlowState();
  return (S.accounts||[]).map(function(a){
    var hand=(S.cashHandovers||[]).filter(function(h){return h.account_id===a.id;}).reduce(function(s,h){return s+(+h.amount||0);},0);
    var online=(S.finance||[]).filter(function(f){return (f.type||'income')!=='expense'&&String(f.mode||'').toLowerCase()==='online'&&(f.account_id===a.id||(!f.account_id&&a.id==='acc_main_cash'));}).reduce(function(s,f){return s+(+f.amount||0);},0);
    var accExp=(S.cashExpenses||[]).filter(function(x){return x.paid_from==='account'&&x.account_id===a.id;}).reduce(function(s,x){return s+(+x.amount||0);},0);
    return Object.assign({},a,{handovers:hand,online:online,expenses:accExp,balance:(+a.opening||0)+hand+online-accExp});
  });
}

    if(pen>0)btns+='<button class="btn btn-g sm" data-id="'+a.id+'" onclick="returnAdv(this.getAttribute(\'data-id\'))">Return</button>';
    if(pen>0)btns+='<button class="btn btn-p sm" data-id="'+a.id+'" onclick="clearAdv(this.getAttribute(\'data-id\'))">Clear</button>';
    btns+='<button class="btn btn-w sm" data-id="'+a.id+'" onclick="waAdv(this.getAttribute(\'data-id\'))">WA</button>';

function giveAdv(){
  if(!S.advances)S.advances=[];
  var ev=document.getElementById('advE').value||'';if(!ev){toast('Select employee','error');return;}
  var parts=ev.split('___'),empId=parts[0],empName=parts[1]||ev;
  var amt=+(document.getElementById('advA').value)||0;if(amt<=0){toast('Enter amount','error');return;}
  var obj={id:uid(),empId:empId,empName:empName,amount:amt,returned:0,status:'pending',mode:document.getElementById('advM').value,reason:(document.getElementById('advR').value||'').trim(),note:(document.getElementById('advN').value||'').trim(),date:document.getElementById('advD').value,by:U.id,createdAt:nowS()};
  S.advances.push(obj);
  var fin={id:uid(),type:'expense',mode:obj.mode,amount:amt,paidBy:'Advance — '+empName,customer:empName,cat:'Advance',receiver:empName,date:obj.date,time:nowS(),by:U.id};
  S.finance.push(fin);sv('advances',obj);sv('finance',fin);pgAdvance();toast('Advance given: '+Rs(amt),'success');
}
function returnAdv(id){
  var a=(S.advances||[]).find(function(x){return x.id===id;});if(!a)return;
  var pen=Math.max(0,(+a.amount||0)-(+a.returned||0));
  var amt=+(prompt('Return amount (Pending: '+Rs(pen)+'):', pen))||0;if(amt<=0)return;
  a.returned=(+a.returned||0)+amt;a.status=Math.max(0,(+a.amount||0)-a.returned)<=0?'cleared':'partial';a.updatedAt=nowS();
  var fin={id:uid(),type:'income',mode:'cash',amount:amt,paidBy:'Advance Return — '+a.empName,customer:a.empName,cat:'Advance Return',date:today(),time:nowS(),by:U.id};
  S.finance.push(fin);sv('advances',a);sv('finance',fin);pgAdvance();toast('Returned: '+Rs(amt),'success');
}
function clearAdv(id){
  var a=(S.advances||[]).find(function(x){return x.id===id;});if(!a)return;
  var pen=Math.max(0,(+a.amount||0)-(+a.returned||0));if(pen<=0){toast('Already cleared','info');return;}
  if(!confirm('Clear remaining '+Rs(pen)+'?'))return;
  a.returned=+a.amount||0;a.status='cleared';a.clearedAt=nowS();a.updatedAt=nowS();
  var fin={id:uid(),type:'income',mode:'cash',amount:pen,paidBy:'Advance Cleared — '+a.empName,customer:a.empName,cat:'Advance Return',date:today(),time:nowS(),by:U.id};
  S.finance.push(fin);sv('advances',a);sv('finance',fin);pgAdvance();toast('Cleared','success');
}
function waAdv(id){
  var a=(S.advances||[]).find(function(x){return x.id===id;});if(!a)return;
  var emp=(S.employees||[]).find(function(e){return e.id===a.empId;});if(!emp||!emp.mobile){toast('No mobile','error');return;}

function saveBranding(){
  S.settings.brandName=(document.getElementById('brN').value||'').trim()||'NetPulse';
  S.settings.brandIcon=(document.getElementById('brI').value||'').trim()||'📡';
  S.settings.brandSub=(document.getElementById('brS').value||'').trim()||'ISP Management System';
  S.settings.brandColor=document.getElementById('brC').value||'#58a6ff';
  saveL();fbSaveSettings();applyBranding();toast('Branding applied!','success');
}
function saveSettings(){
  if(document.getElementById('sC'))S.settings.company=document.getElementById('sC').value.trim()||S.settings.company;
  if(document.getElementById('sPh'))S.settings.phone=document.getElementById('sPh').value.trim();
  if(document.getElementById('sAd'))S.settings.address=document.getElementById('sAd').value.trim();
  if(document.getElementById('sNw'))S.settings.news=document.getElementById('sNw').value.trim();
  if(document.getElementById('sNwOn'))S.settings.newsOn=document.getElementById('sNwOn').value==='1';
  saveL();fbSaveSettings();renderNews();toast('Saved','success');
}
function saveAdmin(){
  var u=(document.getElementById('aU').value||'').trim(),n=(document.getElementById('aN2').value||'').trim(),p=(document.getElementById('aP').value||'').trim();
  if(u)S.admin.user=u;if(n){S.admin.name=n;U.name=n;document.getElementById('sbName').textContent=n;}if(p)S.admin.pass=p;
  saveL();fbSaveSettings();toast('Updated','success');
}
function connectFB2(){
  var raw=(document.getElementById('fbCfg2').value||'').trim();if(!raw)return;
  try{document.getElementById('fbCfg').value=raw;}catch(e){}
  connectFB();
}
function exportBak(){var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(S,null,2));a.download='netpulse-'+today()+'.json';a.click();toast('Exported','success');}
function importBak(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(!confirm('Overwrite all?'))return;Object.assign(S,d);saveL();location.reload();}catch(err){toast('Invalid file','error');}};r.readAsText(f);}
function clearAll(){if(!confirm('Delete ALL?'))return;if(!confirm('Sure?'))return;localStorage.removeItem(KEY);location.reload();}

/* BRANDING */
function applyBranding(){
  var b=S.settings;
  var name=b.brandName||'NetPulse';
  var icon=b.brandIcon||'📡';
  var sub=b.brandSub||'ISP Management System';
  var color=b.brandColor||'#58a6ff';
  document.title=name+' ISP';
  var li=document.getElementById('loginIcon'); if(li)li.textContent=icon;
  var lb=document.getElementById('loginBrand'); if(lb)lb.textContent=name;
  var ls=document.getElementById('loginSub'); if(ls)ls.textContent=sub;
  var si=document.querySelector('.sb-logo-icon'); if(si)si.textContent=icon;
  var sb=document.getElementById('sbBrand'); if(sb)sb.innerHTML=name.slice(0,-name.length/2||-1)+'<span>'+name.slice(name.length/2||-1)+'</span>';
  // apply brand color as CSS variable
  document.documentElement.style.setProperty('--brand',color);
  // update all .nb.on and accent usages via inline style
  var style=document.getElementById('brandStyle');
  if(!style){style=document.createElement('style');style.id='brandStyle';document.head.appendChild(style);}
  style.textContent='.nb.on{color:'+color+' !important;background:'+color+'22 !important}.btn-p{background:'+color+' !important}.pill-local,.pill-fb,.bb{color:'+color+'}.kb{border-left-color:'+color+'}input:focus,select:focus,textarea:focus{border-color:'+color+'}';
}

/* ── ADVANCE EDIT ── */
function editAdv(id){
  var a=(S.advances||[]).find(function(x){return x.id===id;});if(!a)return;
  var empOpts=(S.employees||[]).filter(function(e){return e.active!==false;}).map(function(e){
    return '<option value="'+e.id+'___'+esc(e.name)+'" '+(a.empId===e.id?'selected':'')+'>'+esc(e.name)+'</option>';
  }).join('');
  var body='<div class="fgrid">';
  body+='<div class="fg"><label>Employee</label><select id="advEE"><option value="'+a.empId+'___'+esc(a.empName)+'" selected>'+esc(a.empName)+'</option>'+empOpts+'</select></div>';
  body+='<div class="fg"><label>Amount (Rs.)</label><input id="advEA" type="number" value="'+(a.amount||0)+'"></div>';
  body+='<div class="fg"><label>Returned (Rs.)</label><input id="advER" type="number" value="'+(a.returned||0)+'"></div>';
  body+='<div class="fg"><label>Date</label><input id="advED" type="date" value="'+(a.date||today())+'"></div>';
  body+='<div class="fg"><label>Mode</label><select id="advEM"><option '+(a.mode==='cash'?'selected':'')+'>cash</option><option '+(a.mode==='online'?'selected':'')+'>online</option></select></div>';
  body+='<div class="fg"><label>Reason</label><input id="advERS" value="'+esc(a.reason||'')+'"></div>';
  body+='<div class="fg fw"><label>Note</label><input id="advEN2" value="'+esc(a.note||'')+'"></div>';
  body+='</div>';
  openModal('Edit Advance',body,
    '<button class="btn btn-gh sm" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-p" onclick="saveEditAdv(\''+id+'\')">Save</button>');
}
function saveEditAdv(id){
  var a=(S.advances||[]).find(function(x){return x.id===id;});if(!a)return;
  var ev=document.getElementById('advEE').value||'';
  var parts=ev.split('___');
  a.empId=parts[0];a.empName=parts[1]||a.empName;
  a.amount=+(document.getElementById('advEA').value)||0;
  a.returned=+(document.getElementById('advER').value)||0;
  a.date=document.getElementById('advED').value;
  a.mode=document.getElementById('advEM').value;
  a.reason=(document.getElementById('advERS').value||'').trim();
  a.note=(document.getElementById('advEN2').value||'').trim();
  var pen=Math.max(0,a.amount-a.returned);
  a.status=pen<=0?'cleared':a.returned>0?'partial':'pending';
  a.updatedAt=nowS();
  sv('advances',a);closeModal();pgAdvance();toast('Advance updated','success');
}

/* ── BILL EDIT (admin) ── */
function openEditBill(cid){
  var c2=(S.clients||[]).find(function(x){return x.id===cid;});if(!c2)return;
  var inv=(S.invoices||[]).find(function(v){return v.clientId===cid&&v.billMonth===_bM;});
  var bill=c2.bill||0;
  var rec=inv?+inv.received||0:0;
  var due=inv?Math.max(0,(+inv.total||bill)-rec):bill;
  var body='<div class="fgrid">';
  body+='<div class="fg"><label>Client</label><input readonly value="'+esc(c2.name||'')+'"></div>';
  body+='<div class="fg"><label>Month</label><input readonly value="'+_bM+'"></div>';
  body+='<div class="fg"><label>Total Bill (Rs.)</label><input id="ebTotal" type="number" value="'+(inv?+inv.total||bill:bill)+'"></div>';
  body+='<div class="fg"><label>Received (Rs.)</label><input id="ebRec" type="number" value="'+rec+'"></div>';
  body+='<div class="fg"><label>Discount (Rs.)</label><input id="ebDisc" type="number" value="'+(inv&&inv.discount||0)+'"></div>';
  body+='<div class="fg"><label>Status</label><select id="ebStatus"><option value="unpaid" '+((!inv||inv.status==='unpaid')?'selected':'')+'>Unpaid</option><option value="partial" '+(inv&&inv.status==='partial'?'selected':'')+'>Partial</option><option value="paid" '+(inv&&inv.status==='paid'?'selected':'')+'>Paid</option></select></div>';
  body+='<div class="fg fw"><label>Note</label><input id="ebNote" value="'+esc(inv&&inv.note||'')+'"></div>';
  body+='</div>';
  openModal('Edit Bill — '+esc(c2.name),body,
    '<button class="btn btn-gh sm" onclick="closeModal()">Cancel</button>'+
    '<button class="btn btn-p" onclick="saveEditBill(\''+cid+'\')">Save Bill</button>');
}
function saveEditBill(cid){
  var c2=(S.clients||[]).find(function(x){return x.id===cid;});if(!c2)return;
  var total=+(document.getElementById('ebTotal').value)||0;
  var rec=+(document.getElementById('ebRec').value)||0;
  var disc=+(document.getElementById('ebDisc').value)||0;
  var status=document.getElementById('ebStatus').value;
  var note=(document.getElementById('ebNote').value||'').trim();
  var due=Math.max(0,total-rec-disc);
  var inv=(S.invoices||[]).find(function(v){return v.clientId===cid&&v.billMonth===_bM;});
  if(!inv){
    inv={id:uid(),clientId:cid,clientName:c2.name,mobile:c2.mobile,ccode:c2.ccode,pppoe:c2.pppoe,package:c2.package,billMonth:_bM,date:today(),by:U.id};
    S.invoices.push(inv);
  }
  inv.total=total;inv.received=rec;inv.discount=disc;inv.due=due;inv.status=status;inv.note=note;inv.updatedAt=nowS();
  sv('invoices',inv);closeModal();pgBilling();toast('Bill updated','success');
}
