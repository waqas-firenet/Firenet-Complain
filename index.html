<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FireNetPK - ISP Management System</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --p:#e74c3c;--p2:#c0392b;--d:#243447;--s:#16a34a;--e:#dc2626;--b:#f4f7fb;--m:#64748b;--i:#2563eb;--w:#d97706;
  --softG:#f0fdf4;--softR:#fff1f2;--softB:#eff6ff;--line:#e5e7eb;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,Helvetica,sans-serif}
body{background:linear-gradient(135deg,#eef2ff,#fff1f2);min-height:100vh;color:#1f2937}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}
.login-card,.card{background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.08);border:1px solid #eef2f7}
.login-card{max-width:430px;width:100%;overflow:hidden}
.login-head{background:linear-gradient(135deg,var(--d),#111827);color:#fff;text-align:center;padding:32px}
.login-body{padding:24px}
.app{display:none;padding:12px}.container{max-width:1220px;margin:auto}
.header{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(15,23,42,.08)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px}.brand h1{font-size:20px;color:var(--d)}
.dt{font-weight:800;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px}
.sync{font-size:12px;font-weight:800;background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:9px;color:#475569}
.profile{position:relative}.profile-btn{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:#111827}.avatar{width:34px;height:34px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.menu{display:none;position:absolute;right:0;top:48px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.15);min-width:190px;overflow:hidden;z-index:10}.menu.active{display:block}.menu button{display:block;width:100%;background:#fff;text-align:left;padding:12px}.menu button:hover{background:#f8fafc;color:var(--p)}
.nav{display:flex;gap:8px;background:#fff;padding:8px;border-radius:16px;margin-bottom:12px;overflow-x:auto;box-shadow:0 10px 25px rgba(15,23,42,.07)}.nav button{white-space:nowrap;background:#f8fafc;color:#475569;padding:10px 13px;border-radius:12px;font-weight:900}.nav button.active{background:var(--p);color:#fff}
.card{padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.head h2{font-size:18px;color:var(--d)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row.two{grid-template-columns:repeat(2,1fr)}.fg{margin-bottom:12px}.fg label{display:block;font-size:13px;font-weight:900;margin-bottom:6px;color:#374151}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;outline:none;background:#fff}textarea{min-height:75px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 13px;border-radius:12px;color:#fff;background:var(--d);font-weight:900;text-decoration:none}.btn-p{background:var(--p)}.btn-s{background:var(--s)}.btn-e{background:var(--e)}.btn-i{background:var(--i)}.btn-w{background:var(--w)}.btn-l{background:#e5e7eb;color:#111827}.btn-sm{font-size:12px;padding:7px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:#fff;border-radius:16px;box-shadow:0 8px 18px rgba(15,23,42,.05);border:1px solid #eef2f7;border-left:5px solid var(--p)}.stat span{font-size:12px;color:var(--m);font-weight:900}.stat b{display:block;font-size:22px;margin-top:5px}.stat small{color:#64748b;font-weight:800}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;vertical-align:top}th{background:#f8fafc;color:#475569;text-transform:uppercase;font-size:12px}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;display:inline-block;text-transform:uppercase}.cash{background:#dcfce7;color:#166534}.online{background:#dbeafe;color:#1e40af}.income{background:#dcfce7;color:#166534}.expense{background:#fee2e2;color:#991b1b}.pending{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}.empty{text-align:center;color:var(--m);font-weight:800;padding:25px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.sum{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.sum b{display:block;font-size:20px;margin-top:4px}.item-line{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:10px;align-items:end}
.income-row{background:var(--softG)!important}.expense-row{background:var(--softR)!important}.money-plus{color:#15803d;font-weight:900}.money-minus{color:#dc2626;font-weight:900}
.toast-wrap{position:fixed;right:14px;top:14px;z-index:99}.toast{background:#fff;border-left:5px solid var(--i);box-shadow:0 14px 35px rgba(15,23,42,.18);padding:12px 14px;border-radius:14px;margin-bottom:8px;font-weight:800}.toast.success{border-left-color:var(--s)}.toast.error{border-left-color:var(--e)}.toast.warning{border-left-color:var(--w)}
.prog{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--s),#84cc16)}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;align-items:center;justify-content:center;padding:15px}.modal-bg.active{display:flex}.modal{background:#fff;border-radius:18px;max-width:620px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.print-only{display:none}
@media print{body{background:#fff}.login,.header,.nav,.actions,.btn,.toast-wrap,.modal-bg{display:none!important}.app{display:block!important;padding:0}.card{box-shadow:none;border:0}.print-only{display:block}.no-print{display:none!important}table{min-width:0;font-size:11px}th,td{font-size:11px;padding:6px}}
@media(max-width:850px){.grid,.summary{grid-template-columns:repeat(2,1fr)}.row,.row.two{grid-template-columns:1fr}}
@media(max-width:560px){.app{padding:8px}.header>*{width:100%}.profile-btn{width:100%}.nav{display:grid;grid-template-columns:1fr 1fr}.grid,.summary{grid-template-columns:1fr}.item-line{grid-template-columns:1fr}.actions .btn{width:100%}table{min-width:720px}}
</style>
</head>
<body>
<div id="loginScreen" class="login">
  <div class="login-card">
    <div class="login-head"><h1>🔥 Fire.net.pk</h1><p>ISP Management System</p></div>
    <div class="login-body">
      <div class="fg"><label>Username / Phone</label><input id="lu" placeholder="admin or ali"></div>
      <div class="fg"><label>Password / PIN</label><input id="lp" type="password" placeholder="admin123 or 1234"></div>
      <button class="btn btn-p" style="width:100%" onclick="loginUser()">Login</button>
      <p style="font-size:12px;color:#64748b;margin-top:12px;line-height:1.5">Default: <b>admin/admin123</b> or employee <b>ali/1234</b>. Mobile format: <b>03001234561</b></p>
    </div>
  </div>
</div>

<div id="app" class="app">
  <div class="container">
    <div class="header">
      <div class="brand"><div class="logo">🔥</div><div><h1>Fire.net.pk ISP</h1><small style="color:#64748b;font-weight:800">Complaints • Accounts • Invoice • Targets</small></div></div>
      <div id="dt" class="dt"></div>
      <div id="syncStatus" class="sync">Firebase: starting...</div>
      <div class="profile">
        <button class="profile-btn" onclick="toggleMenu()"><span id="av" class="avatar">A</span><span><b id="pn">Admin</b><br><small id="pr">Admin</small></span></button>
        <div id="pm" class="menu"><button onclick="openPwd()">Change Password</button><button onclick="logout()">Logout</button></div>
      </div>
    </div>
    <div id="nav" class="nav"></div>
    <div id="content"></div>
  </div>
</div>

<div id="tw" class="toast-wrap"></div>

<div id="pwdModal" class="modal-bg"><div class="modal">
  <div class="head"><h2>Change Password / PIN</h2><button class="btn btn-l btn-sm" onclick="closePwd()">Close</button></div>
  <div class="fg"><label>New Password / PIN</label><input id="newPwd" type="password"></div>
  <button class="btn btn-p" onclick="savePwd()">Save</button>
</div></div>

<script>
const KEY='firenet_clean_fixed_v1';
const firebaseConfig={apiKey:'AIzaSyDEOfh1JufNuoEIMEZ_tgt1Lg4PSLLUE7E',authDomain:'complaint-b1f3c.firebaseapp.com',projectId:'complaint-b1f3c',storageBucket:'complaint-b1f3c.firebasestorage.app',messagingSenderId:'400630080362',appId:'1:400630080362:web:bbe16973f247dd67407b13',measurementId:'G-ENJVNBEVXT'};
let S,U,TAB='dashboard',draft=[],db=null,fbReady=false,fbLoading=false,unsubs=[];
let financeDate=today(), financeAll=true, financeEmp='all', complaintDate=today(), complaintAll=false;

function def(){return{admin:{u:'admin',p:'admin123'},employees:[{id:'e1',name:'Ali',phone:'ali',mobile:'03001234561',pin:'1234',role:'Collection',active:true,per:{complaints:1,attendance:1,invoice:1,finance:1,targets:1}},{id:'e2',name:'Usman',phone:'usman',mobile:'03001234562',pin:'1234',role:'Technician',active:true,per:{complaints:1,attendance:1,invoice:1,finance:0,targets:1}}],complaints:[],finance:[],invoices:[],targets:[],attendance:[],session:null}}
function load(){S=JSON.parse(localStorage.getItem(KEY)||'null')||def();saveLocal()}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(S))}
function setSync(t,ok){const el=document.getElementById('syncStatus');if(el){el.textContent=t;el.style.color=ok?'#166534':t.includes('failed')||t.includes('error')?'#dc2626':'#475569'}}
function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function now(){return new Date().toLocaleString()}
function money(n){return'Rs. '+(Number(n)||0).toLocaleString()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function key(){return U.role==='admin'?'admin':U.id}
function can(x){return U.role==='admin'||U.per?.[x]}
function toast(m,t='info'){let d=document.createElement('div');d.className='toast '+t;d.textContent=m;document.getElementById('tw').appendChild(d);setTimeout(()=>d.remove(),3200)}
function beep(){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.04;o.start();setTimeout(()=>{o.stop();c.close()},150)}catch(e){}}
function clock(){document.getElementById('dt').textContent=new Date().toLocaleString()}setInterval(clock,1000);
function pkMobile(v){v=String(v||'').replace(/\D/g,'');if(v.startsWith('92')&&v.length===12)return '0'+v.slice(2);if(v.startsWith('0')&&v.length===11)return v;return v}
function waNumber(v){v=String(v||'').replace(/\D/g,'');if(v.startsWith('0')&&v.length===11)return '92'+v.slice(1);if(v.startsWith('92')&&v.length===12)return v;return v}
function validPk(v){return /^03\d{9}$/.test(pkMobile(v))}

async function initFirebase(){
 try{
   if(!window.firebase){setSync('Firebase SDK not loaded',false);return}
   if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
   db=firebase.firestore(); fbReady=true; setSync('Firebase: connected',true);
   await loadFirebase(); startRealtime();
 }catch(e){console.error(e);setSync('Firebase error: '+(e.message||e),false)}
}
async function loadCol(c){const s=await db.collection(c).get();return s.docs.map(d=>({id:d.id,...d.data()}))}
async function loadFirebase(){
 if(!db)return; fbLoading=true; setSync('Firebase: loading');
 try{
   const settings=await db.collection('settings').doc('main').get();
   if(settings.exists&&settings.data().admin)S.admin=settings.data().admin;
   const [employees,complaints,finance,invoices,targets,attendance]=await Promise.all(['employees','complaints','finance','invoices','targets','attendance'].map(loadCol));
   if(employees.length)S.employees=employees;
   S.complaints=complaints;S.finance=finance;S.invoices=invoices;S.targets=targets;S.attendance=attendance;
   saveLocal(); setSync('Firebase: loaded',true);
   if(!employees.length) for(const e of S.employees) await fbSet('employees',e);
 }catch(e){console.error(e);setSync('Firebase load failed',false);toast('Firebase load failed: '+(e.message||e),'error')}
 fbLoading=false;
}
function startRealtime(){
 if(!db)return; unsubs.forEach(u=>u&&u()); unsubs=[];
 ['employees','complaints','finance','invoices','targets','attendance'].forEach(col=>{
   unsubs.push(db.collection(col).onSnapshot(snap=>{
     if(fbLoading)return;
     S[col]=snap.docs.map(d=>({id:d.id,...d.data()})); saveLocal();
     if(U&&TAB) renderCurrent();
   },e=>setSync('Firebase realtime failed',false)));
 });
}
async function fbSet(col,obj){if(!fbReady||fbLoading||!obj?.id)return;try{await db.collection(col).doc(obj.id).set(JSON.parse(JSON.stringify(obj)),{merge:true});setSync('Firebase: synced',true)}catch(e){console.error(e);toast('Firebase write failed','error');setSync('Firebase write failed',false)}}
async function fbDel(col,i){if(!fbReady||!i)return;try{await db.collection(col).doc(i).delete();setSync('Firebase: deleted',true)}catch(e){toast('Firebase delete failed','error')}}
async function fbSettings(){if(!fbReady)return;try{await db.collection('settings').doc('main').set({admin:S.admin},{merge:true})}catch(e){}}
function saveAndSync(col,obj){saveLocal();if(col&&obj)fbSet(col,obj)}
function delAndSync(col,idv){saveLocal();if(col&&idv)fbDel(col,idv)}

function loginUser(){let u=lu.value.trim(),p=lp.value.trim();if(!u||!p)return toast('Enter username and password','error');if(u.toLowerCase()===S.admin.u&&p===S.admin.p){U={role:'admin',id:'admin',name:'Administrator'};S.session=U;saveLocal();return openApp()}let e=S.employees.find(x=>x.active&&(String(x.phone).toLowerCase()===u.toLowerCase()||String(x.name).toLowerCase()===u.toLowerCase()||String(x.mobile||'')===u)&&x.pin===p);if(e){U={role:'employee',...e};S.session=U;saveLocal();return openApp()}toast('Invalid login','error')}
function openApp(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('app').style.display='block';pn.textContent=U.name;pr.textContent=U.role==='admin'?'Admin':U.role;av.textContent=U.name[0].toUpperCase();clock();navRender();tab('dashboard');notify()}
function logout(){S.session=null;saveLocal();location.reload()}function toggleMenu(){pm.classList.toggle('active')}function openPwd(){pwdModal.classList.add('active');pm.classList.remove('active')}function closePwd(){pwdModal.classList.remove('active')}
function savePwd(){let v=newPwd.value.trim();if(v.length<3)return toast('Minimum 3 characters','error');if(U.role==='admin'){S.admin.p=v;fbSettings()}else{let e=S.employees.find(x=>x.id===U.id);if(e){e.pin=v;fbSet('employees',e)}U.pin=v;S.session=U}saveLocal();newPwd.value='';closePwd();toast('Password changed','success')}
function items(){let a=[['dashboard','Dashboard','📊'],['complaints','Complaints','🛠️'],['employees','Employees','👥'],['attendance','Attendance','🗓️'],['invoice','Invoice','🧾'],['finance','Finance','💰'],['targets','Targets','🎯'],['backup','Backup','💾']];return U.role==='admin'?a:a.filter(x=>x[0]==='dashboard'||can(x[0]))}
function navRender(){nav.innerHTML=items().map(x=>`<button id="n-${x[0]}" onclick="tab('${x[0]}')">${x[2]} ${x[1]}</button>`).join('')}
function tab(x){if(!items().some(i=>i[0]===x))x='dashboard';TAB=x;document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));let n=document.getElementById('n-'+x);if(n)n.classList.add('active');renderCurrent()}
function renderCurrent(){({dashboard:dash,complaints,employees,attendance,invoice,finance,targets,backup}[TAB]||dash)()}
function empOpts(sel=''){return S.employees.filter(e=>e.active).map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${esc(e.name)} - ${esc(e.role)}</option>`).join('')}
function empName(i){return S.employees.find(e=>e.id===i)?.name||'Admin'}
function empPhone(i){let e=S.employees.find(x=>x.id===i);return e?.mobile||e?.phone||''}
function myFin(){let r=U.role==='admin'?S.finance:S.finance.filter(e=>e.by===U.id);if(U.role==='admin'&&financeEmp!=='all')r=r.filter(e=>e.by===financeEmp);return r}
function myInv(){return U.role==='admin'?S.invoices:S.invoices.filter(e=>e.by===U.id||e.refEmp===U.id)}
function myComp(){return U.role==='admin'?S.complaints:S.complaints.filter(c=>c.assigned===U.id||c.by===U.id)}
function typeOf(e){return (e.type||'income').toLowerCase()==='expense'?'expense':'income'}function modeOf(e){return (e.mode||'cash').toLowerCase()==='online'?'online':'cash'}function paidBy(e){return e.customer||e.paidBy||e.payer||'-'}
function calc(arr=myFin()){let cash=0,online=0,exp=0,inc=0,cashExp=0,onlineExp=0;arr.forEach(e=>{let a=+e.amount||0;if(typeOf(e)==='expense'){exp+=a;if(modeOf(e)==='online')onlineExp+=a;else cashExp+=a}else{inc+=a;if(modeOf(e)==='online')online+=a;else cash+=a}});return{cash,online,exp,inc,cashExp,onlineExp,bal:inc-exp}}
function invoiceSummary(){let rows=myInv(),sales=0,received=0,due=0;rows.forEach(v=>{sales+=+v.total||0;received+=+v.received||0;due+=+v.due||0});return{sales,received,due,count:rows.filter(v=>(+v.due||0)>0).length}}
function targetSummary(){let rows=U.role==='admin'?S.targets:S.targets.filter(t=>t.emp===U.id),given=0,ach=0,reward=0;rows.forEach(t=>{given+=+t.target||0;ach+=+t.achieved||0;reward+=rewardEarned(t)});return{given,ach,reward,rem:Math.max(0,given-ach),pct:given?Math.min(100,Math.round(ach/given*100)):0}}
function rewardEarned(t){let pct=(+t.achieved||0)/(+t.target||1)*100;if(pct<100)return 0;return t.rewardType==='percentage'?Math.round((+t.achieved||0)*(+t.rewardValue||0)/100):(+t.rewardValue||0)}
function stats(){let f=calc(myFin().filter(e=>e.date===today())),allF=calc(),pend=myComp().filter(c=>c.status!=='Resolved').length,comp=myComp(),over=comp.filter(c=>c.status!=='Resolved'&&c.eta&&new Date(c.eta)<new Date()).length,inv=invoiceSummary(),tar=targetSummary();return`<div class="grid"><div class="stat"><span>Total Complaints</span><b>${comp.length}</b><small>Pending ${pend} / Overdue ${over}</small></div><div class="stat"><span>Invoice Paid / Due</span><b>${money(inv.received)}</b><small>Due ${money(inv.due)} (${inv.count})</small></div><div class="stat"><span>Today Income / Expense</span><b>${money(f.inc)}</b><small>Expense ${money(f.exp)} / Net ${money(f.bal)}</small></div><div class="stat"><span>Target Given / Achieved</span><b>${tar.pct}%</b><small>${money(tar.ach)} of ${money(tar.given)}</small></div></div>`}
function dash(){let inv=invoiceSummary(),tar=targetSummary(),f=calc(myFin().filter(e=>e.date===today()));content.innerHTML=stats()+`<div class="summary"><div class="sum">Total Sales<b>${money(inv.sales)}</b></div><div class="sum">Due Amount<b>${money(inv.due)}</b></div><div class="sum">Today Cash<b>${money(f.cash)}</b></div><div class="sum">Today Online<b>${money(f.online)}</b></div><div class="sum">Target Given<b>${money(tar.given)}</b></div><div class="sum">Target Achieved<b>${money(tar.ach)}</b></div><div class="sum">Reward Earned<b>${money(tar.reward)}</b></div><div class="sum">Remaining<b>${money(tar.rem)}</b></div></div><div class="card"><div class="head"><h2>Progress</h2></div><div class="prog"><div class="bar" style="width:${tar.pct}%"></div></div><b>${tar.pct}%</b></div>${recentTables()}`}
function simpleTable(title,head,rows,empty='No data'){return`<div class="card"><div class="head"><h2>${title}</h2></div>${rows.length?`<div class="tbl"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:`<div class="empty">${empty}</div>`}</div>`}
function recentTables(){let due=myInv().filter(v=>(+v.due||0)>0).slice(-5).reverse().map(v=>`<tr><td>${esc(v.cust)}</td><td>${esc(v.work)}</td><td>${money(v.due)}</td><td>${v.date}</td></tr>`);let fin=myFin().filter(e=>e.date===today()).slice(-5).reverse().map(e=>`<tr><td>${typeTag(e)} ${modeTag(e)}</td><td>${esc(paidBy(e))}</td><td>${esc(e.cat)}</td><td>${typeOf(e)==='expense'?'- ':'+ '}${money(e.amount)}</td></tr>`);return simpleTable('Recent Due Invoices',['Customer','Work','Due','Date'],due)+simpleTable('Today Recent Income/Expense',['Type','Paid By','Category','Amount'],fin)}

function typeTag(e){return`<span class="badge ${typeOf(e)==='expense'?'expense':'income'}">${typeOf(e)}</span>`}function modeTag(e){return`<span class="badge ${modeOf(e)==='online'?'online':'cash'}">${modeOf(e)}</span>`}

function complaints(){let dateControls=`<div class="actions"><input type="date" style="max-width:170px" value="${complaintDate}" onchange="complaintDate=this.value;complaintAll=false;complaints()"><button class="btn btn-l btn-sm" onclick="complaintDate=today();complaintAll=false;complaints()">Today</button><button class="btn btn-i btn-sm" onclick="complaintAll=true;complaints()">Show All</button></div>`;content.innerHTML=stats()+`<div class="card"><div class="head"><h2>Add Complaint / Task</h2></div><div class="row"><div class="fg"><label>Customer</label><input id="cName"></div><div class="fg"><label>Phone</label><input id="cPhone" placeholder="03001234561"></div><div class="fg"><label>Type</label><select id="cType"><option>Internet Down</option><option>Slow Speed</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Other</option></select></div></div><div class="row"><div class="fg"><label>Assign To</label><select id="cAssign">${empOpts(U.role==='employee'?U.id:'')}</select></div><div class="fg"><label>Expected Resolve Time</label><input id="cEta" type="datetime-local" value="${defaultEta()}"></div><div class="fg"><label>Details</label><input id="cDet"></div></div><label style="font-weight:900"><input type="checkbox" id="cSendEmp" checked> Send WhatsApp to assigned employee</label><br><br><button class="btn btn-p" onclick="addComp()">Add Complaint</button></div><div class="card"><div class="head"><h2>Complaint List ${complaintAll?'(All)':'('+complaintDate+')'}</h2>${dateControls}</div>${compTable()}</div>`}
function defaultEta(){let d=new Date();d.setHours(d.getHours()+2);return d.toISOString().slice(0,16)}
function fmtDT(v){if(!v)return'-';let d=new Date(v);return isNaN(d)?String(v).replace('T',' '):d.toLocaleString()}
function etaBadge(c){if(c.status==='Resolved')return'<span class="badge done">Resolved</span>';if(!c.eta)return'<span class="badge pending">No ETA</span>';return new Date(c.eta)<new Date()?'<span class="badge expense">Overdue</span>':'<span class="badge online">On Time</span>'}
function addComp(){let phone=pkMobile(cPhone.value);if(!cName.value.trim()||!validPk(phone))return toast('Customer name and valid phone 03001234561 required','error');let assigned=U.role==='employee'?U.id:cAssign.value;let rec={id:id('c'),name:cName.value.trim(),phone,type:cType.value,assigned,det:cDet.value.trim(),status:'Pending',date:today(),time:now(),eta:cEta.value,resolvedAt:'',by:key()};S.complaints.push(rec);saveAndSync('complaints',rec);toast('Complaint added','success');beep();if(cSendEmp.checked)sendComplaintEmployeeWA(rec.id);complaints()}
function compTable(){let r=myComp().slice().reverse();if(!complaintAll)r=r.filter(c=>c.date===complaintDate);if(!r.length)return'<div class="empty">No complaints</div>';return`<div class="tbl"><table><thead><tr><th>ID</th><th>Customer</th><th>Type</th><th>Assigned</th><th>Status</th><th>Created</th><th>Expected Resolve</th><th>Resolved</th><th>Action</th></tr></thead><tbody>${r.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.name)}</b><br>${esc(c.phone)}<br><small>${esc(c.det)}</small></td><td>${esc(c.type)}</td><td>${esc(empName(c.assigned))}</td><td><span class="badge ${c.status==='Resolved'?'done':'pending'}">${c.status}</span><br>${etaBadge(c)}</td><td>${esc(c.time||c.date)}</td><td>${esc(fmtDT(c.eta))}</td><td>${esc(c.resolvedAt||'-')}</td><td><div class="actions">${U.role==='admin'?`<button class="btn btn-i btn-sm" onclick="editComplaint('${c.id}')">Edit</button><button class="btn btn-e btn-sm" onclick="deleteComplaint('${c.id}')">Delete</button>`:''}<button class="btn btn-s btn-sm" onclick="sendComplaintWA('${c.id}')">Customer WA</button><button class="btn btn-w btn-sm" onclick="sendComplaintEmployeeWA('${c.id}')">Employee WA</button>${c.status!=='Resolved'?`<button class="btn btn-s btn-sm" onclick="resComp('${c.id}')">Resolve</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}

function sendComplaintWA(i){let c=S.complaints.find(x=>x.id===i);if(c)window.open('https://wa.me/'+waNumber(c.phone)+'?text='+encodeURIComponent(complaintMsg(c)),'_blank')}
function sendComplaintEmployeeWA(i){let c=S.complaints.find(x=>x.id===i);if(!c)return;let ph=empPhone(c.assigned);if(!ph)return toast('Assigned employee phone not available','error');window.open('https://wa.me/'+waNumber(ph)+'?text='+encodeURIComponent(complaintMsg(c,true)),'_blank')}
function resComp(i){let c=S.complaints.find(x=>x.id===i);if(c){c.status='Resolved';c.resolvedAt=now();saveAndSync('complaints',c);toast('Complaint resolved','success');complaints()}}
function editComplaint(i){let c=S.complaints.find(x=>x.id===i);if(!c)return;c.name=prompt('Customer',c.name)||c.name;c.phone=pkMobile(prompt('Phone',c.phone)||c.phone);c.type=prompt('Type',c.type)||c.type;c.det=prompt('Details',c.det)||c.det;c.status=prompt('Status',c.status)||c.status;saveAndSync('complaints',c);complaints()}
function deleteComplaint(i){if(!confirm('Delete complaint?'))return;S.complaints=S.complaints.filter(x=>x.id!==i);delAndSync('complaints',i);complaints()}

function employees(){if(U.role!=='admin')return dash();content.innerHTML=`<div class="card"><div class="head"><h2>Add Employee</h2></div><div class="row"><div class="fg"><label>Name</label><input id="eName"></div><div class="fg"><label>Login</label><input id="ePhone"></div><div class="fg"><label>Mobile</label><input id="eMobile" placeholder="03001234561"></div></div><div class="row two"><div class="fg"><label>PIN</label><input id="ePin" value="1234"></div><div class="fg"><label>Role</label><input id="eRole" placeholder="Collection"></div></div><div class="actions">${['complaints','attendance','invoice','finance','targets'].map(p=>`<label><input type="checkbox" class="perm" value="${p}" checked> ${p}</label>`).join('')}</div><br><button class="btn btn-p" onclick="addEmp()">Add Employee</button></div><div class="card"><div class="head"><h2>Employees</h2></div>${empTable()}</div>`}
function addEmp(){let per={};document.querySelectorAll('.perm').forEach(x=>per[x.value]=x.checked);let mobile=pkMobile(eMobile.value);if(!eName.value.trim()||!ePhone.value.trim())return toast('Name and login required','error');if(mobile&&!validPk(mobile))return toast('Mobile number format use karein: 03001234561','error');if(S.employees.some(e=>e.phone.toLowerCase()===ePhone.value.trim().toLowerCase()))return toast('Employee already exists','error');let rec={id:id('e'),name:eName.value.trim(),phone:ePhone.value.trim(),mobile,pin:ePin.value.trim()||'1234',role:eRole.value.trim()||'Employee',active:true,per};S.employees.push(rec);saveAndSync('employees',rec);employees()}
function empTable(){return`<div class="tbl"><table><thead><tr><th>Name</th><th>Login</th><th>Mobile</th><th>Role</th><th>PIN</th><th>Status</th><th>Action</th></tr></thead><tbody>${S.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.phone)}</td><td>${esc(e.mobile||'')}</td><td>${esc(e.role)}</td><td>${esc(e.pin)}</td><td>${e.active?'Active':'Inactive'}</td><td><div class="actions"><button class="btn btn-i btn-sm" onclick="editEmp('${e.id}')">Edit</button><button class="btn btn-w btn-sm" onclick="togEmp('${e.id}')">${e.active?'Disable':'Enable'}</button><button class="btn btn-e btn-sm" onclick="delEmp('${e.id}')">Delete</button></div></td></tr>`).join('')}</tbody></table></div>`}
function editEmp(i){let e=S.employees.find(x=>x.id===i);if(!e)return;e.name=prompt('Name',e.name)||e.name;e.phone=prompt('Login',e.phone)||e.phone;e.mobile=pkMobile(prompt('Mobile',e.mobile||'')||e.mobile);e.pin=prompt('PIN',e.pin)||e.pin;e.role=prompt('Role',e.role)||e.role;saveAndSync('employees',e);employees()}
function togEmp(i){let e=S.employees.find(x=>x.id===i);if(e){e.active=!e.active;saveAndSync('employees',e)}employees()}function delEmp(i){if(!confirm('Delete employee?'))return;S.employees=S.employees.filter(x=>x.id!==i);delAndSync('employees',i);employees()}

function attendance(){content.innerHTML=`<div class="card"><div class="head"><h2>Mark Attendance</h2></div><div class="row"><div class="fg"><label>Employee</label><select id="aEmp">${empOpts(U.role==='employee'?U.id:'')}</select></div><div class="fg"><label>Status</label><select id="aStatus"><option>Present</option><option>Absent</option><option>Leave</option><option>Half Day</option></select></div><div class="fg"><label>Date</label><input id="aDate" type="date" value="${today()}"></div></div><button class="btn btn-p" onclick="markAtt()">Save Attendance</button></div><div class="card"><div class="head"><h2>Attendance List</h2></div>${attTable()}</div>`}
function markAtt(){let emp=U.role==='employee'?U.id:aEmp.value,old=S.attendance.find(a=>a.emp===emp&&a.date===aDate.value);if(old){old.status=aStatus.value;old.time=now();saveAndSync('attendance',old)}else{let rec={id:id('a'),emp,date:aDate.value,status:aStatus.value,by:key(),time:now()};S.attendance.push(rec);saveAndSync('attendance',rec)}attendance()}
function attTable(){let r=U.role==='admin'?S.attendance:S.attendance.filter(a=>a.emp===U.id);if(!r.length)return'<div class="empty">No attendance</div>';return`<div class="tbl"><table><thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>Time</th><th>Action</th></tr></thead><tbody>${r.slice().reverse().map(a=>`<tr><td>${a.date}</td><td>${empName(a.emp)}</td><td>${a.status}</td><td>${a.time}</td><td>${U.role==='admin'?`<button class="btn btn-e btn-sm" onclick="delAtt('${a.id}')">Delete</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}function delAtt(i){S.attendance=S.attendance.filter(x=>x.id!==i);delAndSync('attendance',i);attendance()}

function invoice(){content.innerHTML=`<div class="summary">${invoiceSummaryCards()}</div><div class="card"><div class="head"><h2>Create Invoice</h2><button class="btn btn-l btn-sm" onclick="draft=[];invoice()">Clear</button></div><div class="row"><div class="fg"><label>Customer</label><input id="invCust"></div><div class="fg"><label>WhatsApp</label><input id="invPhone" placeholder="03001234561"></div><div class="fg"><label>Work Type</label><select id="invWork" onchange="toggleRewardBox()"><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Repair</option><option>Other Work</option></select></div></div><div id="rewardBox" class="row two"><div class="fg"><label>Reward Source</label><select id="rewardSource"><option>New Connection</option><option>Invoice</option></select></div><div class="fg"><label>Reference / Reward Employee</label><select id="refEmp">${empOpts(U.role==='employee'?U.id:'')}</select></div></div><div class="item-line"><div class="fg"><label>Product / Service</label><input id="itName"></div><div class="fg"><label>Qty</label><input id="itQty" type="number" value="1"></div><div class="fg"><label>Rate</label><input id="itRate" type="number" value="0"></div><button class="btn btn-i" onclick="addItem()">Add</button></div><div id="itemsArea"></div><div class="row"><div class="fg"><label>Discount</label><input id="disc" type="number" value="0" oninput="drawItems()"></div><div class="fg"><label>Amount Received</label><input id="received" type="number" value="0" oninput="drawItems()"></div><div class="fg"><label>Notes</label><input id="invNotes"></div></div><div class="actions"><button class="btn btn-p" onclick="saveInv()">Save Invoice</button><button class="btn btn-s" onclick="sendDraftInv()">Send WhatsApp</button></div></div><div class="card"><div class="head"><h2>Due Invoices</h2></div>${dueTable()}</div><div class="card"><div class="head"><h2>Invoice History</h2></div>${invTable()}</div>`;drawItems();toggleRewardBox()}
function invoiceSummaryCards(){let x=invoiceSummary();return`<div class="sum">Total Sales<b>${money(x.sales)}</b></div><div class="sum">Amount Received<b>${money(x.received)}</b></div><div class="sum">Due Amount<b>${money(x.due)}</b></div><div class="sum">Due Invoices<b>${x.count}</b></div>`}
function toggleRewardBox(){let b=document.getElementById('rewardBox');if(b)b.style.display=document.getElementById('invWork').value==='New Connection'?'grid':'none'}
function addItem(){if(!itName.value.trim())return toast('Item name required','error');draft.push({name:itName.value.trim(),qty:+itQty.value||1,rate:+itRate.value||0});itName.value='';itQty.value=1;itRate.value=0;drawItems()}
function remItem(i){draft.splice(i,1);drawItems()}function totals(){let sub=draft.reduce((s,x)=>s+x.qty*x.rate,0),d=+document.getElementById('disc')?.value||0,total=Math.max(0,sub-d),rec=+document.getElementById('received')?.value||0;return{sub,disc:d,total,received:Math.min(rec,total),due:Math.max(0,total-rec)}}
function drawItems(){let a=document.getElementById('itemsArea');if(!a)return;let t=totals();a.innerHTML=draft.length?`<div class="tbl"><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr></thead><tbody>${draft.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.qty*x.rate)}</td><td><button class="btn btn-e btn-sm" onclick="remItem(${i})">X</button></td></tr>`).join('')}</tbody></table></div><div class="summary"><div class="sum">Subtotal<b>${money(t.sub)}</b></div><div class="sum">Discount<b>${money(t.disc)}</b></div><div class="sum">Received<b>${money(t.received)}</b></div><div class="sum">Due<b>${money(t.due)}</b></div></div>`:'<div class="empty">No items added</div>'}
function invObj(){let t=totals(),phone=pkMobile(invPhone.value);return{id:id('inv'),cust:invCust.value.trim(),phone,work:invWork.value,refEmp:document.getElementById('refEmp')?.value||key(),rewardSource:document.getElementById('rewardSource')?.value||'',items:[...draft],sub:t.sub,disc:t.disc,total:t.total,received:t.received,due:t.due,notes:invNotes.value.trim(),date:today(),time:now(),by:key(),byName:U.name}}

function saveInv(){if(!draft.length)return toast('Add item','error');let v=invObj();if(!v.cust)return toast('Customer required','error');if(v.phone&&!validPk(v.phone))return toast('Mobile number format use karein: 03001234561','error');S.invoices.push(v);saveAndSync('invoices',v);if(v.received>0)addFinanceFromInvoice(v,v.received);if(v.work==='New Connection')applyTarget(v.refEmp,v.total);draft=[];toast('Invoice saved','success');invoice()}
function addFinanceFromInvoice(v,amount){let rec={id:id('fin'),type:'income',mode:'cash',cat:'Invoice - '+v.work,amount,customer:v.cust,receiver:empName(v.refEmp)||v.byName,online:'',phone:v.phone,notes:'Auto income from invoice '+v.id,date:today(),time:now(),by:v.refEmp||v.by,byName:empName(v.refEmp)||v.byName};S.finance.push(rec);fbSet('finance',rec);saveLocal()}
function sendDraftInv(){if(!draft.length)return toast('Add item','error');let v=invObj();if(!validPk(v.phone))return toast('Mobile number format use karein: 03001234561','error');window.open('https://wa.me/'+waNumber(v.phone)+'?text='+encodeURIComponent(invMsg(v)),'_blank')}
function invTable(){let r=myInv().slice().reverse();if(!r.length)return'<div class="empty">No invoices</div>';return`<div class="tbl"><table><thead><tr><th>Date</th><th>Customer</th><th>Work</th><th>Total</th><th>Received</th><th>Due</th><th>Ref Employee</th><th>Action</th></tr></thead><tbody>${r.map(v=>`<tr><td>${v.date}</td><td>${esc(v.cust)}<br>${esc(v.phone)}</td><td>${esc(v.work)}</td><td>${money(v.total)}</td><td>${money(v.received)}</td><td>${money(v.due)}</td><td>${esc(empName(v.refEmp))}</td><td><div class="actions"><button class="btn btn-s btn-sm" onclick="sendSavedInv('${v.id}')">WhatsApp</button>${(+v.due||0)>0?`<button class="btn btn-i btn-sm" onclick="receiveDue('${v.id}')">Receive</button>`:''}${U.role==='admin'?`<button class="btn btn-e btn-sm" onclick="delInv('${v.id}')">Delete</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`}
function dueTable(){let r=myInv().filter(v=>(+v.due||0)>0).slice().reverse();if(!r.length)return'<div class="empty">No due invoices</div>';return`<div class="tbl"><table><thead><tr><th>Customer</th><th>Phone</th><th>Total</th><th>Received</th><th>Due</th><th>Action</th></tr></thead><tbody>${r.map(v=>`<tr><td>${esc(v.cust)}</td><td>${esc(v.phone)}</td><td>${money(v.total)}</td><td>${money(v.received)}</td><td>${money(v.due)}</td><td><button class="btn btn-i btn-sm" onclick="receiveDue('${v.id}')">Receive Payment</button></td></tr>`).join('')}</tbody></table></div>`}
function sendSavedInv(i){let v=S.invoices.find(x=>x.id===i);if(v)window.open('https://wa.me/'+waNumber(v.phone)+'?text='+encodeURIComponent(invMsg(v)),'_blank')}
function receiveDue(i){let v=S.invoices.find(x=>x.id===i);if(!v)return;let a=+prompt('Received amount',v.due)||0;if(a<=0)return;v.received=(+v.received||0)+a;v.due=Math.max(0,(+v.total||0)-v.received);saveAndSync('invoices',v);addFinanceFromInvoice(v,a);toast('Payment received','success');invoice()}
function delInv(i){if(!confirm('Delete invoice?'))return;S.invoices=S.invoices.filter(x=>x.id!==i);delAndSync('invoices',i);invoice()}

function finance(){let f=calc(filteredFinance());content.innerHTML=`<div class="summary"><div class="sum">Total Income<b>${money(f.inc)}</b></div><div class="sum">Total Expense<b>${money(f.exp)}</b></div><div class="sum">Cash Income<b>${money(f.cash)}</b></div><div class="sum">Online Income<b>${money(f.online)}</b></div><div class="sum">Cash Expense<b>${money(f.cashExp)}</b></div><div class="sum">Online Expense<b>${money(f.onlineExp)}</b></div><div class="sum">Net Balance<b>${money(f.bal)}</b></div><div class="sum">Entries<b>${filteredFinance().length}</b></div></div><div class="card"><div class="head"><h2>Finance Filters</h2><div class="actions"><input type="date" style="max-width:170px" value="${financeDate}" onchange="financeDate=this.value;financeAll=false;finance()"><button class="btn btn-l btn-sm" onclick="financeDate=today();financeAll=false;finance()">Today</button><button class="btn btn-i btn-sm" onclick="financeAll=true;finance()">Show All</button><button class="btn btn-s btn-sm" onclick="loadFirebase()">Fetch Firebase</button></div></div>${U.role==='admin'?`<div class="fg"><label>Employee Filter</label><select onchange="financeEmp=this.value;finance()"><option value="all">All Employees/Admin</option><option value="admin" ${financeEmp==='admin'?'selected':''}>Admin</option>${S.employees.map(e=>`<option value="${e.id}" ${financeEmp===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>`:''}${employeeWiseSummary()}</div><div class="card"><div class="head"><h2>Add Account Entry</h2></div><div class="row"><div class="fg"><label>Type</label><select id="ft"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="fg"><label>Mode</label><select id="fm" onchange="onBox()"><option value="cash">Cash</option><option value="online">Online</option></select></div><div class="fg"><label>Category</label><select id="fc"><option>Monthly Fee</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Office Expense</option><option>Other</option></select></div></div><div class="row"><div class="fg"><label>Customer Name / Paid By</label><input id="fcu"></div><div class="fg"><label>Amount</label><input id="fa" type="number" value="0"></div><div class="fg"><label>Receiver Name</label><input id="fr" placeholder="Receiver"></div></div><div class="row"><div class="fg" id="ob"><label>Online Account</label><input id="fo" placeholder="JazzCash / Bank"></div><div class="fg"><label>Client WhatsApp</label><input id="fp" placeholder="03001234561"></div><div class="fg"><label>Notes</label><input id="fn"></div></div><button class="btn btn-p" onclick="addFin()">Save Entry</button></div><div class="card"><div class="head"><h2>Finance Report ${financeAll?'(All)':'('+financeDate+')'}</h2><div class="actions"><button class="btn btn-l btn-sm" onclick="printFinanceReport()">Print Report</button><button class="btn btn-s btn-sm" onclick="dailyReport()">WhatsApp Report</button></div></div>${finTable()}</div>`;onBox()}
function filteredFinance(){let r=myFin().slice();if(!financeAll)r=r.filter(e=>e.date===financeDate);return r}
function onBox(){let b=document.getElementById('ob');if(b)b.style.display=fm.value==='online'?'block':'none'}
function addFin(){let amount=+fa.value||0;if(amount<=0)return toast('Amount required','error');let phone=pkMobile(fp.value);if(phone&&!validPk(phone))return toast('Mobile number format use karein: 03001234561','error');let e={id:id('fin'),type:ft.value,mode:fm.value,cat:fc.value,amount,customer:fcu.value.trim(),receiver:fr.value.trim()||U.name,online:fm.value==='online'?fo.value.trim():'',phone,notes:fn.value.trim(),date:today(),time:now(),by:key(),byName:U.name};S.finance.push(e);if(e.type==='income')applyTarget(e.by,e.amount);saveAndSync('finance',e);toast('Entry saved','success');beep();finance()}
function employeeWiseSummary(){let data={};filteredFinance().forEach(e=>{let k=e.by||'admin',n=k==='admin'?'Admin':empName(k);data[k]=data[k]||{name:n,inc:0,exp:0,cash:0,online:0};let a=+e.amount||0;if(typeOf(e)==='expense')data[k].exp+=a;else data[k].inc+=a;if(modeOf(e)==='online')data[k].online+=a;else data[k].cash+=a});let rows=Object.values(data);return rows.length?`<div class="tbl"><table><thead><tr><th>Employee</th><th>Income</th><th>Expense</th><th>Cash</th><th>Online</th><th>Balance / Amount With</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${money(r.inc)}</td><td>${money(r.exp)}</td><td>${money(r.cash)}</td><td>${money(r.online)}</td><td><b>${money(r.inc-r.exp)}</b></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No employee-wise data</div>'}
function finTable(){let r=filteredFinance().slice().reverse();if(!r.length)return'<div class="empty">No finance entries</div>';let sec=(title,arr)=>`<h3 style="margin:14px 0">${title}</h3>${arr.length?`<div class="tbl"><table><thead><tr><th>Time</th><th>Date</th><th>Employee</th><th>Type</th><th>Payment</th><th>Paid By / Customer</th><th>Category</th><th>Receiver</th><th>Account</th><th>Amount</th><th>Action</th></tr></thead><tbody>${arr.map(e=>`<tr class="${typeOf(e)==='expense'?'expense-row':'income-row'}"><td>${esc(e.time||'')}</td><td>${esc(e.date||'')}</td><td>${esc(e.by==='admin'?'Admin':empName(e.by))}</td><td>${typeTag(e)}</td><td>${modeTag(e)}</td><td><b>${esc(paidBy(e))}</b></td><td>${esc(e.cat)}</td><td>${esc(e.receiver)}</td><td>${esc(e.online||'-')}</td><td class="${typeOf(e)==='expense'?'money-minus':'money-plus'}">${typeOf(e)==='expense'?'- ':'+ '}${money(e.amount)}</td><td><div class="actions"><button class="btn btn-s btn-sm" onclick="sendSlip('${e.id}')">Slip</button>${U.role==='admin'?`<button class="btn btn-e btn-sm" onclick="delFin('${e.id}')">Delete</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">None</div>'}`;return sec('Income Entries',r.filter(e=>typeOf(e)==='income'))+sec('Expense Entries',r.filter(e=>typeOf(e)==='expense'))}
function slipMsg(e){
 return `💳 *FIRE.NET.PK - PAYMENT SLIP*
━━━━━━━━━━━━━━━━━━━━
*Slip ID:* ${e.id}
*Date/Time:* ${e.time}
*Entry Type:* ${typeOf(e).toUpperCase()}
*Payment Mode:* ${modeOf(e).toUpperCase()}

👤 *PAID BY / CUSTOMER*
${paidBy(e)}

📌 *PAYMENT DETAILS*
Category: ${e.cat}
Amount: ${typeOf(e)==='expense'?'- ':'+ '}${money(e.amount)}
Receiver: ${e.receiver}
${e.online?'Online Account: '+e.online+'\n':''}
Notes: ${e.notes||'-'}

━━━━━━━━━━━━━━━━━━━━
Recorded By: ${e.byName}
*Fire.net.pk Accounts*`;
}
function sendSlip(i){let e=S.finance.find(x=>x.id===i);if(!e?.phone)return toast('Client WhatsApp not saved','error');window.open('https://wa.me/'+waNumber(e.phone)+'?text='+encodeURIComponent(slipMsg(e)),'_blank')}
function delFin(i){if(!confirm('Delete finance entry?'))return;S.finance=S.finance.filter(x=>x.id!==i);delAndSync('finance',i);finance()}
function financeReportText(){
 let r=filteredFinance(),f=calc(r);
 let empFilter=financeEmp==='all'?'All Employees / Admin':financeEmp==='admin'?'Admin':empName(financeEmp);
 let incomeRows=r.filter(e=>typeOf(e)==='income');
 let expenseRows=r.filter(e=>typeOf(e)==='expense');
 return `📊 *FIRE.NET.PK - FINANCE REPORT*
━━━━━━━━━━━━━━━━━━━━
*Report Period:* ${financeAll?'All Dates':financeDate}
*Employee Filter:* ${empFilter}
*Generated At:* ${now()}

💰 *SUMMARY*
Total Income: ${money(f.inc)}
Total Expense: ${money(f.exp)}
Net Balance: ${money(f.bal)}

💵 *CASH / ONLINE BREAKDOWN*
Cash Income: ${money(f.cash)}
Online Income: ${money(f.online)}
Cash Expense: ${money(f.cashExp)}
Online Expense: ${money(f.onlineExp)}
Total Entries: ${r.length}

━━━━━━━━━━━━━━━━━━━━
✅ *INCOME ENTRIES*
${incomeRows.length?incomeRows.map((e,i)=>`${i+1}. ${e.date} | ${e.by==='admin'?'Admin':empName(e.by)}\n   ${modeOf(e).toUpperCase()} | Paid By: ${paidBy(e)}\n   ${e.cat} | +${money(e.amount)}`).join('\n'):'No income entries'}

━━━━━━━━━━━━━━━━━━━━
❌ *EXPENSE ENTRIES*
${expenseRows.length?expenseRows.map((e,i)=>`${i+1}. ${e.date} | ${e.by==='admin'?'Admin':empName(e.by)}\n   ${modeOf(e).toUpperCase()} | Paid By: ${paidBy(e)}\n   ${e.cat} | -${money(e.amount)}`).join('\n'):'No expense entries'}

━━━━━━━━━━━━━━━━━━━━
Prepared by: ${U?U.name:'System'}
*Fire.net.pk Accounts*`;
}
function dailyReport(){let p=prompt('WhatsApp number 03001234561');if(!p)return;p=pkMobile(p);if(!validPk(p))return toast('Mobile number format use karein: 03001234561','error');window.open('https://wa.me/'+waNumber(p)+'?text='+encodeURIComponent(financeReportText()),'_blank')}
function printFinanceReport(){let r=filteredFinance(),f=calc(r),title=financeAll?'All Dates':financeDate;let html=`<!doctype html><html><head><title>Finance Report</title><style>body{font-family:Arial;padding:25px;color:#111}h1{color:#e74c3c;margin:0}.top{border-bottom:3px solid #243447;padding-bottom:12px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.box{border:1px solid #ddd;padding:10px;border-radius:8px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border:1px solid #ddd;padding:7px;font-size:12px}th{background:#243447;color:white}.sign{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:45px}.sig{border-top:1px solid #333;text-align:center;padding-top:8px}</style></head><body><div class="top"><h1>Fire.net.pk Finance Report</h1><p>Report Period: ${title}<br>Employee: ${financeEmp==='all'?'All':financeEmp==='admin'?'Admin':empName(financeEmp)}<br>Generated: ${now()}</p></div><div class="grid"><div class="box">Income<br><b>${money(f.inc)}</b></div><div class="box">Expense<br><b>${money(f.exp)}</b></div><div class="box">Cash<br><b>${money(f.cash)}</b></div><div class="box">Online<br><b>${money(f.online)}</b></div><div class="box">Cash Expense<br><b>${money(f.cashExp)}</b></div><div class="box">Online Expense<br><b>${money(f.onlineExp)}</b></div><div class="box">Net Balance<br><b>${money(f.bal)}</b></div><div class="box">Entries<br><b>${r.length}</b></div></div><h2>Employee-wise Summary</h2>${employeeWiseSummary().replaceAll('class="tbl"','').replaceAll('class="empty"','')}<h2>Entries</h2><table><thead><tr><th>Date</th><th>Employee</th><th>Type</th><th>Mode</th><th>Paid By</th><th>Category</th><th>Amount</th></tr></thead><tbody>${r.map(e=>`<tr><td>${e.date}</td><td>${e.by==='admin'?'Admin':empName(e.by)}</td><td>${typeOf(e)}</td><td>${modeOf(e)}</td><td>${esc(paidBy(e))}</td><td>${esc(e.cat)}</td><td>${typeOf(e)==='expense'?'- ':'+ '}${money(e.amount)}</td></tr>`).join('')}</tbody></table><div class="sign"><div class="sig">Prepared By</div><div class="sig">Checked By</div><div class="sig">Approved By</div></div></body></html>`;let w=window.open('','_blank');w.document.write(html);w.document.close();setTimeout(()=>w.print(),500)}

function targets(){content.innerHTML=`${U.role==='admin'?`<div class="card"><div class="head"><h2>Assign Target</h2></div><div class="row"><div class="fg"><label>Employee</label><select id="te">${empOpts()}</select></div><div class="fg"><label>Target Amount</label><input id="ta" type="number" value="20000"></div><div class="fg"><label>Reward Type</label><select id="rt"><option value="fixed">Fixed Amount</option><option value="percentage">Percentage</option></select></div></div><div class="row two"><div class="fg"><label>Reward Value</label><input id="rv" type="number" value="1000"></div><div class="fg"><label>Reward Label</label><input id="tr" value="Daily Target Reward"></div></div><button class="btn btn-p" onclick="assignTarget()">Assign Target</button></div>`:''}<div class="card"><div class="head"><h2>Target Progress</h2></div>${targetTable()}</div>`}
function assignTarget(){let target=+ta.value||0;if(target<=0)return toast('Target required','error');let rec={id:id('t'),emp:te.value,target,achieved:0,rewardType:rt.value,rewardValue:+rv.value||0,reward:tr.value.trim()||'Reward',date:today()};S.targets.push(rec);saveAndSync('targets',rec);targets()}
function applyTarget(emp,amount){let t=S.targets.find(x=>x.emp===emp&&(+x.achieved)<(+x.target));if(t){t.achieved=(+t.achieved)+(+amount);saveAndSync('targets',t);if(t.achieved>=t.target){toast('Target completed! Reward unlocked','success');beep()}}}
function targetTable(){let r=U.role==='admin'?S.targets:S.targets.filter(t=>t.emp===U.id);if(!r.length)return'<div class="empty">No targets</div>';return`<div class="tbl"><table><thead><tr><th>Employee</th><th>Date</th><th>Target</th><th>Achieved</th><th>Progress</th><th>Reward Rule</th><th>Reward Earned</th></tr></thead><tbody>${r.map(t=>{let p=Math.min(100,Math.round((+t.achieved||0)/(+t.target||1)*100));return`<tr><td>${empName(t.emp)}</td><td>${t.date}</td><td>${money(t.target)}</td><td>${money(t.achieved)}</td><td><div class="prog"><div class="bar" style="width:${p}%"></div></div><b>${p}%</b></td><td>${t.rewardType==='percentage'?(+t.rewardValue||0)+'%':money(t.rewardValue)} - ${esc(t.reward)}</td><td>${money(rewardEarned(t))}</td></tr>`}).join('')}</tbody></table></div>`}

function backup(){content.innerHTML=`<div class="card"><div class="head"><h2>Backup & Restore</h2></div><div class="actions"><button class="btn btn-s" onclick="syncAll()">Sync All to Firebase</button><button class="btn btn-i" onclick="loadFirebase()">Fetch Firebase</button><button class="btn btn-s" onclick="downloadBackup()">Download Backup</button><button class="btn btn-i" onclick="restoreFile.click()">Restore Backup</button><button class="btn btn-e" onclick="clearAll()">Clear All</button></div><input class="hidden" type="file" id="restoreFile" accept=".json" onchange="restoreBackup(event)"></div>`}
async function syncAll(){for(const e of S.employees)await fbSet('employees',e);for(const e of S.complaints)await fbSet('complaints',e);for(const e of S.finance)await fbSet('finance',e);for(const e of S.invoices)await fbSet('invoices',e);for(const e of S.targets)await fbSet('targets',e);for(const e of S.attendance)await fbSet('attendance',e);await fbSettings();toast('Sync complete','success')}
function downloadBackup(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='firenet-backup-'+today()+'.json';a.click()}
function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);saveLocal();toast('Restored','success');setTimeout(()=>location.reload(),700)}catch(x){toast('Invalid backup','error')}};r.readAsText(f)}
function clearAll(){if(confirm('Clear all data?')){localStorage.removeItem(KEY);location.reload()}}
function notify(){let p=myComp().filter(c=>c.status!=='Resolved').length;if(U.role==='employee'&&p){toast(`You have ${p} pending task(s)`,'warning');beep()}}
load();window.addEventListener('load',()=>{clock();initFirebase();if(S.session){U=S.session;openApp()}});
</script>
</body>
</html>
