:root{--p:#e74c3c;--d:#243447;--s:#16a34a;--e:#dc2626;--b:#f4f7fb;--m:#64748b;--i:#2563eb;--w:#d97706}*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}body{background:linear-gradient(135deg,#eef2ff,#fff1f2);min-height:100vh;color:#1f2937}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:15px}.login-card,.card{background:#fff;border-radius:18px;box-shadow:0 12px 30px rgba(15,23,42,.08);border:1px solid #eef2f7}.login-card{max-width:420px;width:100%;overflow:hidden}.login-head{background:linear-gradient(135deg,var(--d),#111827);color:white;text-align:center;padding:32px}.login-body{padding:24px}.app{display:none;padding:12px}.container{max-width:1200px;margin:auto}.header{background:#fff;border-radius:18px;padding:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;box-shadow:0 12px 30px rgba(15,23,42,.08)}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--p);color:white;display:flex;align-items:center;justify-content:center;font-size:23px}.brand h1{font-size:20px;color:var(--d)}.dt{font-weight:800;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:9px}.profile{position:relative}.profile-btn{display:flex;gap:8px;align-items:center;background:#f8fafc;border:1px solid #e5e7eb;border-radius:999px;padding:6px 10px}.avatar{width:34px;height:34px;border-radius:50%;background:#7c3aed;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900}.menu{display:none;position:absolute;right:0;top:48px;background:white;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.15);min-width:190px;overflow:hidden;z-index:10}.menu.active{display:block}.menu button{display:block;width:100%;background:white;text-align:left;padding:12px}.menu button:hover{background:#f8fafc;color:var(--p)}.nav{display:flex;gap:8px;background:#fff;padding:8px;border-radius:16px;margin-bottom:12px;overflow-x:auto;box-shadow:0 10px 25px rgba(15,23,42,.07)}.nav button{white-space:nowrap;background:#f8fafc;color:#475569;padding:10px 13px;border-radius:12px;font-weight:900}.nav button.active{background:var(--p);color:white}.card{padding:16px;margin-bottom:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.head h2{font-size:18px;color:var(--d)}.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.row.two{grid-template-columns:repeat(2,1fr)}.fg{margin-bottom:12px}.fg label{display:block;font-size:13px;font-weight:900;margin-bottom:6px;color:#374151}input,select,textarea{width:100%;padding:11px;border:1px solid #e5e7eb;border-radius:12px;outline:none}textarea{min-height:75px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 13px;border-radius:12px;color:white;background:var(--d);font-weight:900;text-decoration:none}.btn-p{background:var(--p)}.btn-s{background:var(--s)}.btn-e{background:var(--e)}.btn-i{background:var(--i)}.btn-w{background:var(--w)}.btn-l{background:#e5e7eb;color:#111827}.btn-sm{font-size:12px;padding:7px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;background:#fff;border-radius:16px;box-shadow:0 8px 18px rgba(15,23,42,.05);border:1px solid #eef2f7}.stat span{font-size:12px;color:var(--m);font-weight:900}.stat b{display:block;font-size:22px;margin-top:5px}.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px;vertical-align:top}th{background:#f8fafc;color:#475569;text-transform:uppercase;font-size:12px}.badge{padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;display:inline-block}.cash{background:#dcfce7;color:#166534}.online{background:#dbeafe;color:#1e40af}.pending{background:#fef3c7;color:#92400e}.done{background:#dcfce7;color:#166534}.empty{text-align:center;color:var(--m);font-weight:800;padding:25px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.sum{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:13px}.sum b{display:block;font-size:20px;margin-top:4px}.item-line{display:grid;grid-template-columns:2fr .7fr 1fr auto;gap:10px;align-items:end}.toast-wrap{position:fixed;right:14px;top:14px;z-index:99}.toast{background:white;border-left:5px solid var(--i);box-shadow:0 14px 35px rgba(15,23,42,.18);padding:12px 14px;border-radius:14px;margin-bottom:8px;font-weight:800}.toast.success{border-left-color:var(--s)}.toast.error{border-left-color:var(--e)}.toast.warning{border-left-color:var(--w)}.prog{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--s),#84cc16)}.modal-bg{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;align-items:center;justify-content:center;padding:15px}.modal-bg.active{display:flex}.modal{background:white;border-radius:18px;max-width:500px;width:100%;padding:18px}@media(max-width:850px){.grid,.summary{grid-template-columns:repeat(2,1fr)}.row,.row.two{grid-template-columns:1fr}}@media(max-width:560px){.app{padding:8px}.header>*{width:100%}.profile-btn{width:100%}.nav{display:grid;grid-template-columns:1fr 1fr}.grid,.summary{grid-template-columns:1fr}.item-line{grid-template-columns:1fr}.actions .btn{width:100%}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="login-head"><h1>🔥 Fire.net.pk</h1><p>ISP Management System</p></div><div class="login-body"><div class="fg"><label>Username / Phone</label><input id="lu" placeholder="admin or ali"></div><div class="fg"><label>Password / PIN</label><input id="lp" type="password" placeholder="admin123 or 1234"></div><button class="btn btn-p" style="width:100%" onclick="login()">Login</button><p style="font-size:12px;color:#64748b;margin-top:12px;line-height:1.5">Default: <b>admin/admin123</b> or employee <b>ali/1234</b>. Admin password can be changed from profile.</p></div></div></div>
<div id="app" class="app"><div class="container"><div class="header"><div class="brand"><div class="logo">🔥</div><div><h1>Fire.net.pk ISP</h1><small style="color:#64748b;font-weight:800">Complaints • Accounts • Invoice • Targets</small></div></div><div id="dt" class="dt"></div><div id="syncStatus" class="dt" style="font-size:12px">Firebase: starting...</div><div class="profile"><button class="profile-btn" onclick="toggleMenu()"><span id="av" class="avatar">A</span><span><b id="pn">Admin</b><br><small id="pr">Admin</small></span></button><div id="pm" class="menu"><button onclick="openPwd()">Change Password</button><button onclick="logout()">Logout</button></div></div></div><div id="nav" class="nav"></div><div id="content"></div></div></div>
<div id="tw" class="toast-wrap"></div><div id="pwdModal" class="modal-bg"><div class="modal"><div class="head"><h2>Change Password / PIN</h2><button class="btn btn-l btn-sm" onclick="closePwd()">Close</button></div><div class="fg"><label>New Password / PIN</label><input id="newPwd" type="password"></div><button class="btn btn-p" onclick="savePwd()">Save</button></div></div>

<script>
const KEY='firenet_single_html_final_v2';let S,U,TAB='dashboard',draft=[];
let db=null, firebaseReady=false, fbLoading=false, unsubscribers=[];
const firebaseConfig={apiKey:'AIzaSyDEOfh1JufNuoEIMEZ_tgt1Lg4PSLLUE7E',authDomain:'complaint-b1f3c.firebaseapp.com',projectId:'complaint-b1f3c',storageBucket:'complaint-b1f3c.firebasestorage.app',messagingSenderId:'400630080362',appId:'1:400630080362:web:bbe16973f247dd67407b13',measurementId:'G-ENJVNBEVXT'};
function setSyncStatus(txt,type='info'){let el=document.getElementById('syncStatus');if(el){el.textContent=txt;el.style.color=type==='error'?'#dc2626':type==='success'?'#166534':'#475569'}}
async function initFirebase(){
 try{
   if(!window.firebase){setSyncStatus('Firebase: SDK missing','error');return false}
   if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
   db=firebase.firestore();
   firebaseReady=true;setSyncStatus('Firebase: connected','success');
   await loadFromFirebase();
   startRealtimeSync();
   return true;
 }catch(e){console.error('Firebase init error:',e);firebaseReady=false;setSyncStatus('Firebase: '+(e.message||'failed'),'error');toast('Firebase error: '+(e.message||e),'error');return false}
}
function cleanForFirebase(obj){return JSON.parse(JSON.stringify(obj||{}))}
async function fbSet(col,obj){
 if(!firebaseReady||!db||fbLoading||!obj||!obj.id)return;
 try{await db.collection(col).doc(obj.id).set(cleanForFirebase(obj),{merge:true});setSyncStatus('Firebase: synced','success')}
 catch(e){console.error('Firebase write failed',col,obj,e);setSyncStatus('Firebase write failed','error');toast('Firebase write failed: '+(e.message||e),'error')}
}
async function fbDelete(col,id){
 if(!firebaseReady||!db||!id)return;
 try{await db.collection(col).doc(id).delete();setSyncStatus('Firebase: deleted','success')}
 catch(e){console.error('Firebase delete failed',e);toast('Firebase delete failed: '+(e.message||e),'error')}
}
async function fbSaveSettings(){
 if(!firebaseReady||!db||fbLoading)return;
 try{await db.collection('settings').doc('main').set({admin:S.admin,updatedAt:new Date().toISOString()},{merge:true})}catch(e){console.error('settings save failed',e)}
}
async function loadCollection(col){
 const snap=await db.collection(col).get();return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function loadFromFirebase(){
 if(!db)return;fbLoading=true;setSyncStatus('Firebase: loading...');
 try{
   const settings=await db.collection('settings').doc('main').get();
   if(settings.exists&&settings.data().admin)S.admin=settings.data().admin;
   const [employees,complaints,finance,invoices,targets,attendance]=await Promise.all([
    loadCollection('employees'),loadCollection('complaints'),loadCollection('finance'),loadCollection('invoices'),loadCollection('targets'),loadCollection('attendance')
   ]);
   if(employees.length)S.employees=employees;
   S.complaints=complaints;S.finance=finance;S.invoices=invoices;S.targets=targets;S.attendance=attendance;
   save();setSyncStatus('Firebase: loaded','success');
   // first run: push default employees so Firebase shows data
   if(!employees.length){for(const e of S.employees)await fbSet('employees',e)}
 }catch(e){console.error('Firebase load failed',e);setSyncStatus('Firebase load failed','error');toast('Firebase load failed: '+(e.message||e),'error')}
 fbLoading=false;
}
function startRealtimeSync(){
 if(!db)return;unsubscribers.forEach(u=>u&&u());unsubscribers=[];
 const bind=(col,key)=>db.collection(col).onSnapshot(snap=>{
   if(fbLoading)return;S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));save();
   if(U){ if(U.role==='employee'){const latest=S.employees.find(e=>e.id===U.id);if(latest){U={role:'employee',...latest};S.session=U;save()}} navRender();tab(TAB); }
 },err=>{console.error(col+' realtime failed',err);setSyncStatus('Realtime failed','error')});
 unsubscribers.push(bind('employees','employees'),bind('complaints','complaints'),bind('finance','finance'),bind('invoices','invoices'),bind('targets','targets'),bind('attendance','attendance'));
 unsubscribers.push(db.collection('settings').doc('main').onSnapshot(s=>{if(s.exists&&s.data().admin){S.admin=s.data().admin;save()}},err=>console.error('settings realtime failed',err)));
}
async function syncAllToFirebase(){
 if(!firebaseReady){await initFirebase(); if(!firebaseReady)return}
 setSyncStatus('Firebase: syncing...');
 await fbSaveSettings();
 for(const e of S.employees)await fbSet('employees',e);
 for(const e of S.complaints)await fbSet('complaints',e);
 for(const e of S.finance)await fbSet('finance',e);
 for(const e of S.invoices)await fbSet('invoices',e);
 for(const e of S.targets)await fbSet('targets',e);
 for(const e of S.attendance)await fbSet('attendance',e);
 setSyncStatus('Firebase: all synced','success');toast('All data synced to Firebase','success');
}

function def(){return{admin:{u:'admin',p:'admin123'},employees:[{id:'e1',name:'Ali',phone:'ali',pin:'1234',role:'Collection',active:true,per:{complaints:1,attendance:1,invoice:1,finance:1,targets:1}},{id:'e2',name:'Usman',phone:'usman',pin:'1234',role:'Technician',active:true,per:{complaints:1,attendance:1,invoice:1,finance:0,targets:1}}],complaints:[],finance:[],invoices:[],targets:[],attendance:[],session:null}}
function load(){S=JSON.parse(localStorage.getItem(KEY)||'null')||def();save()}function save(){localStorage.setItem(KEY,JSON.stringify(S))}function id(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function today(){return new Date().toISOString().slice(0,10)}function now(){return new Date().toLocaleString()}function money(n){return'Rs. '+(Number(n)||0).toLocaleString()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function key(){return U.role==='admin'?'admin':U.id}function can(x){return U.role==='admin'||U.per?.[x]}function toast(m,t='info'){let d=document.createElement('div');d.className='toast '+t;d.textContent=m;tw.appendChild(d);setTimeout(()=>d.remove(),3200)}function beep(){try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.04;o.start();setTimeout(()=>{o.stop();c.close()},150)}catch(e){}}
function clock(){dt.textContent=new Date().toLocaleString()}setInterval(clock,1000);
function login(){let u=lu.value.trim(),p=lp.value.trim();if(!u||!p)return toast('Enter username and password','error');if(u.toLowerCase()===S.admin.u&&p===S.admin.p){U={role:'admin',id:'admin',name:'Administrator'};S.session=U;save();return openApp()}let e=S.employees.find(x=>x.active&&(x.phone.toLowerCase()===u.toLowerCase()||x.name.toLowerCase()===u.toLowerCase())&&x.pin===p);if(e){U={role:'employee',...e};S.session=U;save();return openApp()}toast('Invalid login','error')}
function openApp(){login.classList?.add('hidden');document.getElementById('login').classList.add('hidden');app.style.display='block';pn.textContent=U.name;pr.textContent=U.role==='admin'?'Admin':U.role;av.textContent=U.name[0].toUpperCase();clock();navRender();tab('dashboard');notify()}function logout(){S.session=null;save();location.reload()}function toggleMenu(){pm.classList.toggle('active')}function openPwd(){pwdModal.classList.add('active');pm.classList.remove('active')}function closePwd(){pwdModal.classList.remove('active')}function savePwd(){let v=newPwd.value.trim();if(v.length<3)return toast('Minimum 3 characters','error');if(U.role==='admin'){S.admin.p=v;fbSaveSettings()}else{let e=S.employees.find(x=>x.id===U.id);if(e){e.pin=v;fbSet('employees',e)}U.pin=v;S.session=U}save();newPwd.value='';closePwd();toast('Password changed','success')}
function items(){let a=[['dashboard','Dashboard','📊'],['complaints','Complaints','🛠️'],['employees','Employees','👥'],['attendance','Attendance','🗓️'],['invoice','Invoice','🧾'],['finance','Finance','💰'],['targets','Targets','🎯'],['backup','Backup','💾']];return U.role==='admin'?a:a.filter(x=>x[0]==='dashboard'||can(x[0]))}function navRender(){nav.innerHTML=items().map(x=>`<button id="n-${x[0]}" onclick="tab('${x[0]}')">${x[2]} ${x[1]}</button>`).join('')}function tab(x){if(!items().some(i=>i[0]===x))x='dashboard';TAB=x;document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));let n=document.getElementById('n-'+x);if(n)n.classList.add('active');({dashboard:dash,complaints:complaints,employees:employees,attendance:attendance,invoice:invoice,finance:finance,targets:targets,backup:backup}[x])()}
function empOpts(sel=''){return S.employees.filter(e=>e.active).map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${esc(e.name)} - ${esc(e.role)}</option>`).join('')}function empName(i){return S.employees.find(e=>e.id===i)?.name||'N/A'}function myFin(){return U.role==='admin'?S.finance:S.finance.filter(e=>e.by===U.id)}function myInv(){return U.role==='admin'?S.invoices:S.invoices.filter(e=>e.by===U.id)}function myComp(){return U.role==='admin'?S.complaints:S.complaints.filter(c=>c.assigned===U.id||c.by===U.id)}function calc(arr=myFin()){let cash=0,online=0,exp=0,inc=0;arr.forEach(e=>{if(e.type==='expense')exp+=+e.amount||0;else{inc+=+e.amount||0;if(e.mode==='online')online+=+e.amount||0;else cash+=+e.amount||0}});return{cash,online,exp,inc,bal:inc-exp}}
function stats(){let f=calc(),pend=myComp().filter(c=>c.status!=='Resolved').length,ts=(U.role==='admin'?S.targets:S.targets.filter(t=>t.emp===U.id)),tar=ts.reduce((s,t)=>s+(+t.target||0),0),ach=ts.reduce((s,t)=>s+(+t.achieved||0),0);return`<div class="grid"><div class="stat"><span>Cash Payment</span><b>${money(f.cash)}</b></div><div class="stat"><span>Online Payment</span><b>${money(f.online)}</b></div><div class="stat"><span>Pending Tasks</span><b>${pend}</b></div><div class="stat"><span>Target Progress</span><b>${tar?Math.min(100,Math.round(ach/tar*100)):0}%</b></div></div>`}
function dash(){content.innerHTML=stats()+`<div class="card"><div class="head"><h2>Welcome, ${esc(U.name)}</h2></div><p style="color:#64748b;font-weight:700;line-height:1.6">${U.role==='admin'?'Admin can view all entries and manage employees.':'Employee can only see own entries.'}</p></div>`}
function complaints(){content.innerHTML=stats()+`<div class="card"><div class="head"><h2>Add Complaint / Task</h2></div><div class="row"><div class="fg"><label>Customer</label><input id="cName"></div><div class="fg"><label>Phone</label><input id="cPhone"></div><div class="fg"><label>Type</label><select id="cType"><option>Internet Down</option><option>Slow Speed</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Other</option></select></div></div><div class="row two"><div class="fg"><label>Assign To</label><select id="cAssign">${empOpts(U.role==='employee'?U.id:'')}</select></div><div class="fg"><label>Details</label><input id="cDet"></div></div><button class="btn btn-p" onclick="addComp()">Add Complaint</button></div><div class="card"><div class="head"><h2>Complaint List</h2></div>${compTable()}</div>`}
function addComp(){let assigned=U.role==='employee'?U.id:cAssign.value;if(!cName.value.trim()||!cPhone.value.trim())return toast('Customer and phone required','error');let rec={id:id('c'),name:cName.value.trim(),phone:cPhone.value.trim(),type:cType.value,assigned,det:cDet.value.trim(),status:'Pending',date:today(),time:now(),by:key()};S.complaints.push(rec);save();fbSet('complaints',rec);toast('Complaint added','success');beep();complaints()}function compTable(){let r=myComp().slice().reverse();if(!r.length)return'<div class="empty">No complaints</div>';return`<div class="tbl"><table><thead><tr><th>ID</th><th>Customer</th><th>Type</th><th>Assigned</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>${r.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.name)}</b><br>${esc(c.phone)}<br><small>${esc(c.det)}</small></td><td>${esc(c.type)}</td><td>${esc(empName(c.assigned))}</td><td><span class="badge ${c.status==='Resolved'?'done':'pending'}">${c.status}</span></td><td>${c.date}</td><td>${c.status!=='Resolved'?`<button class="btn btn-s btn-sm" onclick="resComp('${c.id}')">Resolve</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}function resComp(i){let c=S.complaints.find(x=>x.id===i);if(c){c.status='Resolved';fbSet('complaints',c)}save();complaints()}
function employees(){if(U.role!=='admin')return dash();content.innerHTML=`<div class="card"><div class="head"><h2>Add Employee</h2></div><div class="row"><div class="fg"><label>Name</label><input id="eName"></div><div class="fg"><label>Phone/Login</label><input id="ePhone"></div><div class="fg"><label>PIN</label><input id="ePin" value="1234"></div></div><div class="row two"><div class="fg"><label>Role</label><input id="eRole" placeholder="Collection"></div><div class="fg"><label>Permissions</label><div class="actions">${['complaints','attendance','invoice','finance','targets'].map(p=>`<label><input type="checkbox" class="perm" value="${p}" checked> ${p}</label>`).join('')}</div></div></div><button class="btn btn-p" onclick="addEmp()">Add Employee</button></div><div class="card"><div class="head"><h2>Employees</h2></div>${empTable()}</div>`}function addEmp(){let per={};document.querySelectorAll('.perm').forEach(x=>per[x.value]=x.checked);if(!eName.value.trim()||!ePhone.value.trim())return toast('Name and phone required','error');let rec={id:id('e'),name:eName.value.trim(),phone:ePhone.value.trim(),pin:ePin.value.trim()||'1234',role:eRole.value.trim()||'Employee',active:true,per};S.employees.push(rec);save();fbSet('employees',rec);employees()}function empTable(){return`<div class="tbl"><table><thead><tr><th>Name</th><th>Login</th><th>Role</th><th>PIN</th><th>Status</th><th>Action</th></tr></thead><tbody>${S.employees.map(e=>`<tr><td>${esc(e.name)}</td><td>${esc(e.phone)}</td><td>${esc(e.role)}</td><td>${esc(e.pin)}</td><td>${e.active?'Active':'Inactive'}</td><td><button class="btn btn-w btn-sm" onclick="togEmp('${e.id}')">${e.active?'Disable':'Enable'}</button></td></tr>`).join('')}</tbody></table></div>`}function togEmp(i){let e=S.employees.find(x=>x.id===i);if(e){e.active=!e.active;fbSet('employees',e)}save();employees()}
function attendance(){content.innerHTML=`<div class="card"><div class="head"><h2>Mark Attendance</h2></div><div class="row"><div class="fg"><label>Employee</label><select id="aEmp">${empOpts(U.role==='employee'?U.id:'')}</select></div><div class="fg"><label>Status</label><select id="aStatus"><option>Present</option><option>Absent</option><option>Leave</option><option>Half Day</option></select></div><div class="fg"><label>Date</label><input id="aDate" type="date" value="${today()}"></div></div><button class="btn btn-p" onclick="markAtt()">Save Attendance</button></div><div class="card"><div class="head"><h2>Attendance List</h2></div>${attTable()}</div>`}function markAtt(){let emp=U.role==='employee'?U.id:aEmp.value,old=S.attendance.find(a=>a.emp===emp&&a.date===aDate.value);if(old)old.status=aStatus.value;else {old={id:id('a'),emp,date:aDate.value,status:aStatus.value,by:key(),time:now()};S.attendance.push(old)};fbSet('attendance',old);save();attendance()}function attTable(){let r=U.role==='admin'?S.attendance:S.attendance.filter(a=>a.emp===U.id);if(!r.length)return'<div class="empty">No attendance</div>';return`<div class="tbl"><table><thead><tr><th>Date</th><th>Employee</th><th>Status</th><th>Time</th></tr></thead><tbody>${r.slice().reverse().map(a=>`<tr><td>${a.date}</td><td>${empName(a.emp)}</td><td>${a.status}</td><td>${a.time}</td></tr>`).join('')}</tbody></table></div>`}
function invoice(){content.innerHTML=`<div class="card"><div class="head"><h2>Create Invoice</h2><button class="btn btn-l btn-sm" onclick="draft=[];invoice()">Clear</button></div><div class="row"><div class="fg"><label>Customer</label><input id="invCust"></div><div class="fg"><label>WhatsApp</label><input id="invPhone" placeholder="923xx"></div><div class="fg"><label>Work Type</label><select id="invWork"><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Repair</option><option>Other Work</option></select></div></div><div class="item-line"><div class="fg"><label>Product / Service</label><input id="itName"></div><div class="fg"><label>Qty</label><input id="itQty" type="number" value="1"></div><div class="fg"><label>Rate</label><input id="itRate" type="number" value="0"></div><button class="btn btn-i" onclick="addItem()">Add</button></div><div id="itemsArea"></div><div class="row two"><div class="fg"><label>Discount</label><input id="disc" type="number" value="0" oninput="drawItems()"></div><div class="fg"><label>Notes</label><input id="invNotes"></div></div><div class="actions"><button class="btn btn-p" onclick="saveInv()">Save Invoice</button><button class="btn btn-s" onclick="sendDraftInv()">Send WhatsApp</button></div></div><div class="card"><div class="head"><h2>Invoice History</h2></div>${invTable()}</div>`;drawItems()}function addItem(){if(!itName.value.trim())return toast('Item name required','error');draft.push({name:itName.value.trim(),qty:+itQty.value||1,rate:+itRate.value||0});itName.value='';itQty.value=1;itRate.value=0;drawItems()}function remItem(i){draft.splice(i,1);drawItems()}function totals(){let sub=draft.reduce((s,x)=>s+x.qty*x.rate,0),d=+document.getElementById('disc')?.value||0;return{sub,disc:d,total:Math.max(0,sub-d)}}function drawItems(){let a=document.getElementById('itemsArea');if(!a)return;let t=totals();a.innerHTML=draft.length?`<div class="tbl"><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr></thead><tbody>${draft.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.qty*x.rate)}</td><td><button class="btn btn-e btn-sm" onclick="remItem(${i})">X</button></td></tr>`).join('')}</tbody></table></div><div class="summary"><div class="sum">Subtotal<b>${money(t.sub)}</b></div><div class="sum">Discount<b>${money(t.disc)}</b></div><div class="sum">Total<b>${money(t.total)}</b></div></div>`:'<div class="empty">No items added</div>'}function invObj(){let t=totals();return{id:id('inv'),cust:invCust.value.trim(),phone:invPhone.value.trim(),work:invWork.value,items:[...draft],sub:t.sub,disc:t.disc,total:t.total,notes:invNotes.value.trim(),date:today(),time:now(),by:key(),byName:U.name}}function invMsg(v){return`*Fire.net.pk Invoice*\nID: ${v.id}\nCustomer: ${v.cust}\nWork: ${v.work}\nDate: ${v.date}\n\n*Items*\n${v.items.map((x,i)=>`${i+1}. ${x.name} | Qty ${x.qty} | Rate ${money(x.rate)} | Total ${money(x.qty*x.rate)}`).join('\n')}\n\nSubtotal: ${money(v.sub)}\nDiscount: ${money(v.disc)}\n*Final Total: ${money(v.total)}*\nNotes: ${v.notes||'-'}\nBy: ${v.byName}`}function saveInv(){if(!draft.length)return toast('Add item','error');let v=invObj();if(!v.cust)return toast('Customer required','error');S.invoices.push(v);save();fbSet('invoices',v);draft=[];toast('Invoice saved','success');invoice()}function sendDraftInv(){if(!draft.length)return toast('Add item','error');let v=invObj();if(!v.phone)return toast('WhatsApp number required','error');window.open('https://wa.me/'+v.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(invMsg(v)),'_blank')}function invTable(){let r=myInv().slice().reverse();if(!r.length)return'<div class="empty">No invoices</div>';return`<div class="tbl"><table><thead><tr><th>Date</th><th>Customer</th><th>Work</th><th>Total</th><th>By</th><th>Action</th></tr></thead><tbody>${r.map(v=>`<tr><td>${v.date}</td><td>${esc(v.cust)}<br>${esc(v.phone)}</td><td>${esc(v.work)}</td><td>${money(v.total)}</td><td>${esc(v.byName)}</td><td><button class="btn btn-s btn-sm" onclick="sendSavedInv('${v.id}')">WhatsApp</button></td></tr>`).join('')}</tbody></table></div>`}function sendSavedInv(i){let v=S.invoices.find(x=>x.id===i);if(v)window.open('https://wa.me/'+v.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(invMsg(v)),'_blank')}
function finance(){let f=calc();content.innerHTML=`<div class="summary"><div class="sum">Cash<b>${money(f.cash)}</b></div><div class="sum">Online<b>${money(f.online)}</b></div><div class="sum">Income<b>${money(f.inc)}</b></div><div class="sum">Balance<b>${money(f.bal)}</b></div></div><div class="card"><div class="head"><h2>Add Account Entry</h2></div><div class="row"><div class="fg"><label>Type</label><select id="ft"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="fg"><label>Mode</label><select id="fm" onchange="onBox()"><option value="cash">Cash</option><option value="online">Online</option></select></div><div class="fg"><label>Category</label><select id="fc"><option>Monthly Fee</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Office Expense</option><option>Other</option></select></div></div><div class="row"><div class="fg"><label>Amount</label><input id="fa" type="number" value="0"></div><div class="fg"><label>Receiver Name</label><input id="fr" placeholder="Receiver"></div><div class="fg" id="ob"><label>Online Account</label><input id="fo" placeholder="JazzCash / Bank"></div></div><div class="row two"><div class="fg"><label>Client WhatsApp</label><input id="fp" placeholder="923xx"></div><div class="fg"><label>Notes</label><input id="fn"></div></div><button class="btn btn-p" onclick="addFin()">Save Entry</button></div><div class="card"><div class="head"><h2>Daily Account List</h2><button class="btn btn-s btn-sm" onclick="dailyReport()">WhatsApp Daily Report</button></div>${finTable()}</div>`;onBox()}function onBox(){let b=document.getElementById('ob');if(b)b.style.display=fm.value==='online'?'block':'none'}function addFin(){let amount=+fa.value||0;if(amount<=0)return toast('Amount required','error');let e={id:id('fin'),type:ft.value,mode:fm.value,cat:fc.value,amount,receiver:fr.value.trim()||U.name,online:fm.value==='online'?fo.value.trim():'',phone:fp.value.trim(),notes:fn.value.trim(),date:today(),time:now(),by:key(),byName:U.name};S.finance.push(e);applyTarget(e);save();fbSet('finance',e);toast('Entry saved','success');beep();finance()}function finTable(){let r=myFin().filter(e=>e.date===today()).slice().reverse();if(!r.length)return'<div class="empty">No entries today</div>';let sec=(title,arr)=>`<h3 style="margin:12px 0">${title}</h3>${arr.length?`<div class="tbl"><table><thead><tr><th>Time</th><th>Tag</th><th>Category</th><th>Receiver</th><th>Account</th><th>Amount</th><th>Action</th></tr></thead><tbody>${arr.map(e=>`<tr><td>${e.time}</td><td><span class="badge ${e.mode==='online'?'online':'cash'}">${e.mode}</span></td><td>${e.cat}</td><td>${esc(e.receiver)}</td><td>${esc(e.online||'-')}</td><td>${money(e.amount)}</td><td><button class="btn btn-s btn-sm" onclick="sendSlip('${e.id}')">Slip</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">None</div>'}`;return sec('Online Payments',r.filter(e=>e.mode==='online'))+sec('Cash / Other Payments',r.filter(e=>e.mode!=='online'))}function slipMsg(e){return`*Fire.net.pk Payment Slip*\nDate: ${e.time}\nType: ${e.type}\nMode: ${e.mode.toUpperCase()}\nCategory: ${e.cat}\nAmount: ${money(e.amount)}\nReceiver: ${e.receiver}\n${e.online?'Account: '+e.online+'\n':''}Notes: ${e.notes||'-'}\nBy: ${e.byName}`}function sendSlip(i){let e=S.finance.find(x=>x.id===i);if(!e?.phone)return toast('Client WhatsApp not saved','error');window.open('https://wa.me/'+e.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(slipMsg(e)),'_blank')}function dailyReport(){let r=myFin().filter(e=>e.date===today()),f=calc(r),msg=`*Fire.net.pk Daily Report*\nDate: ${today()}\nCash: ${money(f.cash)}\nOnline: ${money(f.online)}\nIncome: ${money(f.inc)}\nExpense: ${money(f.exp)}\nBalance: ${money(f.bal)}\n\nEntries:\n${r.map((e,i)=>`${i+1}. ${e.mode.toUpperCase()} | ${e.cat} | ${money(e.amount)} | Receiver: ${e.receiver}${e.online?' | Account: '+e.online:''}`).join('\n')}`;let p=prompt('Owner WhatsApp number');if(p)window.open('https://wa.me/'+p.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}
function targets(){content.innerHTML=`${U.role==='admin'?`<div class="card"><div class="head"><h2>Assign Target</h2></div><div class="row"><div class="fg"><label>Employee</label><select id="te">${empOpts()}</select></div><div class="fg"><label>Target Amount</label><input id="ta" type="number" value="20000"></div><div class="fg"><label>Reward</label><input id="tr" value="1 Reward"></div></div><button class="btn btn-p" onclick="assignTarget()">Assign Target</button></div>`:''}<div class="card"><div class="head"><h2>Target Progress</h2></div>${targetTable()}</div>`}function assignTarget(){let target=+ta.value||0;if(target<=0)return toast('Target required','error');let rec={id:id('t'),emp:te.value,target,achieved:0,reward:tr.value.trim()||'Reward',date:today()};S.targets.push(rec);save();fbSet('targets',rec);targets()}function applyTarget(e){if(e.type!=='income')return;let t=S.targets.find(x=>x.emp===e.by&&(+x.achieved)<(+x.target));if(t){t.achieved=(+t.achieved)+(+e.amount);fbSet('targets',t);if(t.achieved>=t.target){toast('Target completed! Reward unlocked','success');beep()}}}function targetTable(){let r=U.role==='admin'?S.targets:S.targets.filter(t=>t.emp===U.id);if(!r.length)return'<div class="empty">No targets</div>';return`<div class="tbl"><table><thead><tr><th>Employee</th><th>Target</th><th>Achieved</th><th>Progress</th><th>Reward</th></tr></thead><tbody>${r.map(t=>{let p=Math.min(100,Math.round((+t.achieved||0)/(+t.target||1)*100));return`<tr><td>${empName(t.emp)}</td><td>${money(t.target)}</td><td>${money(t.achieved)}</td><td><div class="prog"><div class="bar" style="width:${p}%"></div></div><b>${p}%</b></td><td>${p>=100?'✅ ':''}${esc(t.reward)}</td></tr>`}).join('')}</tbody></table></div>`}
function backup(){content.innerHTML=`<div class="card"><div class="head"><h2>Backup & Restore</h2></div><div class="actions"><button class="btn btn-s" onclick="syncAllToFirebase()">Sync All to Firebase</button><button class="btn btn-i" onclick="loadFromFirebase().then(()=>{toast('Loaded from Firebase','success');tab(TAB)})">Load from Firebase</button><button class="btn btn-s" onclick="downloadBackup()">Download Backup</button><button class="btn btn-i" onclick="restoreFile.click()">Restore Backup</button><button class="btn btn-e" onclick="clearAll()">Clear All</button></div><input class="hidden" type="file" id="restoreFile" accept=".json" onchange="restoreBackup(event)"></div>`}function downloadBackup(){let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='firenet-backup-'+today()+'.json';a.click()}function restoreBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('Restored','success');setTimeout(()=>location.reload(),700)}catch(x){toast('Invalid backup','error')}};r.readAsText(f)}function clearAll(){if(confirm('Clear all data?')){localStorage.removeItem(KEY);location.reload()}}
function notify(){let p=myComp().filter(c=>c.status!=='Resolved').length;if(U.role==='employee'&&p){toast(`You have ${p} pending task(s)`,'warning');beep()}}
load();window.addEventListener('load',async()=>{await initFirebase();if(S.session){U=S.session;openApp()}});
</script></body></html>
