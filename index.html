<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js">
/* ================= COMPLAINT TIME / ETA PATCH ================= */
function pad2(n){return String(n).padStart(2,'0')}
function toDateTimeLocalValue(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function defaultResolveAt(){let d=new Date();d.setHours(d.getHours()+2);return toDateTimeLocalValue(d)}
function formatDT(v){
  if(!v)return '-';
  try{
    const d=new Date(v);
    if(!isNaN(d.getTime()))return d.toLocaleString();
  }catch(e){}
  return String(v).replace('T',' ');
}
function etaStatus(c){
  if(c.status==='Resolved')return '<span class="badge done">Resolved</span>';
  if(!c.resolveBy&&!c.eta)return '<span class="badge pending">No ETA</span>';
  const due=new Date(c.resolveBy||c.eta).getTime();
  if(!isNaN(due)&&Date.now()>due)return '<span class="badge expense">Overdue</span>';
  return '<span class="badge online">On Time</span>';
}
function complaints(){
  const dateTitle=(typeof complaintShowAll!=='undefined'&&complaintShowAll)?'(All Dates)':`(${typeof complaintDateFilter!=='undefined'?complaintDateFilter:today()})`;
  const dateControls=(typeof complaintDateFilter!=='undefined')?`<div class="actions"><input type="date" class="form-control" style="max-width:170px" value="${complaintDateFilter}" onchange="setComplaintDateFilter(this.value)"><button class="btn btn-l btn-sm" onclick="showTodayComplaintsFilter()">Today</button><button class="btn btn-i btn-sm" onclick="showAllComplaintsFilter()">Show All</button></div>`:'';
  content.innerHTML=stats()+`<div class="card"><div class="head"><h2>Add Complaint / Task</h2></div>
  <div class="row"><div class="fg"><label>Customer</label><input id="cName"></div><div class="fg"><label>Phone</label><input id="cPhone"></div><div class="fg"><label>Type</label><select id="cType"><option>Internet Down</option><option>Slow Speed</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Other</option></select></div></div>
  <div class="row"><div class="fg"><label>Assign To</label><select id="cAssign">${empOpts(U.role==='employee'?U.id:'')}</select></div><div class="fg"><label>Expected Resolve Time</label><input id="cEta" type="datetime-local" value="${defaultResolveAt()}"></div><div class="fg"><label>Details</label><input id="cDet" placeholder="Issue details"></div></div>
  <button class="btn btn-p" onclick="addComp()">Add Complaint</button></div>
  <div class="card"><div class="head"><h2>Complaint List ${dateTitle}</h2>${dateControls}</div>${compTable()}</div>`;
}
function addComp(){
  let assigned=U.role==='employee'?U.id:cAssign.value;
  if(!cName.value.trim()||!cPhone.value.trim())return toast('Customer and phone required','error');
  let rec={id:id('c'),name:cName.value.trim(),phone:cPhone.value.trim(),type:cType.value,assigned,det:cDet.value.trim(),status:'Pending',date:today(),time:now(),createdAt:now(),resolveBy:cEta.value||'',eta:cEta.value||'',resolvedAt:'',by:key()};
  S.complaints.push(rec);save();if(typeof fbSet==='function')fbSet('complaints',rec);toast('Complaint added with expected resolve time','success');beep();complaints();
}
function compTable(){
  let r=myComp().slice().reverse();
  if(typeof complaintShowAll!=='undefined' && !complaintShowAll) r=r.filter(c=>(c.date||'')===complaintDateFilter);
  if(!r.length)return`<div class="empty">No complaints ${typeof complaintShowAll!=='undefined'&&!complaintShowAll?'on '+complaintDateFilter:''}</div>`;
  return`<div class="tbl"><table><thead><tr><th>ID</th><th>Customer</th><th>Type</th><th>Assigned</th><th>Status</th><th>Created Time</th><th>Expected Resolve</th><th>Resolved Time</th><th>Action</th></tr></thead><tbody>${r.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.name)}</b><br>${esc(c.phone)}<br><small>${esc(c.det)}</small></td><td>${esc(c.type)}</td><td>${esc(empName(c.assigned))}</td><td><span class="badge ${c.status==='Resolved'?'done':'pending'}">${c.status}</span><br>${etaStatus(c)}</td><td>${esc(c.time||c.createdAt||c.date||'-')}</td><td><b>${esc(formatDT(c.resolveBy||c.eta))}</b></td><td>${esc(c.resolvedAt||'-')}</td><td>${adminButtons('complaint',c.id,`<button class="btn btn-s btn-sm" onclick="sendComplaintWA('${c.id}')">WhatsApp</button>${c.status!=='Resolved'?` <button class="btn btn-s btn-sm" onclick="resComp('${c.id}')">Resolve</button>`:''}`)}</td></tr>`).join('')}</tbody></table></div>`;
}
function complaintMsg(c){return`*Fire.net.pk Complaint Update*
Complaint ID: ${c.id}
Customer: ${c.name}
Phone: ${c.phone}
Type: ${c.type}
Status: ${c.status}
Assigned To: ${empName(c.assigned)}
Date: ${c.date}
Created Time: ${c.time||c.createdAt||'-'}
Expected Resolve Time: ${formatDT(c.resolveBy||c.eta)}
Resolved Time: ${c.resolvedAt||'-'}

Details: ${c.det||'-'}

Thank you,
Fire.net.pk Support`}
function sendComplaintWA(i){let c=S.complaints.find(x=>x.id===i);if(!c)return toast('Complaint not found','error');if(!c.phone)return toast('Customer phone not available','error');window.open('https://wa.me/'+String(c.phone).replace(/\D/g,'')+'?text='+encodeURIComponent(complaintMsg(c)),'_blank')}
function resComp(i){let c=S.complaints.find(x=>x.id===i);if(c){c.status='Resolved';c.resolvedAt=now();if(typeof fbSet==='function')fbSet('complaints',c)}save();toast('Complaint resolved with resolved time','success');complaints()}
/* ================= END COMPLAINT TIME / ETA PATCH ================= */

</script>

<script>
const KEY='firenet_single_html_final_v2';let S,U,TAB='dashboard',draft=[];
let db=null, firebaseReady=false, fbLoading=false, unsubscribers=[];
const firebaseConfig={apiKey:'AIzaSyDEOfh1JufNuoEIMEZ_tgt1Lg4PSLLUE7E',authDomain:'complaint-b1f3c.firebaseapp.com',projectId:'complaint-b1f3c',storageBucket:'complaint-b1f3c.firebasestorage.app',messagingSenderId:'400630080362',appId:'1:400630080362:web:bbe16973f247dd67407b13',measurementId:'G-ENJVNBEVXT'};
function setSyncStatus(txt,type='info'){let el=document.getElementById('syncStatus');if(el){el.textContent=txt;el.style.color=type==='error'?'#dc2626':type==='success'?'#166534':'#475569'}}
async function initFirebase(){
 try{
   if(!window.firebase){setSyncStatus('Firebase: SDK missing','error');return false}
   if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
   db=firebase.firestore();
   firebaseReady=true;setSyncStatus('Firebase: connected','success');
   await loadFromFirebase();
   startRealtimeSync();
   return true;
 }catch(e){console.error('Firebase init error:',e);firebaseReady=false;setSyncStatus('Firebase: '+(e.message||'failed'),'error');toast('Firebase error: '+(e.message||e),'error');return false}
}
function cleanForFirebase(obj){return JSON.parse(JSON.stringify(obj||{}))}
async function fbSet(col,obj){
 if(!firebaseReady||!db||fbLoading||!obj||!obj.id)return;
 try{await db.collection(col).doc(obj.id).set(cleanForFirebase(obj),{merge:true});setSyncStatus('Firebase: synced','success')}
 catch(e){console.error('Firebase write failed',col,obj,e);setSyncStatus('Firebase write failed','error');toast('Firebase write failed: '+(e.message||e),'error')}
}
async function fbDelete(col,id){
 if(!firebaseReady||!db||!id)return;
 try{await db.collection(col).doc(id).delete();setSyncStatus('Firebase: deleted','success')}
 catch(e){console.error('Firebase delete failed',e);toast('Firebase delete failed: '+(e.message||e),'error')}
}
async function fbSaveSettings(){
 if(!firebaseReady||!db||fbLoading)return;
 try{await db.collection('settings').doc('main').set({admin:S.admin,updatedAt:new Date().toISOString()},{merge:true})}catch(e){console.error('settings save failed',e)}
}
async function loadCollection(col){
 const snap=await db.collection(col).get();return snap.docs.map(d=>({id:d.id,...d.data()}));
}
async function loadFromFirebase(){
 if(!db)return;fbLoading=true;setSyncStatus('Firebase: loading...');
 try{
   const settings=await db.collection('settings').doc('main').get();
   if(settings.exists&&settings.data().admin)S.admin=settings.data().admin;
   const [employees,complaints,finance,invoices,targets,attendance]=await Promise.all([
    loadCollection('employees'),loadCollection('complaints'),loadCollection('finance'),loadCollection('invoices'),loadCollection('targets'),loadCollection('attendance')
   ]);
   if(employees.length)S.employees=employees;
   dedupeEmployees();
   S.complaints=complaints;S.finance=finance;S.invoices=invoices;S.targets=targets;S.attendance=attendance;
   save();setSyncStatus('Firebase: loaded','success');

function slipMsg(e){return`*Fire.net.pk Payment Slip*\nDate: ${e.time}\nType: ${String(e.type||'income').toUpperCase()}\nMode: ${String(e.mode||'cash').toUpperCase()}\nCustomer / Paid By: ${e.customer||'-'}\nCategory: ${e.cat}\nAmount: ${money(e.amount)}\nReceiver: ${e.receiver}\n${e.online?'Account: '+e.online+'\n':''}Notes: ${e.notes||'-'}\nBy: ${e.byName}`}
function sendSlip(i){let e=S.finance.find(x=>x.id===i);if(!e?.phone)return toast('Client WhatsApp not saved','error');window.open('https://wa.me/'+e.phone.replace(/\D/g,'')+'?text='+encodeURIComponent(slipMsg(e)),'_blank')}
function dailyReport(){let r=myFin().filter(e=>e.date===today()),f=calc(r),msg=`*Fire.net.pk Daily Report*\nDate: ${today()}\nCash: ${money(f.cash)}\nOnline: ${money(f.online)}\nIncome: ${money(f.inc)}\nExpense: ${money(f.exp)}\nBalance: ${money(f.bal)}\n\nEntries:\n${r.map((e,i)=>`${i+1}. ${String(e.type||'income').toUpperCase()} | ${String(e.mode||'cash').toUpperCase()} | ${e.cat} | ${money(e.amount)} | Customer: ${e.customer||'-'} | Receiver: ${e.receiver}${e.online?' | Account: '+e.online:''}`).join('\n')}`;let p=prompt('Owner WhatsApp number');if(p)window.open('https://wa.me/'+p.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')}
function targets(){content.innerHTML=`${U.role==='admin'?`<div class="card"><div class="head"><h2>Assign Target</h2></div><div class="row"><div class="fg"><label>Employee</label><select id="te">${empOpts()}</select></div><div class="fg"><label>Target Amount</label><input id="ta" type="number" value="20000"></div><div class="fg"><label>Reward</label><input id="tr" value="1 Reward"></div></div><button class="btn btn-p" onclick="assignTarget()">Assign Target</button></div>`:''}<div class="card"><div class="head"><h2>Target Progress</h2></div>${targetTable()}</div>`}function assignTarget(){let target=+ta.value||0;if(target<=0)return toast('Target required','error');let rec={id:id('t'),emp:te.value,target,achieved:0,reward:tr.value.trim()||'Reward',date:today()};S.targets.push(rec);save();fbSet('targets',rec);targets()}function applyTarget(e){if(e.type!=='income')return;let t=S.targets.find(x=>x.emp===e.by&&(+x.achieved)<(+x.target));if(t){t.achieved=(+t.achieved)+(+e.amount);fbSet('targets',t);if(t.achieved>=t.target){toast('Target completed! Reward unlocked','success');beep()}}}function targetTable(){let r=U.role==='admin'?S.targets:S.targets.filter(t=>t.emp===U.id);if(!r.length)return'<div class="empty">No targets</div>';return`<div class="tbl"><table><thead><tr><th>Employee</th><th>Target</th><th>Achieved</th><th>Progress</th><th>Reward</th></tr></thead><tbody>${r.map(t=>{let p=Math.min(100,Math.round((+t.achieved||0)/(+t.target||1)*100));return`<tr><td>${empName(t.emp)}</td><td>${money(t.target)}</td><td>${money(t.achieved)}</td><td><div class="prog"><div class="bar" style="width:${p}%"></div></div><b>${p}%</b></td><td>${p>=100?'✅ ':''}${esc(t.reward)}</td></tr>`}).join('')}</tbody></table></div>`}


/* ================= ADMIN FULL ACCESS: EDIT / DELETE CONTROLS ================= */
function isAdmin(){return U&&U.role==='admin'}
function adminButtons(type,id,extra=''){
  if(!isAdmin())return extra;
  return `${extra} <button class="btn btn-i btn-sm" onclick="editRecord('${type}','${id}')">Edit</button> <button class="btn btn-e btn-sm" onclick="deleteRecord('${type}','${id}')">Delete</button>`;
}
function collectionMap(type){return {employee:'employees',complaint:'complaints',attendance:'attendance',invoice:'invoices',finance:'finance',target:'targets'}[type]}
function listMap(type){return {employee:S.employees,complaint:S.complaints,attendance:S.attendance,invoice:S.invoices,finance:S.finance,target:S.targets}[type]}
function findRecord(type,id){return (listMap(type)||[]).find(x=>x.id===id)}
function refreshCurrent(){save();tab(TAB)}
function deleteRecord(type,id){
  if(!isAdmin())return toast('Admin access required','error');
  if(!confirm('Delete this record permanently?'))return;
  const list=listMap(type); const idx=list.findIndex(x=>x.id===id);
  if(idx>=0)list.splice(idx,1);
  const col=collectionMap(type); if(col)fbDelete(col,id);
  refreshCurrent(); toast('Deleted','success');
}
function askVal(label,val,required=false){let v=prompt(label,val??'');if(v===null)return null;v=v.trim();if(required&&!v){toast(label+' required','error');return null}return v}
function editRecord(type,id){
  if(!isAdmin())return toast('Admin access required','error');
  const r=findRecord(type,id); if(!r)return toast('Record not found','error');

  if(type==='employee'){
    const name=askVal('Employee name',r.name,true); if(name===null)return;
    const phone=askVal('Login / Phone',r.phone,true); if(phone===null)return;
    const dup=findEmployeeDuplicate(phone,name,r.id);
    if(dup)return toast('Another employee already uses this name/login','error');
    const pin=askVal('PIN',r.pin,true); if(pin===null)return;
    const role=askVal('Role',r.role||'Employee'); if(role===null)return;
    const active=askVal('Active? yes/no',r.active?'yes':'no'); if(active===null)return;
    const perms=askVal('Permissions comma separated: complaints,attendance,invoice,finance,targets',Object.keys(r.per||{}).filter(k=>r.per[k]).join(',')); if(perms===null)return;
    r.name=name; r.phone=phone; r.pin=pin; r.role=role||'Employee'; r.active=!/^no|false|0$/i.test(active);
    const p={};perms.split(',').map(x=>x.trim()).filter(Boolean).forEach(x=>p[x]=1);r.per=p;
    fbSet('employees',r);
  }

  if(type==='complaint'){
    const name=askVal('Customer name',r.name,true); if(name===null)return;
    const phone=askVal('Phone',r.phone,true); if(phone===null)return;
    const ctype=askVal('Complaint type',r.type||'Other'); if(ctype===null)return;
    const assigned=askVal('Assigned employee ID (example e1). Current: '+empName(r.assigned),r.assigned); if(assigned===null)return;
    const det=askVal('Details',r.det||''); if(det===null)return;
    const status=askVal('Status: Pending / In Progress / Resolved',r.status||'Pending'); if(status===null)return;
    const date=askVal('Date YYYY-MM-DD',r.date||today()); if(date===null)return;
    r.name=name; r.phone=phone; r.type=ctype||r.type; r.assigned=assigned||r.assigned; r.det=det; r.status=status||r.status; r.date=date||r.date; r.time=now();
    fbSet('complaints',r);
  }

  if(type==='attendance'){
    const emp=askVal('Employee ID (example e1). Current: '+empName(r.emp),r.emp); if(emp===null)return;
    const status=askVal('Status: Present / Absent / Leave / Half Day',r.status||'Present'); if(status===null)return;
    const date=askVal('Date YYYY-MM-DD',r.date||today()); if(date===null)return;
    r.emp=emp||r.emp; r.status=status||r.status; r.date=date||r.date; r.time=now();
    fbSet('attendance',r);
  }

  if(type==='invoice'){
    const cust=askVal('Customer name',r.cust,true); if(cust===null)return;
    const phone=askVal('WhatsApp number',r.phone||''); if(phone===null)return;
    const work=askVal('Work type',r.work||''); if(work===null)return;
    const items=askVal('Items JSON. Example: [{"name":"Router","qty":1,"rate":3000}]',JSON.stringify(r.items||[])); if(items===null)return;
    let parsed;try{parsed=JSON.parse(items);if(!Array.isArray(parsed))throw new Error('not array')}catch(e){return toast('Invalid items JSON','error')}
    const disc=askVal('Discount',r.disc||0); if(disc===null)return;
    const notes=askVal('Notes',r.notes||''); if(notes===null)return;
    const date=askVal('Date YYYY-MM-DD',r.date||today()); if(date===null)return;
    r.cust=cust; r.phone=phone; r.work=work||r.work; r.items=parsed.map(x=>({name:x.name||'Item',qty:Number(x.qty)||1,rate:Number(x.rate)||0})); r.disc=Number(disc)||0; r.notes=notes; r.date=date||r.date;
    r.sub=(r.items||[]).reduce((a,x)=>a+(Number(x.qty)||0)*(Number(x.rate)||0),0); r.total=Math.max(0,r.sub-r.disc); r.time=now();
    fbSet('invoices',r);
  }

  if(type==='finance'){
    const ftype=askVal('Type: income / expense',r.type||'income'); if(ftype===null)return;
    const mode=askVal('Mode: cash / online',r.mode||'cash'); if(mode===null)return;
    const cat=askVal('Category',r.cat||'Other'); if(cat===null)return;
    const amount=askVal('Amount',r.amount||0,true); if(amount===null)return;
    const receiver=askVal('Receiver name',r.receiver||''); if(receiver===null)return;
    const online=askVal('Online account / bank',r.online||''); if(online===null)return;
    const phone=askVal('Client WhatsApp',r.phone||''); if(phone===null)return;
    const notes=askVal('Notes',r.notes||''); if(notes===null)return;
    const date=askVal('Date YYYY-MM-DD',r.date||today()); if(date===null)return;
    r.type=(ftype.trim().toLowerCase()==='expense')?'expense':'income'; r.mode=(mode.trim().toLowerCase()==='online')?'online':'cash'; r.cat=cat||r.cat; r.amount=Number(amount)||0; r.receiver=receiver||r.receiver; r.online=r.mode==='online'?online:''; r.phone=phone; r.notes=notes; r.date=date||r.date; r.time=now();
    fbSet('finance',r);
  }

  if(type==='target'){
    const emp=askVal('Employee ID (example e1). Current: '+empName(r.emp),r.emp); if(emp===null)return;
    const target=askVal('Target amount',r.target||0,true); if(target===null)return;
    const achieved=askVal('Achieved amount',r.achieved||0); if(achieved===null)return;
    const reward=askVal('Reward',r.reward||'Reward'); if(reward===null)return;
    const date=askVal('Date YYYY-MM-DD',r.date||today()); if(date===null)return;
    r.emp=emp||r.emp; r.target=Number(target)||0; r.achieved=Number(achieved)||0; r.reward=reward||r.reward; r.date=date||r.date;
    fbSet('targets',r);
  }
  refreshCurrent(); toast('Updated','success');
}

function saveEditModalPatch(ev){

function pad2(n){return String(n).padStart(2,'0')}
function toDateTimeLocalValue(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function defaultResolveAt(){let d=new Date();d.setHours(d.getHours()+2);return toDateTimeLocalValue(d)}
function formatDT(v){
  if(!v)return '-';
  try{
    const d=new Date(v);
    if(!isNaN(d.getTime()))return d.toLocaleString();
  }catch(e){}
  return String(v).replace('T',' ');
}
function etaStatus(c){
  if(c.status==='Resolved')return '<span class="badge done">Resolved</span>';
  if(!c.resolveBy&&!c.eta)return '<span class="badge pending">No ETA</span>';
  const due=new Date(c.resolveBy||c.eta).getTime();
  if(!isNaN(due)&&Date.now()>due)return '<span class="badge expense">Overdue</span>';
  return '<span class="badge online">On Time</span>';
}

<script>

function ensureRewardFields(){
  S.targets=(S.targets||[]).map(t=>{
    if(!t.rewardType) t.rewardType='fixed';
    if(t.rewardValue===undefined){
      const m=String(t.reward||'').match(/[0-9]+(\.[0-9]+)?/);
      t.rewardValue=m?Number(m[0]):0;
    }
    if(!t.entries) t.entries=[];
    if(!t.date) t.date=today();
    return t;
  });
  save();
}
function targetRewardEarned(t){
  const achieved=Number(t.achieved)||0, target=Number(t.target)||0, val=Number(t.rewardValue)||0;
  if((t.rewardType||'fixed')==='percent') return Math.round(achieved*val/100);
  return achieved>=target ? val : 0;
}
function targetRewardLabel(t){
  return (t.rewardType||'fixed')==='percent' ? `${Number(t.rewardValue)||0}% of achieved` : money(Number(t.rewardValue)||0);
}

  ensureRewardFields();
  return (S.targets||[])
    .filter(t=>t.emp===empId && (t.date||today())===today())
    .reduce((s,t)=>s+targetRewardEarned(t),0);
}

<script>
/* ===== Finance visual income/expense + summary patch ===== */
function normalizeFinanceType(e){ return (e.type || e.entryType || 'income').toLowerCase()==='expense' ? 'expense' : 'income'; }
function normalizeFinanceMode(e){ return (e.mode || e.paymentMode || 'cash').toLowerCase()==='online' ? 'online' : 'cash'; }
function financeVisualSummary(entries){
  let income=0, expense=0, cashIncome=0, onlineIncome=0, cashExpense=0, onlineExpense=0;
  entries.forEach(e=>{
    const amount=Number(e.amount)||0, type=normalizeFinanceType(e), mode=normalizeFinanceMode(e);
    if(type==='expense'){
      expense+=amount;
      if(mode==='online') onlineExpense+=amount; else cashExpense+=amount;
    }else{
      income+=amount;
      if(mode==='online') onlineIncome+=amount; else cashIncome+=amount;
    }
  });
  return {income, expense, cashIncome, onlineIncome, cashExpense, onlineExpense, balance:income-expense};
}
function typeTag(e){ const t=normalizeFinanceType(e); return `<span class="badge ${t==='expense'?'tag-type-expense':'tag-type-income'}">${t==='expense'?'EXPENSE':'INCOME'}</span>`; }
function modeTag(e){ const m=normalizeFinanceMode(e); return `<span class="badge ${m==='online'?'tag-mode-online':'tag-mode-cash'}">${m==='online'?'ONLINE':'CASH'}</span>`; }
function financeSummaryHtml(s){return `<div class="finance-summary-grid">
  <div class="finance-card income-card"><span>Total Income</span><b class="money-plus">+ ${money(s.income)}</b></div>
  <div class="finance-card expense-card"><span>Total Expense</span><b class="money-minus">- ${money(s.expense)}</b></div>
  <div class="finance-card cash-card"><span>Cash Income</span><b>${money(s.cashIncome)}</b><small>Cash Expense: ${money(s.cashExpense)}</small></div>
  <div class="finance-card online-card"><span>Online Income</span><b>${money(s.onlineIncome)}</b><small>Online Expense: ${money(s.onlineExpense)}</small></div>
  <div class="finance-card balance-card"><span>Net Balance</span><b>${money(s.balance)}</b></div>
</div>`}
function finance(){
  let entries=filteredFinanceEntries(), s=financeVisualSummary(entries);
  content.innerHTML=`${financeSummaryHtml(s)}
  <div class="card"><div class="head"><h2>Add Account Entry</h2></div>
  <div class="row"><div class="fg"><label>Type</label><select id="ft"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="fg"><label>Mode</label><select id="fm" onchange="onBox()"><option value="cash">Cash</option><option value="online">Online</option></select></div><div class="fg"><label>Category</label><select id="fc"><option>Monthly Fee</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Office Expense</option><option>Other</option></select></div></div>
  <div class="row"><div class="fg"><label>Customer Name / Paid By</label><input id="fcu" placeholder="Who paid? Customer name"></div><div class="fg"><label>Amount</label><input id="fa" type="number" value="0"></div><div class="fg"><label>Receiver Name</label><input id="fr" placeholder="Receiver / Collector"></div></div>
  <div class="row"><div class="fg" id="ob"><label>Online Account</label><input id="fo" placeholder="JazzCash / Bank"></div><div class="fg"><label>Client WhatsApp</label><input id="fp" placeholder="923xx"></div><div class="fg"><label>Notes</label><input id="fn"></div></div>
  <button class="btn btn-p" onclick="addFin()">Save Entry</button></div>
  <div class="card"><div class="head"><h2>Account List ${financeShowAll?'(All Firebase/Local Data)':'('+financeDateFilter+')'}</h2><div class="actions"><input type="date" class="form-control" style="max-width:170px" value="${financeDateFilter}" onchange="setFinanceDateFilter(this.value)"><button class="btn btn-l btn-sm" onclick="showTodayFinanceFilter()">Today</button><button class="btn btn-i btn-sm" onclick="showAllFinanceFilter()">Show All</button><button class="btn btn-i btn-sm" onclick="fetchAllFinanceData()">Fetch Firebase</button><button class="btn btn-s btn-sm" onclick="dailyReport()">WhatsApp Report</button></div></div>${finTable()}</div>`;
  onBox();
}
function finTable(){
  let r=filteredFinanceEntries().slice().reverse();
  if(!r.length)return`<div class="empty">No entries ${financeShowAll?'':'on '+financeDateFilter}</div>`;
  const renderSection=(title, cls, arr)=>`<h3 class="finance-section-title ${cls==='income'?'income-title':'expense-title'}">${title} <span class="badge ${cls==='income'?'tag-type-income':'tag-type-expense'}">${arr.length}</span></h3>${arr.length?`<div class="tbl finance-table ${cls==='income'?'income-table':'expense-table'}"><table><thead><tr><th>Time</th><th>Date</th><th>Type</th><th>Payment</th><th>Paid By / Customer</th><th>Category</th><th>Receiver</th><th>Account</th><th>Amount</th><th>Action</th></tr></thead><tbody>${arr.map(e=>`<tr><td>${esc(e.time||'')}</td><td>${esc(e.date||'')}</td><td>${typeTag(e)}</td><td>${modeTag(e)}</td><td><b>${esc(getFinanceCustomer(e)||'-')}</b></td><td>${esc(e.cat||e.category||'')}</td><td>${esc(e.receiver||'')}</td><td>${esc(e.online||e.onlineAccount||'-')}</td><td class="${normalizeFinanceType(e)==='expense'?'money-minus':'money-plus'}">${normalizeFinanceType(e)==='expense'?'- ':'+ '}${money(e.amount)}</td><td>${financeActionButtons(e)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">None</div>'}`;
  return renderSection('Income Entries', 'income', r.filter(e=>normalizeFinanceType(e)!=='expense')) + renderSection('Expense Entries', 'expense', r.filter(e=>normalizeFinanceType(e)==='expense'));
}
function slipMsg(e){return`*Fire.net.pk Payment Slip*\nDate: ${e.time}\nPaid By: ${getFinanceCustomer(e)||'-'}\nType: ${normalizeFinanceType(e).toUpperCase()}\nMode: ${normalizeFinanceMode(e).toUpperCase()}\nCategory: ${e.cat||e.category||'-'}\nAmount: ${normalizeFinanceType(e)==='expense'?'- ':'+ '}${money(e.amount)}\nReceiver: ${e.receiver||'-'}\n${(e.online||e.onlineAccount)?'Account: '+(e.online||e.onlineAccount)+'\n':''}Notes: ${e.notes||'-'}\nBy: ${e.byName||'-'}`}
function dailyReport(){
  let r=financeShowAll?myFin():myFin().filter(e=>(e.date||'')===financeDateFilter), s=financeVisualSummary(r);
  let msg=`*Fire.net.pk Finance Report*\nDate: ${financeShowAll?'All Dates':financeDateFilter}\n\n*Summary*\nTotal Income: ${money(s.income)}\nTotal Expense: ${money(s.expense)}\nCash Income: ${money(s.cashIncome)}\nOnline Income: ${money(s.onlineIncome)}\nCash Expense: ${money(s.cashExpense)}\nOnline Expense: ${money(s.onlineExpense)}\nNet Balance: ${money(s.balance)}\n\n*Entries*\n${r.map((e,i)=>`${i+1}. ${e.date||''} | ${normalizeFinanceType(e).toUpperCase()} | ${normalizeFinanceMode(e).toUpperCase()} | Paid By: ${getFinanceCustomer(e)||'-'} | ${e.cat||e.category||'-'} | ${normalizeFinanceType(e)==='expense'?'- ':'+ '}${money(e.amount)} | Receiver: ${e.receiver||'-'}${(e.online||e.onlineAccount)?' | Account: '+(e.online||e.onlineAccount):''}`).join('\n')}`;
  let p=prompt('Owner WhatsApp number');if(p)window.open('https://wa.me/'+p.replace(/\D/g,'')+'?text='+encodeURIComponent(msg),'_blank')
}
/* ===== End finance visual income/expense patch ===== */

/* ================= COMPLAINT TIME / ETA PATCH ================= */
function pad2(n){return String(n).padStart(2,'0')}
function toDateTimeLocalValue(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function defaultResolveAt(){let d=new Date();d.setHours(d.getHours()+2);return toDateTimeLocalValue(d)}
function formatDT(v){
  if(!v)return '-';
  try{
    const d=new Date(v);
    if(!isNaN(d.getTime()))return d.toLocaleString();
  }catch(e){}
  return String(v).replace('T',' ');
}
function etaStatus(c){
  if(c.status==='Resolved')return '<span class="badge done">Resolved</span>';
  if(!c.resolveBy&&!c.eta)return '<span class="badge pending">No ETA</span>';
  const due=new Date(c.resolveBy||c.eta).getTime();
  if(!isNaN(due)&&Date.now()>due)return '<span class="badge expense">Overdue</span>';
  return '<span class="badge online">On Time</span>';
}
function complaints(){
  const dateTitle=(typeof complaintShowAll!=='undefined'&&complaintShowAll)?'(All Dates)':`(${typeof complaintDateFilter!=='undefined'?complaintDateFilter:today()})`;
  const dateControls=(typeof complaintDateFilter!=='undefined')?`<div class="actions"><input type="date" class="form-control" style="max-width:170px" value="${complaintDateFilter}" onchange="setComplaintDateFilter(this.value)"><button class="btn btn-l btn-sm" onclick="showTodayComplaintsFilter()">Today</button><button class="btn btn-i btn-sm" onclick="showAllComplaintsFilter()">Show All</button></div>`:'';
  content.innerHTML=stats()+`<div class="card"><div class="head"><h2>Add Complaint / Task</h2></div>
  <div class="row"><div class="fg"><label>Customer</label><input id="cName"></div><div class="fg"><label>Phone</label><input id="cPhone"></div><div class="fg"><label>Type</label><select id="cType"><option>Internet Down</option><option>Slow Speed</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Other</option></select></div></div>
  <div class="row"><div class="fg"><label>Assign To</label><select id="cAssign">${empOpts(U.role==='employee'?U.id:'')}</select></div><div class="fg"><label>Expected Resolve Time</label><input id="cEta" type="datetime-local" value="${defaultResolveAt()}"></div><div class="fg"><label>Details</label><input id="cDet" placeholder="Issue details"></div></div>
  <button class="btn btn-p" onclick="addComp()">Add Complaint</button></div>
  <div class="card"><div class="head"><h2>Complaint List ${dateTitle}</h2>${dateControls}</div>${compTable()}</div>`;
}
function addComp(){
  let assigned=U.role==='employee'?U.id:cAssign.value;
  if(!cName.value.trim()||!cPhone.value.trim())return toast('Customer and phone required','error');
  let rec={id:id('c'),name:cName.value.trim(),phone:cPhone.value.trim(),type:cType.value,assigned,det:cDet.value.trim(),status:'Pending',date:today(),time:now(),createdAt:now(),resolveBy:cEta.value||'',eta:cEta.value||'',resolvedAt:'',by:key()};
  S.complaints.push(rec);save();if(typeof fbSet==='function')fbSet('complaints',rec);toast('Complaint added with expected resolve time','success');beep();complaints();
}
function compTable(){
  let r=myComp().slice().reverse();
  if(typeof complaintShowAll!=='undefined' && !complaintShowAll) r=r.filter(c=>(c.date||'')===complaintDateFilter);
  if(!r.length)return`<div class="empty">No complaints ${typeof complaintShowAll!=='undefined'&&!complaintShowAll?'on '+complaintDateFilter:''}</div>`;
  return`<div class="tbl"><table><thead><tr><th>ID</th><th>Customer</th><th>Type</th><th>Assigned</th><th>Status</th><th>Created Time</th><th>Expected Resolve</th><th>Resolved Time</th><th>Action</th></tr></thead><tbody>${r.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.name)}</b><br>${esc(c.phone)}<br><small>${esc(c.det)}</small></td><td>${esc(c.type)}</td><td>${esc(empName(c.assigned))}</td><td><span class="badge ${c.status==='Resolved'?'done':'pending'}">${c.status}</span><br>${etaStatus(c)}</td><td>${esc(c.time||c.createdAt||c.date||'-')}</td><td><b>${esc(formatDT(c.resolveBy||c.eta))}</b></td><td>${esc(c.resolvedAt||'-')}</td><td>${adminButtons('complaint',c.id,`<button class="btn btn-s btn-sm" onclick="sendComplaintWA('${c.id}')">WhatsApp</button>${c.status!=='Resolved'?` <button class="btn btn-s btn-sm" onclick="resComp('${c.id}')">Resolve</button>`:''}`)}</td></tr>`).join('')}</tbody></table></div>`;
}
function complaintMsg(c){return`*Fire.net.pk Complaint Update*
Complaint ID: ${c.id}
Customer: ${c.name}
Phone: ${c.phone}
Type: ${c.type}
Status: ${c.status}
Assigned To: ${empName(c.assigned)}
Date: ${c.date}
Created Time: ${c.time||c.createdAt||'-'}
Expected Resolve Time: ${formatDT(c.resolveBy||c.eta)}
Resolved Time: ${c.resolvedAt||'-'}

Details: ${c.det||'-'}

Thank you,
Fire.net.pk Support`}
function sendComplaintWA(i){let c=S.complaints.find(x=>x.id===i);if(!c)return toast('Complaint not found','error');if(!c.phone)return toast('Customer phone not available','error');window.open('https://wa.me/'+String(c.phone).replace(/\D/g,'')+'?text='+encodeURIComponent(complaintMsg(c)),'_blank')}
function resComp(i){let c=S.complaints.find(x=>x.id===i);if(c){c.status='Resolved';c.resolvedAt=now();if(typeof fbSet==='function')fbSet('complaints',c)}save();toast('Complaint resolved with resolved time','success');complaints()}
/* ================= END COMPLAINT TIME / ETA PATCH ================= */

</script>


<script>
/* ================= INVOICE RECEIVED / DUE + AUTO FINANCE INCOME PATCH ================= */
function invPaymentStatus(v){
  const total=Number(v.total)||0, rec=Number(v.received)||0, due=Math.max(0,total-rec);
  if(due<=0) return 'Paid';
  if(rec>0) return 'Partial';
  return 'Due';
}
function invoicePaymentTag(v){
  const st=invPaymentStatus(v);
  return `<span class="badge ${st==='Paid'?'done':st==='Partial'?'pending':'tag-type-expense'}">${st}</span>`;
}
function getInvoiceDue(v){ return Math.max(0,(Number(v.total)||0)-(Number(v.received)||0)); }
function invoicePaymentModeOptions(selected='cash'){
  return `<option value="cash" ${selected==='cash'?'selected':''}>Cash</option><option value="online" ${selected==='online'?'selected':''}>Online</option>`;
}
function toggleInvoiceOnlineBox(){
  const box=document.getElementById('invOnlineBox');
  const mode=document.getElementById('invPayMode')?.value || 'cash';
  if(box) box.style.display = mode==='online' ? 'block' : 'none';
}
function invoice(){
  content.innerHTML=`<div class="card"><div class="head"><h2>Create Invoice</h2><button class="btn btn-l btn-sm" onclick="draft=[];invoice()">Clear</button></div>
  <div class="row"><div class="fg"><label>Customer</label><input id="invCust" placeholder="Customer name"></div><div class="fg"><label>WhatsApp</label><input id="invPhone" placeholder="923xx"></div><div class="fg"><label>Work Type</label><select id="invWork" onchange="toggleInvoiceRewardBox()"><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Repair</option><option>Other Work</option></select></div></div>
  <div class="row two" id="newConnectionRewardBox"><div class="fg"><label>Reward Source</label><select id="invRewardSource"><option value="New Connection">1. New Connection</option><option value="Invoice">2. Invoice</option></select></div><div class="fg"><label>Reference / Reward Employee</label><select id="invRewardEmp"><option value="">Select Employee</option>${empOpts()}</select></div></div>
  <div class="item-line"><div class="fg"><label>Product / Service</label><input id="itName" placeholder="Router / Wire / Installation"></div><div class="fg"><label>Qty</label><input id="itQty" type="number" value="1"></div><div class="fg"><label>Rate</label><input id="itRate" type="number" value="0"></div><button class="btn btn-i" onclick="addItem()">Add</button></div>
  <div id="itemsArea"></div>
  <div class="row"><div class="fg"><label>Discount</label><input id="disc" type="number" value="0" oninput="drawItems()"></div><div class="fg"><label>Amount Received</label><input id="invReceived" type="number" value="0" oninput="drawItems()"></div><div class="fg"><label>Payment Mode</label><select id="invPayMode" onchange="toggleInvoiceOnlineBox()">${invoicePaymentModeOptions('cash')}</select></div></div>
  <div class="row"><div class="fg" id="invOnlineBox"><label>Online Account</label><input id="invOnline" placeholder="JazzCash / Easypaisa / Bank"></div><div class="fg"><label>Receiver Name</label><input id="invReceiver" placeholder="Receiver / Collector" value="${esc(U?.name||'')}"></div><div class="fg"><label>Notes</label><input id="invNotes"></div></div>
  <div id="invoiceDueBox"></div>
  <div class="actions"><button class="btn btn-p" onclick="saveInv()">Save Invoice</button><button class="btn btn-s" onclick="sendDraftInv()">Send WhatsApp</button></div></div>
  <div class="card"><div class="head"><h2>Invoice Summary</h2></div>${invoiceSummaryHtml()}</div>
  <div class="card"><div class="head"><h2>Invoice History</h2></div>${invTable()}</div>
  <div class="card"><div class="head"><h2>Due Invoices</h2></div>${dueInvoiceTable()}</div>`;
  drawItems();toggleInvoiceRewardBox();toggleInvoiceOnlineBox();
}
function drawItems(){
  let a=document.getElementById('itemsArea'); if(!a)return;
  let t=totals();
  let received=Number(document.getElementById('invReceived')?.value)||0;
  if(received>t.total){ received=t.total; const el=document.getElementById('invReceived'); if(el)el.value=t.total; }
  const due=Math.max(0,t.total-received);
  a.innerHTML=draft.length?`<div class="tbl"><table><thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Total</th><th></th></tr></thead><tbody>${draft.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.rate)}</td><td>${money(x.qty*x.rate)}</td><td><button class="btn btn-e btn-sm" onclick="remItem(${i})">X</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No items added</div>';
  const dueBox=document.getElementById('invoiceDueBox');
  if(dueBox){dueBox.innerHTML=`<div class="summary"><div class="sum">Subtotal<b>${money(t.sub)}</b></div><div class="sum">Discount<b>${money(t.disc)}</b></div><div class="sum">Invoice Total<b>${money(t.total)}</b></div><div class="sum">Received<b class="money-plus">${money(received)}</b></div><div class="sum">Due<b class="money-minus">${money(due)}</b></div></div>`;}
}
function invObj(){
  let t=totals();
  let empId=document.getElementById('invRewardEmp')?.value||'';
  let received=Math.min(Number(document.getElementById('invReceived')?.value)||0,t.total);
  let due=Math.max(0,t.total-received);

function pad2(n){return String(n).padStart(2,'0')}
function toDateTimeLocalValue(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`}
function defaultResolveAt(){let d=new Date();d.setHours(d.getHours()+2);return toDateTimeLocalValue(d)}
function formatDT(v){
  if(!v)return '-';
  try{
    const d=new Date(v);
    if(!isNaN(d.getTime()))return d.toLocaleString();
  }catch(e){}
  return String(v).replace('T',' ');
}
function etaStatus(c){
  if(c.status==='Resolved')return '<span class="badge done">Resolved</span>';
  if(!c.resolveBy&&!c.eta)return '<span class="badge pending">No ETA</span>';
  const due=new Date(c.resolveBy||c.eta).getTime();
  if(!isNaN(due)&&Date.now()>due)return '<span class="badge expense">Overdue</span>';
  return '<span class="badge online">On Time</span>';
}

  return r;

function employeeFinanceSummary(entries){
  const map = {};
  entries.forEach(e=>{
    const id = financeEntryEmployeeId(e);
    const name = financeEntryEmployeeName(e);
    if(!map[id]) map[id] = {id,name,income:0,expense:0,cash:0,online:0,balance:0,count:0};
    const amt = Number(e.amount)||0;
    const type = (typeof normalizeFinanceType==='function'?normalizeFinanceType(e):(e.type||'income'));
    const mode = (typeof normalizeFinanceMode==='function'?normalizeFinanceMode(e):(e.mode||'cash'));
    map[id].count++;
    if(type==='expense') map[id].expense += amt; else { map[id].income += amt; if(mode==='online') map[id].online += amt; else map[id].cash += amt; }
  });
  Object.values(map).forEach(x=>x.balance=x.income-x.expense);
  return Object.values(map).sort((a,b)=>b.balance-a.balance);
}
function employeeFinanceSummaryHtml(entries){
  if(U.role!=='admin') return '';
  const rows = employeeFinanceSummary(entries);
  if(!rows.length) return '<div class="empty">No employee-wise finance summary</div>';
  return `<div class="card"><div class="head"><h2>Employee-wise Amount Summary</h2><div class="actions"><button class="btn btn-l btn-sm" onclick="printFinanceReport()">Print Report</button><button class="btn btn-s btn-sm" onclick="sendFinanceReportWhatsApp()">Send Report</button></div></div>
  <div class="tbl"><table><thead><tr><th>Employee</th><th>Entries</th><th>Income</th><th>Expense</th><th>Cash</th><th>Online</th><th>Balance / Amount With Employee</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.count}</td><td class="money-plus">${money(r.income)}</td><td class="money-minus">${money(r.expense)}</td><td>${money(r.cash)}</td><td>${money(r.online)}</td><td><b>${money(r.balance)}</b></td></tr>`).join('')}
  </tbody></table></div></div>`;
}
function financeReportText(entries=filteredFinanceEntries()){
  const titleDate = financeShowAll ? 'All Dates' : financeDateFilter;
  const empTitle = financeEmployeeFilter==='all' ? 'All Employees' : (financeEmployeeFilter==='admin'?'Admin':empName(financeEmployeeFilter));
  const s = (typeof financeVisualSummary==='function') ? financeVisualSummary(entries) : {income:calc(entries).inc,expense:calc(entries).exp,cashIncome:calc(entries).cash,onlineIncome:calc(entries).online,cashExpense:0,onlineExpense:0,balance:calc(entries).bal};
  const empRows = employeeFinanceSummary(entries);
  return `*Fire.net.pk Finance Report*\nDate: ${titleDate}\nEmployee Filter: ${empTitle}\n\n*Summary*\nTotal Income: ${money(s.income)}\nTotal Expense: ${money(s.expense)}\nCash Income: ${money(s.cashIncome)}\nOnline Income: ${money(s.onlineIncome)}\nCash Expense: ${money(s.cashExpense||0)}\nOnline Expense: ${money(s.onlineExpense||0)}\nNet Balance: ${money(s.balance)}\n\n*Employee-wise Amount*\n${empRows.map((r,i)=>`${i+1}. ${r.name}: Balance ${money(r.balance)} | Income ${money(r.income)} | Expense ${money(r.expense)} | Cash ${money(r.cash)} | Online ${money(r.online)}`).join('\n') || 'No data'}\n\n*Entries*\n${entries.map((e,i)=>`${i+1}. ${e.date||''} | ${financeEntryEmployeeName(e)} | ${(typeof normalizeFinanceType==='function'?normalizeFinanceType(e):e.type||'income').toUpperCase()} | ${(typeof normalizeFinanceMode==='function'?normalizeFinanceMode(e):e.mode||'cash').toUpperCase()} | Paid By: ${(typeof getFinanceCustomer==='function'?getFinanceCustomer(e):(e.customer||e.paidBy||'-'))} | ${e.cat||e.category||'-'} | ${((typeof normalizeFinanceType==='function'?normalizeFinanceType(e):e.type)==='expense')?'- ':'+ '}${money(e.amount)} | Receiver: ${e.receiver||'-'}${(e.online||e.onlineAccount)?' | Account: '+(e.online||e.onlineAccount):''}`).join('\n') || 'No entries'}`;
}
function printFinanceReport(){
  const text = financeReportText().replace(/\n/g,'<br>');
  const w = window.open('', '_blank');
  w.document.write(`<html><head><title>Finance Report</title><style>body{font-family:Arial;padding:20px;line-height:1.6} h1{color:#e74c3c}</style></head><body><h1>Fire.net.pk Finance Report</h1><div>${text}</div><script>window.print()<\/script></body></html>`);
  w.document.close();
}
function sendFinanceReportWhatsApp(){
  const p = prompt('WhatsApp number for finance report (923xxxxxxxxx)');
  if(p) window.open('https://wa.me/'+String(p).replace(/\D/g,'')+'?text='+encodeURIComponent(financeReportText()),'_blank');
}
function dailyReport(){ sendFinanceReportWhatsApp(); }
function finance(){
  const entries = filteredFinanceEntries();
  const s = (typeof financeVisualSummary==='function') ? financeVisualSummary(entries) : null;
  const f = s ? {cash:s.cashIncome,online:s.onlineIncome,inc:s.income,exp:s.expense,bal:s.balance} : calc(entries);
  content.innerHTML = `${typeof financeSummaryHtml==='function'&&s?financeSummaryHtml(s):`<div class="summary"><div class="sum">Income<b>${money(f.inc)}</b></div><div class="sum">Expenses<b>${money(f.exp)}</b></div><div class="sum">Cash<b>${money(f.cash)}</b></div><div class="sum">Online<b>${money(f.online)}</b></div><div class="sum">Balance<b>${money(f.bal)}</b></div></div>`}
  ${employeeFinanceSummaryHtml(entries)}
  <div class="card"><div class="head"><h2>Add Account Entry</h2></div>
  <div class="row"><div class="fg"><label>Type</label><select id="ft"><option value="income">Income</option><option value="expense">Expense</option></select></div><div class="fg"><label>Mode</label><select id="fm" onchange="onBox()"><option value="cash">Cash</option><option value="online">Online</option></select></div><div class="fg"><label>Category</label><select id="fc"><option>Monthly Fee</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Office Expense</option><option>Other</option></select></div></div>
  <div class="row"><div class="fg"><label>Amount</label><input id="fa" type="number" value="0"></div><div class="fg"><label>Customer Name / Paid By</label><input id="fCustomer" placeholder="Who paid?"></div><div class="fg"><label>Receiver Name</label><input id="fr" placeholder="Receiver"></div></div>
  <div class="row"><div class="fg" id="ob"><label>Online Account</label><input id="fo" placeholder="JazzCash / Bank"></div><div class="fg"><label>Client WhatsApp</label><input id="fp" placeholder="923xx"></div><div class="fg"><label>Notes</label><input id="fn"></div></div>
  <button class="btn btn-p" onclick="addFin()">Save Entry</button></div>
  <div class="card"><div class="head"><h2>Account List ${financeShowAll?'(All Data)':'('+financeDateFilter+')'}</h2><div class="actions">
  ${U.role==='admin'?`<select class="form-control" style="max-width:230px" onchange="setFinanceEmployeeFilter(this.value)">${employeeFinanceOptions()}</select>`:''}
  <input type="date" class="form-control" style="max-width:170px" value="${financeDateFilter}" onchange="setFinanceDateFilter(this.value)"><button class="btn btn-l btn-sm" onclick="showTodayFinanceFilter()">Today</button><button class="btn btn-i btn-sm" onclick="showAllFinanceFilter()">Show All</button><button class="btn btn-i btn-sm" onclick="fetchAllFinanceData()">Fetch Firebase</button><button class="btn btn-l btn-sm" onclick="printFinanceReport()">Print</button><button class="btn btn-s btn-sm" onclick="sendFinanceReportWhatsApp()">Send Report</button></div></div>${finTable()}</div>`;
  onBox();
}
function finTable(){
  let r = filteredFinanceEntries().slice().reverse();
  if(!r.length) return `<div class="empty">No entries ${financeShowAll?'':'on '+financeDateFilter}</div>`;
  const typeOf = e => (typeof normalizeFinanceType==='function'?normalizeFinanceType(e):(e.type||'income'));
  const modeOf = e => (typeof normalizeFinanceMode==='function'?normalizeFinanceMode(e):(e.mode||'cash'));
  let sec=(title,arr)=>`<h3 style="margin:12px 0">${title}</h3>${arr.length?`<div class="tbl"><table><thead><tr><th>Time</th><th>Date</th><th>Employee</th><th>Type</th><th>Mode</th><th>Paid By</th><th>Category</th><th>Receiver</th><th>Account</th><th>Amount</th><th>Action</th></tr></thead><tbody>${arr.map(e=>`<tr class="${typeOf(e)==='expense'?'finance-expense-row':'finance-income-row'}"><td>${e.time||e.createdAt||''}</td><td>${e.date||''}</td><td>${esc(financeEntryEmployeeName(e))}</td><td><span class="badge ${typeOf(e)==='expense'?'expense':'done'}">${typeOf(e).toUpperCase()}</span></td><td><span class="badge ${modeOf(e)==='online'?'online':'cash'}">${modeOf(e).toUpperCase()}</span></td><td>${esc(typeof getFinanceCustomer==='function'?getFinanceCustomer(e):(e.customer||e.paidBy||'-'))}</td><td>${esc(e.cat||e.category||'-')}</td><td>${esc(e.receiver||'-')}</td><td>${esc(e.online||e.onlineAccount||'-')}</td><td class="${typeOf(e)==='expense'?'money-minus':'money-plus'}">${typeOf(e)==='expense'?'- ':'+ '}${money(e.amount)}</td><td>${typeof financeActionButtons==='function'?financeActionButtons(e):''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">None</div>'}`;
  return sec('Income Entries', r.filter(e=>typeOf(e)!=='expense')) + sec('Expense Entries', r.filter(e=>typeOf(e)==='expense'));
}

function assignedEmployeePhone(c){
  const emp=(S.employees||[]).find(e=>e.id===c.assigned);
  return emp?.phone || '';
}
function complaintEmployeeMsg(c){
  return `🔥 *Fire.net.pk Complaint Update*\nComplaint ID: ${c.id}\nCustomer: ${c.name}\nCustomer Phone: ${c.phone}\nType: ${c.type}\nStatus: ${c.status}\nAssigned To: ${empName(c.assigned)}\nCreated: ${c.time||c.createdAt||c.date||'-'}\nExpected Resolve: ${typeof formatDT==='function'?formatDT(c.resolveBy||c.eta):(c.resolveBy||c.eta||'-')}\nDetails: ${c.det||'-'}\n\nPlease update this complaint in your employee portal.`;
}
function sendComplaintEmployeeWA(i){
  const c=S.complaints.find(x=>x.id===i); if(!c) return toast('Complaint not found','error');
  const phone=assignedEmployeePhone(c); if(!phone) return toast('Assigned employee phone/login not available','error');
  window.open('https://wa.me/'+String(phone).replace(/\D/g,'')+'?text='+encodeURIComponent(complaintEmployeeMsg(c)),'_blank');
}
function complaints(){
  content.innerHTML=stats()+`<div class="card"><div class="head"><h2>Add Complaint / Task</h2></div><div class="row"><div class="fg"><label>Customer</label><input id="cName"></div><div class="fg"><label>Phone</label><input id="cPhone"></div><div class="fg"><label>Type</label><select id="cType"><option>Internet Down</option><option>Slow Speed</option><option>New Connection</option><option>Wire Change</option><option>Device Change</option><option>Package Change</option><option>Other</option></select></div></div><div class="row"><div class="fg"><label>Assign To</label><select id="cAssign">${empOpts(U.role==='employee'?U.id:'')}</select></div><div class="fg"><label>Expected Resolve Time</label><input id="cEta" type="datetime-local"></div><div class="fg"><label>Details</label><input id="cDet"></div></div><label style="font-weight:900"><input type="checkbox" id="sendEmpWA" checked> Send WhatsApp to assigned employee</label><br><br><button class="btn btn-p" onclick="addComp()">Add Complaint</button></div><div class="card"><div class="head"><h2>Complaint List</h2></div>${compTable()}</div>`;
}
function addComp(){
  let assigned=U.role==='employee'?U.id:cAssign.value;
  if(!cName.value.trim()||!cPhone.value.trim())return toast('Customer and phone required','error');
  let rec={id:id('c'),name:cName.value.trim(),phone:cPhone.value.trim(),type:cType.value,assigned,det:cDet.value.trim(),status:'Pending',date:today(),time:now(),resolveBy:cEta.value||'',by:key()};
  S.complaints.push(rec);save(); if(typeof fbSet==='function') fbSet('complaints',rec);
  toast('Complaint added','success');beep();
  if(document.getElementById('sendEmpWA')?.checked) setTimeout(()=>sendComplaintEmployeeWA(rec.id),200);
  complaints();
}
function compTable(){
  let r=myComp().slice().reverse();if(!r.length)return'<div class="empty">No complaints</div>';
  return`<div class="tbl"><table><thead><tr><th>ID</th><th>Customer</th><th>Type</th><th>Assigned</th><th>Status</th><th>Created Time</th><th>Expected Resolve</th><th>Resolved Time</th><th>Action</th></tr></thead><tbody>${r.map(c=>`<tr><td>${c.id}</td><td><b>${esc(c.name)}</b><br>${esc(c.phone)}<br><small>${esc(c.det)}</small></td><td>${esc(c.type)}</td><td>${esc(empName(c.assigned))}</td><td><span class="badge ${c.status==='Resolved'?'done':'pending'}">${c.status}</span><br>${typeof etaStatus==='function'?etaStatus(c):''}</td><td>${esc(c.time||c.createdAt||c.date||'-')}</td><td><b>${esc(typeof formatDT==='function'?formatDT(c.resolveBy||c.eta):(c.resolveBy||c.eta||'-'))}</b></td><td>${esc(c.resolvedAt||'-')}</td><td>${typeof adminButtons==='function'?adminButtons('complaint',c.id,`<button class="btn btn-s btn-sm" onclick="sendComplaintWA('${c.id}')">Customer WA</button> <button class="btn btn-i btn-sm" onclick="sendComplaintEmployeeWA('${c.id}')">Employee WA</button>${c.status!=='Resolved'?` <button class="btn btn-s btn-sm" onclick="resComp('${c.id}')">Resolve</button>`:''}`):''}</td></tr>`).join('')}</tbody></table></div>`;
}
/* ================= END FINANCE EMPLOYEE FILTER + REPORT + EMPLOYEE COMPLAINT WHATSAPP PATCH ================= */

</script>
</body></html>
